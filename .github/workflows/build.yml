name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Build Flutter APK
        run: |
          # Check where pubspec.yaml is located
          if [ -f "mobile_app/pubspec.yaml" ]; then
            echo "Found project inside mobile_app folder"
            cd mobile_app
          elif [ -f "pubspec.yaml" ]; then
            echo "Found project in root directory"
          else
            echo "Creating fresh Flutter project structure..."
            flutter create . --org com.musicradio --platforms=android
          fi

          # Ensure Android directory exists
          if [ ! -d "android" ]; then
            flutter create . --org com.musicradio --platforms=android
          fi

          # Inject Internet Permission into AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' $MANIFEST
          fi

          # Update minSdk to 24 for file_picker and path_provider
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' $BUILD_GRADLE
            sed -i 's/minSdk = flutter.minSdkVersion/minSdkVersion 24/g' $BUILD_GRADLE
          fi

          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
