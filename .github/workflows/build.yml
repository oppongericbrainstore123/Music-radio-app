name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Generate and Build App
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: |
          flutter create app_project --org com.musicradio --platforms=android
          MAIN=$(find mobile_app -name main.dart | head -n 1)
          PUB=$(find mobile_app -name pubspec.yaml | head -n 1)
          echo "Using: $MAIN | $PUB"
          cp "$PUB" app_project/pubspec.yaml
          cp "$MAIN" app_project/lib/main.dart
          cd app_project
          python3 - << 'PY'
          import glob

          p = 'android/app/src/main/AndroidManifest.xml'
          clean_manifest = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService"/>
                  </intent>
              </queries>
              <application
                  android:name="android.app.Application"
                  android:label="Music Radio Hub"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
                  <service android:name="com.ryanheise.audioservice.AudioService" android:foregroundServiceType="mediaPlayback" android:exported="true">
                      <intent-filter><action android:name="android.media.browse.MediaBrowserService"/></intent-filter>
                  </service>
                  <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MEDIA_BUTTON"/></intent-filter>
                  </receiver>
              </application>
          </manifest>'''
          open(p, 'w').write(clean_manifest)

          for f in glob.glob('android/app/src/main/kotlin/**/MainActivity.kt', recursive=True):
              k = open(f).read()
              k = k.replace('import io.flutter.embedding.android.FlutterActivity',
                            'import com.ryanheise.audioservice.AudioServiceActivity')
              k = k.replace('FlutterActivity()', 'AudioServiceActivity()')
              open(f, 'w').write(k)

          for g in ['android/app/build.gradle', 'android/app/build.gradle.kts']:
              try:
                  t = open(g).read()
              except FileNotFoundError:
                  continue
              t = t.replace('minSdkVersion flutter.minSdkVersion',
                            "minSdkVersion 24\n        manifestPlaceholders = [appAuthRedirectScheme: 'com.musicradio.app']")
              t = t.replace('minSdk = flutter.minSdkVersion',
                            'minSdk = 24\n        manifestPlaceholders["appAuthRedirectScheme"] = "com.musicradio.app"')
              open(g, 'w').write(t)
          PY
          flutter pub get
          flutter build apk --release \
            --dart-define=SPOTIFY_CLIENT_ID="$SPOTIFY_CLIENT_ID" \
            --dart-define=JAMENDO_CLIENT_ID="$JAMENDO_CLIENT_ID"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app_project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
