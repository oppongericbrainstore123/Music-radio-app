name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Create Project, Inject Files & Build APK
        run: |
          flutter create my_app --org com.musicradio --platforms=android
          
          # Automatically find and copy main.dart from anywhere in the repository
          MAIN_FILE=$(find . -name "main.dart" ! -path "*/my_app/*" | head -n 1)
          if [ -n "$MAIN_FILE" ]; then
            cp "$MAIN_FILE" my_app/lib/main.dart
            echo "Successfully copied $MAIN_FILE"
          else
            echo "Warning: main.dart not found!"
          fi

          # Automatically find and copy pubspec.yaml from anywhere in the repository
          PUBSPEC_FILE=$(find . -name "pubspec.yaml" ! -path "*/my_app/*" | head -n 1)
          if [ -n "$PUBSPEC_FILE" ]; then
            cp "$PUBSPEC_FILE" my_app/pubspec.yaml
            echo "Successfully copied $PUBSPEC_FILE"
          else
            echo "Warning: pubspec.yaml not found!"
          fi

          cd my_app

          # Automatically inject Internet Permission into AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' $MANIFEST
          fi

          # Update minSdk to 21 for audio streaming plugins
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' $BUILD_GRADLE
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' $BUILD_GRADLE
          fi

          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
