          class EqualizerScreen extends StatefulWidget {
            const EqualizerScreen({super.key});

            @override
            State<EqualizerScreen> createState() => _EqualizerScreenState();
          }

          class _EqualizerScreenState extends State<EqualizerScreen> {
            String _preset = 'Custom';

            Future<void> _applyPreset(AndroidEqualizerParameters p, String name) async {
              setState(() => _preset = name);
              final bands = p.bands;
              final double min = p.minDecibels;
              final double max = p.maxDecibels;

              for (var b in bands) {
                double target = 0.0;
                final freq = b.centerFrequency;
                if (name == 'Bass Boost') {
                  if (freq < 300) target = max * 0.8;
                } else if (name == 'Rock') {
                  if (freq < 250 || freq > 4000) target = max * 0.6;
                } else if (name == 'Pop') {
                  if (freq >= 500 && freq <= 3000) target = max * 0.5;
                } else if (name == 'Classical') {
                  if (freq < 500 || freq > 5000) target = max * 0.4;
                } else if (name == 'Vocal') {
                  if (freq >= 1000 && freq <= 4000) target = max * 0.7;
                }
                await b.setGain(target.clamp(min, max));
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Sound Studio')),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    StreamBuilder<bool>(
                      stream: player.equalizer.enabledStream,
                      builder: (context, snap) {
                        final on = snap.data ?? false;
                        return SwitchListTile(
                          title: const Text('Equalizer Active', style: TextStyle(fontWeight: FontWeight.bold)),
                          value: on,
                          onChanged: player.equalizer.setEnabled,
                        );
                      },
                    ),
                    const Divider(),
                    const Text('Presets', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                    const SizedBox(height: 8),
                    FutureBuilder<AndroidEqualizerParameters>(
                      future: player.equalizer.parameters,
                      builder: (context, snap) {
                        final p = snap.data;
                        return Wrap(
                          spacing: 8,
                          children: ['Flat', 'Bass Boost', 'Rock', 'Pop', 'Classical', 'Vocal'].map((name) {
                            return ChoiceChip(
                              label: Text(name),
                              selected: _preset == name,
                              onSelected: (_) {
                                if (p != null) _applyPreset(p, name);
                              },
                            );
                          }).toList(),
                        );
                      },
                    ),
                    const Divider(height: 24),
                    const Text('Frequency Bands', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                    const SizedBox(height: 8),
                    FutureBuilder<AndroidEqualizerParameters>(
                      future: player.equalizer.parameters,
                      builder: (context, snap) {
                        final p = snap.data;
                        if (p == null) {
                          return const Padding(
                            padding: EdgeInsets.all(24),
                            child: Center(child: Text('Start playing a song first to unlock the bands.', textAlign: TextAlign.center)),
                          );
                        }
                        return Column(
                          children: p.bands.map((b) {
                            return Padding(
                              padding: const EdgeInsets.symmetric(vertical: 4),
                              child: Column(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  Text('${b.centerFrequency.round()} Hz', style: const TextStyle(color: Colors.grey)),
                                  StreamBuilder<double>(
                                    stream: b.gainStream,
                                    builder: (context, s) {
                                      final v = (s.data ?? b.gain).clamp(p.minDecibels, p.maxDecibels).toDouble();
                                      return Slider(
                                        min: p.minDecibels,
                                        max: p.maxDecibels,
                                        value: v,
                                        onChanged: (val) {
                                          setState(() => _preset = 'Custom');
                                          b.setGain(val);
                                        },
                                      );
                                    },
                                  ),
                                ],
                              ),
                            );
                          }).toList(),
                        );
                      },
                    ),
                    const Divider(height: 24),
                    const Text('Volume & Loudness Boost', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                    StreamBuilder<double>(
                      stream: player.loudness.targetGainStream,
                      builder: (context, s) {
                        final v = (s.data ?? 0.0).clamp(0.0, 10.0).toDouble();
                        return Slider(
                          min: 0,
                          max: 10,
                          divisions: 10,
                          label: '${v.toStringAsFixed(1)} dB',
                          value: v,
                          onChanged: player.loudness.setTargetGain,
                        );
                      },
                    ),
                  ],
                ),
              );
            }
          }

          class DjTab extends StatefulWidget {
            const DjTab({super.key});

            @override
            State<DjTab> createState() => _DjTabState();
          }

          class _DjTabState extends State<DjTab> {
            final AudioPlayer deckA = AudioPlayer();
            final AudioPlayer deckB = AudioPlayer();
            final AudioPlayer fxPlayer = AudioPlayer();
            double crossfade = 0.5;
            double tempoA = 1.0;
            double tempoB = 1.0;
            bool eqKillLowA = false;
            bool eqKillMidA = false;
            bool eqKillHighA = false;
            bool eqKillLowB = false;
            bool eqKillMidB = false;
            bool eqKillHighB = false;
            Track? trackA;
            Track? trackB;

            @override
            void dispose() {
              deckA.dispose();
              deckB.dispose();
              fxPlayer.dispose();
              super.dispose();
            }

            void _updateVolumes() {
              deckA.setVolume((1.0 - crossfade) * (eqKillLowA && eqKillMidA && eqKillHighA ? 0.0 : 1.0));
              deckB.setVolume(crossfade * (eqKillLowB && eqKillMidB && eqKillHighB ? 0.0 : 1.0));
            }

            Future<void> _triggerSfx(String type) async {
              try {
                final urls = {
                  'horn': 'https://www.myinstants.com/media/sounds/air-horn-club-dj.mp3',
                  'scratch': 'https://www.myinstants.com/media/sounds/dj-scratch-sound-effect.mp3',
                  'siren': 'https://www.myinstants.com/media/sounds/police-siren-sound-effect.mp3',
                  'loop': 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'
                };
                final url = urls[type];
                if (url != null) {
                  await fxPlayer.setUrl(url);
                  await fxPlayer.play();
                }
              } catch (_) {}
            }

            Future<void> _pickTrack(bool isA) async {
              final List<Track> allTracks = [];
              allTracks.addAll(player.downloads);
              allTracks.addAll(player.favorites);
              allTracks.addAll(soundcloud.libraryTracks);

              try {
                final OnAudioQuery query = OnAudioQuery();
                final found = await query.querySongs(uriType: UriType.EXTERNAL, ignoreCase: true);
                for (final s in found) {
                  if ((s.duration ?? 0) < 30000) continue;
                  allTracks.add(Track(
                    id: 'dev-${s.id}',
                    title: s.title,
                    artist: s.artist ?? 'Unknown artist',
                    url: s.uri ?? 'file://${s.data}',
                    canDownload: false,
                  ));
                }
              } catch (_) {}

              final uniqueTracks = <String, Track>{};
              for (var t in allTracks) {
                uniqueTracks[t.id] = t;
              }
              final list = uniqueTracks.values.toList();

              if (list.isEmpty) {
                toast('No music found. Scan device music or add songs first!');
                return;
              }

              showModalBottomSheet(
                context: context,
                builder: (ctx) => ListView.builder(
                  itemCount: list.length,
                  itemBuilder: (_, i) {
                    final t = list[i];
                    return ListTile(
                      leading: Art(url: t.artwork, size: 40),
                      title: Text(t.title, maxLines: 1, overflow: TextOverflow.ellipsis),
                      subtitle: Text(t.artist, maxLines: 1, overflow: TextOverflow.ellipsis),
                      onTap: () async {
                        Navigator.of(ctx).pop();
                        setState(() {
                          if (isA) {
                            trackA = t;
                          } else {
                            trackB = t;
                          }
                        });
                        final playerRef = isA ? deckA : deckB;
                        await playerRef.setUrl(t.url);
                        playerRef.play();
                      },
                    );
                  },
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Padding(
                padding: const EdgeInsets.all(12),
                child: Column(
                  children: [
                    const Text('DJ Mix Studio & Sound Panel', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                    const SizedBox(height: 8),
                    Container(
                      padding: const EdgeInsets.all(8),
                      decoration: BoxDecoration(color: const Color(0xFF1E1E1E), borderRadius: BorderRadius.circular(8)),
                      child: Row(
                        mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                        children: [
                          ElevatedButton.icon(icon: const Icon(Icons.campaign, size: 16), label: const Text('Horn'), onPressed: () => _triggerSfx('horn')),
                          ElevatedButton.icon(icon: const Icon(Icons.disc_full, size: 16), label: const Text('Scratch'), onPressed: () => _triggerSfx('scratch')),
                          ElevatedButton.icon(icon: const Icon(Icons.alarm, size: 16), label: const Text('Siren'), onPressed: () => _triggerSfx('siren')),
                          ElevatedButton.icon(icon: const Icon(Icons.loop, size: 16), label: const Text('Loop Beat'), onPressed: () => _triggerSfx('loop')),
                        ],
                      ),
                    ),
                    const SizedBox(height: 8),
                    Expanded(
                      child: Row(
                        children: [
                          Expanded(child: _buildDeck('DECK A', trackA, deckA, tempoA, eqKillLowA, eqKillMidA, eqKillHighA, (v) {
                            setState(() => tempoA = v);
                            deckA.setSpeed(v);
                          }, (l, m, h) {
                            setState(() {
                              eqKillLowA = l;
                              eqKillMidA = m;
                              eqKillHighA = h;
                            });
                            _updateVolumes();
                          }, () {
                            if (trackB != null) {
                              setState(() => tempoA = tempoB);
                              deckA.setSpeed(tempoB);
                            }
                          }, () => _pickTrack(true))),
                          const SizedBox(width: 8),
                          Expanded(child: _buildDeck('DECK B', trackB, deckB, tempoB, eqKillLowB, eqKillMidB, eqKillHighB, (v) {
                            setState(() => tempoB = v);
                            deckB.setSpeed(v);
                          }, (l, m, h) {
                            setState(() {
                              eqKillLowB = l;
                              eqKillMidB = m;
                              eqKillHighB = h;
                            });
                            _updateVolumes();
                          }, () {
                            if (trackA != null) {
                              setState(() => tempoB = tempoA);
                              deckB.setSpeed(tempoA);
                            }
                          }, () => _pickTrack(false))),
                        ],
                      ),
                    ),
                    const SizedBox(height: 8),
                    const Text('Crossfader (A <---> B)', style: TextStyle(fontWeight: FontWeight.bold)),
                    Row(
                      children: [
                        const Text('A'),
                        Expanded(
                          child: Slider(
                            value: crossfade,
                            onChanged: (v) {
                              setState(() => crossfade = v);
                              _updateVolumes();
                            },
                          ),
                        ),
                        const Text('B'),
                      ],
                    ),
                  ],
                ),
              );
            }

            Widget _buildDeck(
              String name,
              Track? track,
              AudioPlayer p,
              double tempo,
              bool killLow,
              bool killMid,
              bool killHigh,
              ValueChanged<double> onTempo,
              Function(bool, bool, bool) onKill,
              VoidCallback onSync,
              VoidCallback onSelect,
            ) {
              return Card(
                color: const Color(0xFF1E1E1E),
                child: Padding(
                  padding: const EdgeInsets.all(8),
                  child: Column(
                    children: [
                      Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          Text(name, style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.greenAccent)),
                          OutlinedButton(onPressed: onSync, style: OutlinedButton.styleFrom(padding: const EdgeInsets.symmetric(horizontal: 4)), child: const Text('SYNC', style: TextStyle(fontSize: 10))),
                        ],
                      ),
                      const SizedBox(height: 2),
                      Art(url: track?.artwork ?? '', size: 52),
                      const SizedBox(height: 2),
                      Text(track?.title ?? 'No track', maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 12)),
                      Text(track?.artist ?? 'Tap Load', maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 10, color: Colors.grey)),
                      const SizedBox(height: 4),
                      OutlinedButton.icon(onPressed: onSelect, icon: const Icon(Icons.music_note, size: 12), label: const Text('Load', style: TextStyle(fontSize: 10))),
                      StreamBuilder<PlayerState>(
                        stream: p.playerStateStream,
                        builder: (context, snap) {
                          final playing = snap.data?.playing ?? false;
                          return Row(
                            mainAxisAlignment: MainAxisAlignment.center,
                            children: [
                              IconButton(
                                icon: Icon(playing ? Icons.pause_circle : Icons.play_circle, size: 26),
                                onPressed: track == null ? null : () => playing ? p.pause() : p.play(),
                              ),
                              IconButton(
                                icon: const Icon(Icons.replay, size: 20),
                                onPressed: track == null ? null : () => p.seek(Duration.zero),
                              ),
                            ],
                          );
                        },
                      ),
                      const Text('EQ Kills', style: TextStyle(fontSize: 9, color: Colors.grey)),
                      Row(
                        mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                        children: [
                          FilterChip(label: const Text('L', style: TextStyle(fontSize: 8)), selected: killLow, onSelected: (_) => onKill(!killLow, killMid, killHigh)),
                          FilterChip(label: const Text('M', style: TextStyle(fontSize: 8)), selected: killMid, onSelected: (_) => onKill(killLow, !killMid, killHigh)),
                          FilterChip(label: const Text('H', style: TextStyle(fontSize: 8)), selected: killHigh, onSelected: (_) => onKill(killLow, killMid, !killHigh)),
                        ],
                      ),
                      const SizedBox(height: 2),
                      Text('Tempo: ${tempo.toStringAsFixed(2)}x', style: const TextStyle(fontSize: 9, color: Colors.grey)),
                      Slider(
                        min: 0.5,
                        max: 2.0,
                        value: tempo,
                        onChanged: onTempo,
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class LocalTab extends StatefulWidget {
            const LocalTab({super.key});

            @override
            State<LocalTab> createState() => _LocalTabState();
          }

          class _LocalTabState extends State<LocalTab> {
            final OnAudioQuery _query = OnAudioQuery();
            bool _loading = true;
            bool _denied = false;
            List<Track> _songs = [];
            Map<String, List<Track>> _albums = {};
            Map<String, List<Track>> _artists = {};
            Map<String, List<Track>> _folders = {};

            @override
            void initState() {
              super.initState();
              _scan();
            }

            Future<void> _scan() async {
              setState(() {
                _loading = true;
                _denied = false;
              });
              try {
                var ok = await _query.permissionsStatus();
                if (!ok) ok = await _query.permissionsRequest();
                if (!ok) {
                  if (mounted) {
                    setState(() {
                      _denied = true;
                      _loading = false;
                    });
                  }
                  return;
                }
                final found = await _query.querySongs(
                  sortType: SongSortType.TITLE,
                  orderType: OrderType.ASC_OR_SMALLER,
                  uriType: UriType.EXTERNAL,
                  ignoreCase: true,
                );
                final songs = <Track>[];
                final albums = <String, List<Track>>{};
                final artists = <String, List<Track>>{};
                final folders = <String, List<Track>>{};
                for (final s in found) {
                  if ((s.duration ?? 0) < 30000) continue;
                  final artist = s.artist ?? 'Unknown artist';
                  final t = Track(
                    id: 'dev-${s.id}',
                    title: s.title,
                    artist: artist,
                    url: s.uri ?? 'file://${s.data}',
                    canDownload: false,
                  );
                  songs.add(t);
                  albums.putIfAbsent(s.album ?? 'Unknown album', () => []).add(t);
                  artists.putIfAbsent(artist, () => []).add(t);
                  final i = s.data.lastIndexOf('/');
                  folders.putIfAbsent(i > 0 ? s.data.substring(0, i) : '/', () => []).add(t);
                }
                if (mounted) {
                  setState(() {
                    _songs = songs;
                    _albums = albums;
                    _artists = artists;
                    _folders = folders;
                    _loading = false;
                  });
                }
              } catch (e) {
                if (mounted) setState(() => _loading = false);
              }
            }

            Widget _groups(Map<String, List<Track>> m, IconData icon, {bool folder = false}) {
              final keys = m.keys.toList()..sort((a, b) => a.toLowerCase().compareTo(b.toLowerCase()));
              return ListView.builder(
                itemCount: keys.length,
                itemBuilder: (_, i) {
                  final k = keys[i];
                  final tracks = m[k]!;
                  return ListTile(
                    leading: Icon(icon),
                    title: Text(folder ? k.split('/').last : k, maxLines: 1, overflow: TextOverflow.ellipsis),
                    subtitle: Text(folder ? k : '${tracks.length} songs', maxLines: 1, overflow: TextOverflow.ellipsis),
                    onTap: () => Navigator.of(context).push(MaterialPageRoute(
                      builder: (_) => TrackListPage(title: folder ? k.split('/').last : k, loader: () async => tracks),
                    )),
                  );
                },
              );
            }

            @override
            Widget build(BuildContext context) {
              if (_loading) return const Center(child: CircularProgressIndicator());
              if (_denied) {
                return Center(
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      const Text('Allow access to your music files to play them here.', textAlign: TextAlign.center),
                      const SizedBox(height: 12),
                      FilledButton(onPressed: _scan, child: const Text('Allow access')),
                    ],
                  ),
                );
              }
              if (_songs.isEmpty) {
                return Center(
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      const Text('No music files found on this device.'),
                      const SizedBox(height: 12),
                      OutlinedButton(onPressed: _scan, child: const Text('Scan again')),
                    ],
                  ),
                );
              }
              return DefaultTabController(
                length: 4,
                child: Column(
                  children: [
                    Row(
                      children: [
                        const Expanded(child: TabBar(tabs: [Tab(text: 'Music'), Tab(text: 'Album'), Tab(text: 'Artist'), Tab(text: 'Folder')])),
                        IconButton(icon: const Icon(Icons.refresh), tooltip: 'Scan again', onPressed: _scan),
                      ],
                    ),
                    Expanded(
                      child: TabBarView(
                        children: [
                          ListView.builder(
                            itemCount: _songs.length,
                            itemBuilder: (_, i) => TrackTile(track: _songs[i], onTap: () => player.playQueue(_songs, i)),
                          ),
                          _groups(_albums, Icons.album),
                          _groups(_artists, Icons.person),
                          _groups(_folders, Icons.folder, folder: true),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class DiscoverTab extends StatefulWidget {
            const DiscoverTab({super.key});

            @override
            State<DiscoverTab> createState() => _DiscoverTabState();
          }

          class _DiscoverTabState extends State<DiscoverTab> {
            static const List<Map<String, String>> _chips = [
              {'label': 'Trending'},
              {'label': 'Afrobeats', 'query': 'afrobeats'},
              {'label': 'Hip-Hop', 'genre': 'Hip-Hop/Rap'},
              {'label': 'R&B', 'genre': 'R&B/Soul'},
              {'label': 'Pop', 'genre': 'Pop'},
              {'label': 'Electronic', 'genre': 'Electronic'},
              {'label': 'Reggae', 'genre': 'Reggae'},
              {'label': 'Dancehall', 'genre': 'Dancehall'},
              {'label': 'Gospel', 'query': 'gospel'},
              {'label': 'Latin', 'genre': 'Latin'},
              {'label': 'Lo-Fi', 'genre': 'Lo-Fi'},
            ];

            int _chip = 0;
            List<Track> _tracks = [];
            List<Map<String, dynamic>> _playlists = [];
            bool _loading = true;
            String? _error;

            @override
            void initState() {
              super.initState();
              _loadPlaylists();
              _loadTracks();
            }

            Future<void> _loadPlaylists() async {
              try {
                final list = await getList(Uri.parse('$kApiBase/playlists/trending').replace(queryParameters: {'app_name': kAppName, 'time': 'week'}));
                if (mounted) {
                  setState(() => _playlists = list.whereType<Map>().map((m) => Map<String, dynamic>.from(m)).take(12).toList());
                }
              } catch (_) {}
            }

            Future<void> _loadTracks() async {
              setState(() {
                _loading = true;
                _error = null;
              });
              try {
                final c = _chips[_chip];
                final Uri uri;
                if (c['query'] != null) {
                  uri = Uri.parse('$kApiBase/tracks/search').replace(queryParameters: {'query': c['query']!, 'app_name': kAppName});
                } else {
                  final qp = <String, String>{'app_name': kAppName, 'time': 'week'};
                  if (c['genre'] != null) qp['genre'] = c['genre']!;
                  uri = Uri.parse('$kApiBase/tracks/trending').replace(queryParameters: qp);
                }
                final list = await getList(uri);
                if (mounted) setState(() => _tracks = audiusTracks(list));
              } catch (_) {
                if (mounted) setState(() => _error = 'Could not load music');
              }
              if (mounted) setState(() => _loading = false);
            }

            Widget _artistAvatar(FollowedArtist a) {
              return InkWell(
                onTap: () => Navigator.of(context).push(MaterialPageRoute(
                  builder: (_) => TrackListPage(title: a.name, loader: () => loadArtistTracks(a), follow: a),
                )),
                child: Padding(
                  padding: const EdgeInsets.only(right: 12),
                  child: SizedBox(
                    width: 72,
                    child: Column(
                      children: [
                        CircleAvatar(
                          radius: 30,
                          backgroundImage: a.image.isNotEmpty ? NetworkImage(a.image) : null,
                          child: a.image.isEmpty ? const Icon(Icons.person) : null,
                        ),
                        const SizedBox(height: 6),
                        Text(a.name, maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 12)),
                      ],
                    ),
                  ),
                ),
              );
            }

            Widget _playlistCard(Map<String, dynamic> p) {
              final name = (p['playlist_name'] ?? 'Playlist').toString();
              final id = p['id'].toString();
              return InkWell(
                onTap: () => Navigator.of(context).push(MaterialPageRoute(
                  builder: (_) => TrackListPage(
                    title: name,
                    loader: () async => audiusTracks(await getList(Uri.parse('$kApiBase/playlists/$id/tracks').replace(queryParameters: {'app_name': kAppName}))),
                  ),
                )),
