name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Generate and Build App
        run: |
          flutter create app_project --org com.musicradio --platforms=android
          cd app_project

          # Write pubspec.yaml with all required multimedia dependencies
          cat << 'EOF' > pubspec.yaml
          name: music_radio_app
          description: A multimedia radio, streaming, and local player app.
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            just_audio: ^0.9.36
            http: ^1.2.0
            path_provider: ^2.1.2
            file_picker: ^6.1.1
            permission_handler: ^11.3.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

          # Write lib/main.dart with Full Screen Pop-up Player, Track Details, and Unrestricted Streams
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:just_audio/just_audio.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:http/http.dart' as http;
          import 'dart:io';
          import 'dart:convert';
          import 'dart:async';

          void main() {
            runApp(const MusicRadioApp());
          }

          class MusicRadioApp extends StatelessWidget {
            const MusicRadioApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Music & Radio Hub',
                theme: ThemeData(
                  primarySwatch: Colors.deepPurple,
                  useMaterial3: true,
                  brightness: Brightness.light,
                  colorScheme: ColorScheme.fromSeed(seedColor: Colors.deepPurple, brightness: Brightness.light),
                ),
                darkTheme: ThemeData(
                  primarySwatch: Colors.deepPurple,
                  useMaterial3: true,
                  brightness: Brightness.dark,
                  colorScheme: ColorScheme.fromSeed(seedColor: Colors.deepPurple, brightness: Brightness.dark),
                ),
                themeMode: ThemeMode.dark, // Default to sleek dark theme like reference
                home: const MainHomeScreen(),
              );
            }
          }

          class MainHomeScreen extends StatefulWidget {
            const MainHomeScreen({super.key});

            @override
            State<MainHomeScreen> createState() => _MainHomeScreenState();
          }

          class _MainHomeScreenState extends State<MainHomeScreen> {
            int _currentIndex = 0;
            final AudioPlayer _audioPlayer = AudioPlayer();
            String _currentTitle = "Nothing playing";
            String _currentArtist = "Select a track or station";
            String _currentArtwork = "";
            String _currentUrl = "";
            bool _isDownloading = false;
            bool _isPlaying = false;
            bool _showFullPlayer = false;
            final List<Map<String, dynamic>> _favorites = [];
            final List<Map<String, dynamic>> _history = [];
            Timer? _sleepTimer;
            String _activePreset = "Normal";

            @override
            void initState() {
              super.initState();
              _audioPlayer.playerStateStream.listen((state) {
                setState(() {
                  _isPlaying = state.playing;
                });
              });
            }

            @override
            void dispose() {
              _audioPlayer.dispose();
              _sleepTimer?.cancel();
              super.dispose();
            }

            Future<void> _playAudio(String url, String title, String artist, [String artwork = ""]) async {
              try {
                _currentUrl = url;
                await _audioPlayer.setUrl(url);
                await _audioPlayer.play();
                setState(() {
                  _currentTitle = title;
                  _currentArtist = artist;
                  _currentArtwork = artwork;
                });

                final historyItem = {"title": title, "artist": artist, "url": url, "artwork": artwork};
                if (!_history.any((h) => h['title'] == title)) {
                  _history.insert(0, historyItem);
                  if (_history.length > 25) _history.removeLast();
                }
              } catch (e) {
                setState(() {
                  _currentTitle = "Error playing audio";
                  _currentArtist = "";
                });
              }
            }

            Future<void> _downloadMusicFile(String url, String fileName) async {
              try {
                var status = await Permission.storage.request();
                if (!status.isGranted) {
                  await Permission.manageExternalStorage.request();
                }

                setState(() => _isDownloading = true);

                Directory? directory;
                if (Platform.isAndroid) {
                  directory = Directory('/storage/emulated/0/Music');
                  if (!await directory.exists()) {
                    directory = await getExternalStorageDirectory();
                  }
                } else {
                  directory = await getApplicationDocumentsDirectory();
                }

                if (directory == null) {
                  directory = await getApplicationDocumentsDirectory();
                }

                final filePath = '${directory.path}/$fileName';
                final response = await http.get(Uri.parse(url));
                final file = File(filePath);
                await file.writeAsBytes(response.bodyBytes);

                setState(() => _isDownloading = false);

                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(content: Text('Downloaded successfully to Music folder!'), backgroundColor: Colors.green),
                  );
                }
              } catch (e) {
                setState(() => _isDownloading = false);
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(content: Text('Download failed: ${e.toString()}'), backgroundColor: Colors.red),
                  );
                }
              }
            }

            void _toggleFavorite(Map<String, dynamic> item) {
              setState(() {
                if (_favorites.contains(item)) {
                  _favorites.remove(item);
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(content: Text('Removed from Favorites'), duration: Duration(milliseconds: 500)),
                  );
                } else {
                  _favorites.add(item);
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(content: Text('Added to Favorites!'), duration: Duration(milliseconds: 500)),
                  );
                }
              });
            }

            @override
            Widget build(BuildContext context) {
              final List<Widget> pages = [
                GlobalRadioTab(onPlay: _playAudio, favorites: _favorites, onToggleFavorite: _toggleFavorite),
                OnlineMusicTab(onPlay: _playAudio, onDownload: _downloadMusicFile, favorites: _favorites, onToggleFavorite: _toggleFavorite),
                FavoritesTab(favorites: _favorites, onPlay: _playAudio),
                HistoryTab(history: _history, onPlay: _playAudio),
                LocalFileTab(onPlay: _playAudio),
              ];

              return Scaffold(
                appBar: AppBar(
                  title: const Text('Music & Radio Hub', style: TextStyle(fontWeight: FontWeight.bold)),
                  backgroundColor: Colors.deepPurple.shade900,
                  elevation: 2,
                ),
                body: Stack(
                  children: [
                    Column(
                      children: [
                        Expanded(child: pages[_currentIndex]),
                        // Mini Player Bar
                        GestureDetector(
                          onTap: () => setState(() => _showFullPlayer = true),
                          child: Container(
                            padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 10),
                            color: Colors.grey.shade900,
                            child: Row(
                              children: [
                                ClipRRect(
                                  borderRadius: BorderRadius.circular(6),
                                  child: _currentArtwork.isNotEmpty
                                      ? Image.network(_currentArtwork, width: 45, height: 45, fit: BoxFit.cover, errorBuilder: (_,__,___) => const Icon(Icons.music_note))
                                      : Container(
                                          width: 45,
                                          height: 45,
                                          color: Colors.deepPurple,
                                          child: const Icon(Icons.music_note, color: Colors.white),
                                        ),
                                ),
                                const SizedBox(width: 12),
                                Expanded(
                                  child: Column(
                                    crossAxisAlignment: CrossAxisAlignment.start,
                                    children: [
                                      Text(
                                        _isDownloading ? "Downloading..." : _currentTitle,
                                        style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 14, color: Colors.white),
                                        overflow: TextOverflow.ellipsis,
                                      ),
                                      Text(
                                        _currentArtist,
                                        style: TextStyle(fontSize: 12, color: Colors.grey.shade400),
                                        overflow: TextOverflow.ellipsis,
                                      ),
                                    ],
                                  ),
                                ),
                                IconButton(
                                  icon: Icon(_isPlaying ? Icons.pause : Icons.play_arrow, color: Colors.white, size: 28),
                                  onPressed: () {
                                    if (_isPlaying) {
                                      _audioPlayer.pause();
                                    } else {
                                      _audioPlayer.play();
                                    }
                                  },
                                ),
                              ],
                            ),
                          ),
                        ),
                      ],
                    ),
                    // Full Screen Pop-up Player Overlay
                    if (_showFullPlayer)
                      FullPlayerScreen(
                        title: _currentTitle,
                        artist: _currentArtist,
                        artwork: _currentArtwork,
                        isPlaying: _isPlaying,
                        audioPlayer: _audioPlayer,
                        onClose: () => setState(() => _showFullPlayer = false),
                      ),
                  ],
                ),
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: _currentIndex,
                  type: BottomNavigationBarType.fixed,
                  selectedItemColor: Colors.deepPurpleAccent,
                  unselectedItemColor: Colors.grey,
                  backgroundColor: Colors.black87,
                  onTap: (index) => setState(() => _currentIndex = index),
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.radio), label: 'Radio'),
                    BottomNavigationBarItem(icon: Icon(Icons.library_music), label: 'Online'),
                    BottomNavigationBarItem(icon: Icon(Icons.favorite), label: 'Favorites'),
                    BottomNavigationBarItem(icon: Icon(Icons.history), label: 'History'),
                    BottomNavigationBarItem(icon: Icon(Icons.folder), label: 'Local'),
                  ],
                ),
              );
            }
          }

          class FullPlayerScreen extends StatelessWidget {
            final String title;
            final String artist;
            final String artwork;
            final bool isPlaying;
            final AudioPlayer audioPlayer;
            final VoidCallback onClose;

            const FullPlayerScreen({
              super.key,
              required this.title,
              required this.artist,
              required this.artwork,
              required this.isPlaying,
              required this.audioPlayer,
              required this.onClose,
            });

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.grey.shade900,
                appBar: AppBar(
                  backgroundColor: Colors.transparent,
                  elevation: 0,
                  leading: IconButton(
                    icon: const Icon(Icons.keyboard_arrow_down, size: 32, color: Colors.white),
                    onPressed: onClose,
                  ),
                  title: const Text("Now Playing", style: TextStyle(fontSize: 16, color: Colors.white)),
                  centerTitle: true,
                ),
                body: Padding(
                  padding: const EdgeInsets.all(24.0),
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      ClipRRect(
                        borderRadius: BorderRadius.circular(16),
                        child: artwork.isNotEmpty
                            ? Image.network(artwork, width: 280, height: 280, fit: BoxFit.cover, errorBuilder: (_,__,___) => const Icon(Icons.music_note, size: 100))
                            : Container(
                                width: 280,
                                height: 280,
                                color: Colors.deepPurple,
                                child: const Icon(Icons.music_note, size: 100, color: Colors.white),
                              ),
                      ),
                      const SizedBox(height: 40),
                      Text(
                        title,
                        style: const TextStyle(fontSize: 24, fontWeight: FontWeight.bold, color: Colors.white),
                        textAlign: TextAlign.center,
                        maxLines: 1,
                        overflow: TextOverflow.ellipsis,
                      ),
                      const SizedBox(height: 8),
                      Text(
                        artist,
                        style: TextStyle(fontSize: 16, color: Colors.grey.shade400),
                        textAlign: TextAlign.center,
                        maxLines: 1,
                        overflow: TextOverflow.ellipsis,
                      ),
                      const SizedBox(height: 40),
                      Row(
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: [
                          IconButton(
                            icon: const Icon(Icons.replay_10, size: 36, color: Colors.white),
                            onPressed: () {
                              final newPos = audioPlayer.position - const Duration(seconds: 10);
                              audioPlayer.seek(newPos < Duration.zero ? Duration.zero : newPos);
                            },
                          ),
                          const SizedBox(width: 24),
                          CircleAvatar(
                            radius: 36,
                            backgroundColor: Colors.white,
                            child: IconButton(
                              icon: Icon(isPlaying ? Icons.pause : Icons.play_arrow, size: 40, color: Colors.black),
                              onPressed: () {
                                if (isPlaying) {
                                  audioPlayer.pause();
                                } else {
                                  audioPlayer.play();
                                }
                              },
                            ),
                          ),
                          const SizedBox(width: 24),
                          IconButton(
                            icon: const Icon(Icons.forward_10, size: 36, color: Colors.white),
                            onPressed: () {
                              final newPos = audioPlayer.position + const Duration(seconds: 10);
                              audioPlayer.seek(newPos);
                            },
                          ),
                        ],
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class GlobalRadioTab extends StatefulWidget {
            final Function(String, String, String, [String]) onPlay;
            final List<Map<String, dynamic>> favorites;
            final Function(Map<String, dynamic>) onToggleFavorite;

            const GlobalRadioTab({super.key, required this.onPlay, required this.favorites, required this.onToggleFavorite});

            @override
            State<GlobalRadioTab> createState() => _GlobalRadioTabState();
          }

          class _GlobalRadioTabState extends State<GlobalRadioTab> {
            List<dynamic> _countries = [];
            List<dynamic> _stations = [];
            String _selectedCountry = "Ghana";
            String _searchQuery = "";
            bool _isLoadingCountries = true;
            bool _isLoadingStations = false;

            @override
            void initState() {
              super.initState();
              _fetchCountries();
              _fetchStations("Ghana");
            }

            Future<void> _fetchCountries() async {
              try {
                final response = await http.get(Uri.parse('https://de1.api.radio-browser.info/json/countries'));
                if (response.statusCode == 200) {
                  final data = json.decode(response.body);
                  setState(() {
                    _countries = data;
                    _isLoadingCountries = false;
                  });
                }
              } catch (e) {
                setState(() => _isLoadingCountries = false);
              }
            }

            Future<void> _fetchStations(String countryName) async {
              setState(() {
                _isLoadingStations = true;
                _selectedCountry = countryName;
              });
              try {
                final encodedCountry = Uri.encodeComponent(countryName);
                final response = await http.get(Uri.parse('https://de1.api.radio-browser.info/json/stations/bycountry/$encodedCountry'));
                if (response.statusCode == 200) {
                  final data = json.decode(response.body);
                  setState(() {
                    _stations = data;
                    _isLoadingStations = false;
                  });
                }
              } catch (e) {
                setState(() => _isLoadingStations = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              final filteredStations = _stations.where((station) {
                final name = (station['name'] ?? '').toLowerCase();
                final tags = (station['tags'] ?? '').toLowerCase();
                return name.contains(_searchQuery.toLowerCase()) || tags.contains(_searchQuery.toLowerCase());
              }).toList();

              return Padding(
                padding: const EdgeInsets.all(12.0),
                child: Column(
                  children: [
                    Card(
                      elevation: 2,
                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                      child: Padding(
                        padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 8),
                        child: Row(
                          children: [
                            const Icon(Icons.public, color: Colors.deepPurpleAccent),
                            const SizedBox(width: 12),
                            const Text("Country:", style: TextStyle(fontWeight: FontWeight.bold)),
                            const SizedBox(width: 12),
                            Expanded(
                              child: _isLoadingCountries
                                  ? const LinearProgressIndicator()
                                  : DropdownButtonHideUnderline(
                                      child: DropdownButton<String>(
                                        value: _countries.any((c) => c['name'] == _selectedCountry) ? _selectedCountry : null,
                                        isExpanded: true,
                                        hint: const Text("Select Country"),
                                        items: _countries.map<DropdownMenuItem<String>>((c) {
                                          return DropdownMenuItem<String>(
                                            value: c['name'],
                                            child: Text(c['name'] ?? '', overflow: TextOverflow.ellipsis),
                                          );
                                        }).toList(),
                                        onChanged: (val) {
                                          if (val != null) {
                                            _fetchStations(val);
                                          }
                                        },
                                      ),
                                    ),
                            ),
                          ],
                        ),
                      ),
                    ),
                    const SizedBox(height: 10),
                    TextField(
                      decoration: InputDecoration(
                        labelText: "Search FM station or genre...",
                        prefixIcon: const Icon(Icons.search, color: Colors.deepPurpleAccent),
                        border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
                        filled: true,
                      ),
                      onChanged: (val) => setState(() => _searchQuery = val),
                    ),
                    const SizedBox(height: 10),
                    Expanded(
                      child: _isLoadingStations
                          ? const Center(child: CircularProgressIndicator())
                          : filteredStations.isEmpty
                              ? const Center(child: Text("No FM stations found."))
                              : ListView.builder(
                                  itemCount: filteredStations.length,
                                  itemBuilder: (context, index) {
                                    final station = filteredStations[index];
                                    final name = station['name'] ?? 'Unknown Station';
                                    final url = station['url_resolved'] ?? station['url'] ?? '';
                                    final tags = station['tags'] ?? 'Live FM Broadcast';
                                    final favicon = station['favicon'] ?? '';
                                    
                                    final itemData = {
                                      "title": name,
                                      "artist": _selectedCountry,
                                      "url": url,
                                      "type": "radio",
                                      "artwork": favicon
                                    };
                                    final isFav = widget.favorites.any((f) => f['title'] == name);

                                    return Card(
                                      elevation: 1,
                                      margin: const EdgeInsets.symmetric(vertical: 6),
                                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(10)),
                                      child: ListTile(
                                        leading: ClipRRect(
                                          borderRadius: BorderRadius.circular(8),
                                          child: favicon.isNotEmpty
                                              ? Image.network(
                                                  favicon,
                                                  width: 45,
                                                  height: 45,
                                                  fit: BoxFit.cover,
                                                  errorBuilder: (context, error, stackTrace) => Container(
                                                    width: 45,
                                                    height: 45,
                                                    color: Colors.deepPurple.shade900,
                                                    child: const Icon(Icons.radio, color: Colors.white),
                                                  ),
                                                )
                                              : Container(
                                                  width: 45,
                                                  height: 45,
                                                  color: Colors.deepPurple.shade900,
                                                  child: const Icon(Icons.radio, color: Colors.white),
                                                ),
                                        ),
                                        title: Text(name, style: const TextStyle(fontWeight: FontWeight.bold)),
                                        subtitle: Text(tags, maxLines: 1, overflow: TextOverflow.ellipsis),
                                        trailing: Row(
                                          mainAxisSize: MainAxisSize.min,
                                          children: [
                                            IconButton(
                                              icon: Icon(isFav ? Icons.favorite : Icons.favorite_border, color: isFav ? Colors.red : Colors.grey),
                                              onPressed: () => widget.onToggleFavorite(itemData),
                                            ),
                                            IconButton(
                                              icon: const Icon(Icons.play_circle_fill, color: Colors.deepPurpleAccent, size: 36),
                                              onPressed: () => widget.onPlay(url, name, _selectedCountry, favicon),
                                            ),
                                          ],
                                        ),
                                      ),
                                    );
                                  },
                                ),
                    ),
                  ],
                ),
              );
            }
          }

          class OnlineMusicTab extends StatefulWidget {
            final Function(String, String, String, [String]) onPlay;
            final Function(String, String) onDownload;
            final List<Map<String, dynamic>> favorites;
            final Function(Map<String, dynamic>) onToggleFavorite;

            const OnlineMusicTab({
              super.key,
              required this.onPlay,
              required this.onDownload,
              required this.favorites,
              required this.onToggleFavorite,
            });

            @override
            State<OnlineMusicTab> createState() => _OnlineMusicTabState();
          }

          class _OnlineMusicTabState extends State<OnlineMusicTab> {
            List<dynamic> _tracks = [];
            bool _isLoading = false;
            final TextEditingController _searchController = TextEditingController(text: "Worship");

            @override
            void initState() {
              super.initState();
              _searchMusic("Worship");
            }

            Future<void> _searchMusic(String query) async {
              if (query.trim().isEmpty) return;
              setState(() => _isLoading = true);
              try {
                final encoded = Uri.encodeComponent(query);
                final response = await http.get(Uri.parse('https://itunes.apple.com/search?term=$encoded&entity=song&limit=50'));
                if (response.statusCode == 200) {
                  final data = json.decode(response.body);
                  setState(() {
                    _tracks = data['results'] ?? [];
                    _isLoading = false;
                  });
                }
              } catch (e) {
                setState(() => _isLoading = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Padding(
                padding: const EdgeInsets.all(12.0),
                child: Column(
                  children: [
                    TextField(
                      controller: _searchController,
                      decoration: InputDecoration(
                        labelText: "Search any song, artist, or album worldwide...",
                        prefixIcon: const Icon(Icons.search, color: Colors.deepPurpleAccent),
                        suffixIcon: IconButton(
                          icon: const Icon(Icons.send, color: Colors.deepPurpleAccent),
                          onPressed: () => _searchMusic(_searchController.text),
                        ),
                        border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
                        filled: true,
                      ),
                      onSubmitted: (val) => _searchMusic(val),
                    ),
                    const SizedBox(height: 10),
                    Expanded(
                      child: _isLoading
                          ? const Center(child: CircularProgressIndicator())
                          : _tracks.isEmpty
                              ? const Center(child: Text("No songs found. Try another search."))
                              : ListView.builder(
                                  itemCount: _tracks.length,
                                  itemBuilder: (context, index) {
                                    final track = _tracks[index];
                                    final title = track['trackName'] ?? 'Unknown Track';
                                    final artist = track['artistName'] ?? 'Unknown Artist';
                                    final album = track['collectionName'] ?? 'Single';
                                    final previewUrl = track['previewUrl'] ?? '';
                                    final artwork = track['artworkUrl100'] ?? '';
                                    // High-res artwork upgrade
                                    final highResArtwork = artwork.isNotEmpty ? artwork.replaceAll('100x100bb', '600x600bb') : '';

                                    final itemData = {
                                      "title": title,
                                      "artist": artist,
                                      "url": previewUrl,
                                      "type": "music",
                                      "artwork": highResArtwork
                                    };
                                    final isFav = widget.favorites.any((f) => f['title'] == title);

                                    return Card(
                                      elevation: 1,
                                      margin: const EdgeInsets.symmetric(vertical: 6),
                                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(10)),
                                      child: ListTile(
                                        leading: ClipRRect(
                                          borderRadius: BorderRadius.circular(8),
                                          child: artwork.isNotEmpty
                                              ? Image.network(artwork, width: 45, height: 45, fit: BoxFit.cover)
                                              : Container(
                                                  width: 45,
                                                  height: 45,
                                                  color: Colors.deepPurple.shade900,
                                                  child: const Icon(Icons.music_note, color: Colors.white),
                                                ),
                                        ),
                                        title: Text(title, maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontWeight: FontWeight.bold)),
                                        subtitle: Text("$artist • $album", maxLines: 1, overflow: TextOverflow.ellipsis),
                                        trailing: Row(
                                          mainAxisSize: MainAxisSize.min,
                                          children: [
                                            IconButton(
                                              icon: Icon(isFav ? Icons.favorite : Icons.favorite_border, color: isFav ? Colors.red : Colors.grey),
                                              onPressed: () => widget.onToggleFavorite(itemData),
                                            ),
                                            IconButton(
                                              icon: const Icon(Icons.download, color: Colors.blueAccent),
                                              onPressed: previewUrl.isNotEmpty
                                                  ? () => widget.onDownload(previewUrl, "$title - $artist.m4a")
                                                  : null,
                                            ),
                                            IconButton(
                                              icon: const Icon(Icons.play_circle_fill, color: Colors.deepPurpleAccent, size: 36),
                                              onPressed: previewUrl.isNotEmpty
                                                  ? () => widget.onPlay(previewUrl, title, artist, highResArtwork)
                                                  : null,
                                            ),
                                          ],
                                        ),
                                      ),
                                    );
                                  },
                                ),
                    ),
                  ],
                ),
              );
            }
          }

          class FavoritesTab extends StatelessWidget {
            final List<Map<String, dynamic>> favorites;
            final Function(String, String, String, [String]) onPlay;

            const FavoritesTab({super.key, required this.favorites, required this.onPlay});

            @override
            Widget build(BuildContext context) {
              if (favorites.isEmpty) {
                return const Center(
                  child: Text("Your bookmarked favorite stations and songs appear here.", style: TextStyle(color: Colors.grey)),
                );
              }
              return ListView.builder(
                padding: const EdgeInsets.all(12),
                itemCount: favorites.length,
                itemBuilder: (context, index) {
                  final item = favorites[index];
                  return Card(
                    child: ListTile(
                      leading: item['artwork'] != null && item['artwork'].toString().isNotEmpty
                          ? Image.network(item['artwork'], width: 45, height: 45, fit: BoxFit.cover, errorBuilder: (_,__,___) => const Icon(Icons.star))
                          : const CircleAvatar(child: Icon(Icons.star)),
                      title: Text(item['title'] ?? '', style: const TextStyle(fontWeight: FontWeight.bold)),
                      subtitle: Text(item['artist'] ?? '', maxLines: 1, overflow: TextOverflow.ellipsis),
                      trailing: IconButton(
                        icon: const Icon(Icons.play_circle_fill, color: Colors.deepPurpleAccent, size: 36),
                        onPressed: () => onPlay(item['url'], item['title'], item['artist'] ?? '', item['artwork'] ?? ''),
                      ),
                    ),
                  );
                },
              );
            }
          }

          class HistoryTab extends StatelessWidget {
            final List<Map<String, dynamic>> history;
            final Function(String, String, String, [String]) onPlay;

            const HistoryTab({super.key, required this.history, required this.onPlay});

            @override
            Widget build(BuildContext context) {
              if (history.isEmpty) {
                return const Center(
                  child: Text("Your recently played tracks and stations will appear here.", style: TextStyle(color: Colors.grey)),
                );
              }
              return ListView.builder(
                padding: const EdgeInsets.all(12),
                itemCount: history.length,
                itemBuilder: (context, index) {
                  final item = history[index];
                  return Card(
                    child: ListTile(
                      leading: item['artwork'] != null && item['artwork'].toString().isNotEmpty
                          ? Image.network(item['artwork'], width: 45, height: 45, fit: BoxFit.cover, errorBuilder: (_,__,___) => const Icon(Icons.history))
                          : const CircleAvatar(child: Icon(Icons.history)),
                      title: Text(item['title'] ?? '', style: const TextStyle(fontWeight: FontWeight.bold)),
                      subtitle: Text(item['artist'] ?? '', maxLines: 1, overflow: TextOverflow.ellipsis),
                      trailing: IconButton(
                        icon: const Icon(Icons.play_circle_fill, color: Colors.deepPurpleAccent, size: 36),
                        onPressed: () => onPlay(item['url'], item['title'], item['artist'] ?? '', item['artwork'] ?? ''),
                      ),
                    ),
                  );
                },
              );
            }
          }

          class LocalFileTab extends StatelessWidget {
            final Function(String, String, String, [String]) onPlay;

            const LocalFileTab({super.key, required this.onPlay});

            @override
            Widget build(BuildContext context) {
              return Center(
                child: Padding(
                  padding: const EdgeInsets.all(24.0),
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      const Icon(Icons.folder_shared, size: 64, color: Colors.deepPurpleAccent),
                      const SizedBox(height: 16),
                      const Text(
                        "Downloaded music is saved directly to your device's Music folder!",
                        textAlign: TextAlign.center,
                        style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold),
                      ),
                      const SizedBox(height: 20),
                      ElevatedButton.icon(
                        onPressed: () async {
                          FilePickerResult? result = await FilePicker.platform.pickFiles(type: FileType.audio);
                          if (result != null && result.files.single.path != null) {
                            onPlay(result.files.single.path!, result.files.single.name, "Local Storage");
                          }
                        },
                        icon: const Icon(Icons.folder_open),
                        label: const Text("Pick File from Device Music Folder"),
                        style: ElevatedButton.styleFrom(backgroundColor: Colors.deepPurple.shade900),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

          # Inject Internet Permission and Storage Permissions into AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' $MANIFEST
            sed -i '/<application/i \    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>' $MANIFEST
            sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>' $MANIFEST
          fi

          # Update minSdk to 24 for audio and storage plugins
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' $BUILD_GRADLE
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' $BUILD_GRADLE
          fi

          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: 'app_project/build/app/outputs/flutter-apk/app-release.apk'
