          class MiniProgress extends StatelessWidget {
            const MiniProgress({super.key});

            @override
            Widget build(BuildContext context) {
              if (player.spotifyActive) {
                final total = player.spDur.inMilliseconds;
                return LinearProgressIndicator(minHeight: 2, value: total > 0 ? (player.spPos.inMilliseconds / total).clamp(0.0, 1.0).toDouble() : 0.0);
              }
              return StreamBuilder<Duration?>(
                stream: player.audio.durationStream,
                builder: (context, ds) {
                  final dur = ds.data;
                  if (dur == null || dur == Duration.zero) return const SizedBox(height: 2);
                  return StreamBuilder<Duration>(
                    stream: player.audio.positionStream,
                    builder: (context, ps) {
                      final pos = ps.data ?? Duration.zero;
                      return LinearProgressIndicator(minHeight: 2, value: (pos.inMilliseconds / dur.inMilliseconds).clamp(0.0, 1.0).toDouble());
                    },
                  );
                },
              );
            }
          }

