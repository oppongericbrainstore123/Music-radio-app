                        builder: (context, _) {
                          final f = follows.isFollowing(widget.follow!);
                          return TextButton.icon(
                            onPressed: () => follows.toggle(widget.follow!),
                            icon: Icon(f ? Icons.check : Icons.person_add_alt),
                            label: Text(f ? 'Following' : 'Follow'),
                          );
                        },
                      ),
                  ],
