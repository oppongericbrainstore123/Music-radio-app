          class EqualizerScreen extends StatefulWidget {
            const EqualizerScreen({super.key});

            @override
            State<EqualizerScreen> createState() => _EqualizerScreenState();
          }

          class _EqualizerScreenState extends State<EqualizerScreen> {
            String _preset = 'Custom';

            Future<void> _applyPreset(AndroidEqualizerParameters p, String name) async {
              setState(() => _preset = name);
              final bands = p.bands;
              final double min = p.minDecibels;
              final double max = p.maxDecibels;

              for (var b in bands) {
                double target = 0.0;
                final freq = b.centerFrequency;
                if (name == 'Bass Boost') {
                  if (freq < 300) target = max * 0.8;
                } else if (name == 'Rock') {
                  if (freq < 250 || freq > 4000) target = max * 0.6;
                } else if (name == 'Pop') {
                  if (freq >= 500 && freq <= 3000) target = max * 0.5;
                } else if (name == 'Classical') {
                  if (freq < 500 || freq > 5000) target = max * 0.4;
                } else if (name == 'Vocal') {
                  if (freq >= 1000 && freq <= 4000) target = max * 0.7;
                }
                await b.setGain(target.clamp(min, max));
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Sound Studio')),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    StreamBuilder<bool>(
                      stream: player.equalizer.enabledStream,
                      builder: (context, snap) {
                        final on = snap.data ?? false;
                        return SwitchListTile(
                          title: const Text('Equalizer Active', style: TextStyle(fontWeight: FontWeight.bold)),
                          value: on,
                          onChanged: player.equalizer.setEnabled,
                        );
                      },
                    ),
                    const Divider(),
                    const Text('Presets', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                    const SizedBox(height: 8),
                    FutureBuilder<AndroidEqualizerParameters>(
                      future: player.equalizer.parameters,
                      builder: (context, snap) {
                        final p = snap.data;
                        return Wrap(
                          spacing: 8,
                          children: ['Flat', 'Bass Boost', 'Rock', 'Pop', 'Classical', 'Vocal'].map((name) {
                            return ChoiceChip(
                              label: Text(name),
                              selected: _preset == name,
                              onSelected: (_) {
                                if (p != null) _applyPreset(p, name);
                              },
                            );
                          }).toList(),
                        );
                      },
                    ),
                    const Divider(height: 24),
                    const Text('Frequency Bands', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                    const SizedBox(height: 8),
                    FutureBuilder<AndroidEqualizerParameters>(
                      future: player.equalizer.parameters,
                      builder: (context, snap) {
                        final p = snap.data;
                        if (p == null) {
                          return const Padding(
                            padding: EdgeInsets.all(24),
                            child: Center(child: Text('Start playing a song first to unlock the bands.', textAlign: TextAlign.center)),
                          );
                        }
                        return Column(
                          children: p.bands.map((b) {
                            return Padding(
                              padding: const EdgeInsets.symmetric(vertical: 4),
                              child: Column(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  Text('${b.centerFrequency.round()} Hz', style: const TextStyle(color: Colors.grey)),
                                  StreamBuilder<double>(
                                    stream: b.gainStream,
                                    builder: (context, s) {
                                      final v = (s.data ?? b.gain).clamp(p.minDecibels, p.maxDecibels).toDouble();
                                      return Slider(
                                        min: p.minDecibels,
                                        max: p.maxDecibels,
                                        value: v,
                                        onChanged: (val) {
                                          setState(() => _preset = 'Custom');
                                          b.setGain(val);
                                        },
                                      );
                                    },
                                  ),
                                ],
                              ),
                            );
                          }).toList(),
                        );
                      },
                    ),
                    const Divider(height: 24),
                    const Text('Volume & Loudness Boost', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                    StreamBuilder<double>(
                      stream: player.loudness.targetGainStream,
                      builder: (context, s) {
                        final v = (s.data ?? 0.0).clamp(0.0, 10.0).toDouble();
                        return Slider(
                          min: 0,
                          max: 10,
                          divisions: 10,
                          label: '${v.toStringAsFixed(1)} dB',
                          value: v,
                          onChanged: player.loudness.setTargetGain,
                        );
                      },
                    ),
                  ],
                ),
              );
            }
          }

