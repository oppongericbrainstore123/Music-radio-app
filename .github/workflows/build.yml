name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Create Project and Build APK
        run: |
          # Create clean project
          flutter create app_project --org com.musicradio --platforms=android

          # Find and copy main.dart from anywhere in the repo
          MAIN_FILE=$(find . -name "main.dart" ! -path "*/app_project/*" | head -n 1)
          if [ -n "$MAIN_FILE" ]; then
            cp "$MAIN_FILE" app_project/lib/main.dart
            echo "Successfully copied main.dart from $MAIN_FILE"
          else
            echo "ERROR: main.dart not found!"
            exit 1
          fi

          # Find and copy pubspec.yaml from anywhere in the repo
          PUBSPEC_FILE=$(find . -name "pubspec.yaml" ! -path "*/app_project/*" | head -n 1)
          if [ -n "$PUBSPEC_FILE" ]; then
            cp "$PUBSPEC_FILE" app_project/pubspec.yaml
            echo "Successfully copied pubspec.yaml from $PUBSPEC_FILE"
          else
            echo "ERROR: pubspec.yaml not found!"
            exit 1
          fi

          cd app_project

          # Inject Internet Permission into AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' $MANIFEST
          fi

          # Update minSdk to 24 for file_picker and path_provider
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' $BUILD_GRADLE
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' $BUILD_GRADLE
          fi

          flutter pub get
          flutter build apk --release --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: 'app_project/build/app/outputs/flutter-apk/app-release.apk'
