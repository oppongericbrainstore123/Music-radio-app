          class RadioTab extends StatefulWidget {
            const RadioTab({super.key});

            @override
            State<RadioTab> createState() => _RadioTabState();
          }

          class _RadioTabState extends State<RadioTab> {
            static const List<String> _hosts = [
              'de1.api.radio-browser.info',
              'nl1.api.radio-browser.info',
              'at1.api.radio-browser.info',
            ];
            List<dynamic> _countries = [];
            List<dynamic> _stations = [];
            String _country = 'Ghana';
            String _query = '';
            bool _loading = false;
            String? _error;

            @override
            void initState() {
              super.initState();
              _loadCountries();
              _loadStations(_country);
            }

            Future<List<dynamic>> _radio(String path, {Map<String, String>? q, Duration ttl = const Duration(minutes: 15)}) async {
              final body = await fetchJson([for (final h in _hosts) Uri.https(h, path, q)], ttl: ttl);
              return _asList(body);
            }

            Future<void> _loadCountries() async {
              try {
                final list = await _radio('/json/countries', ttl: const Duration(hours: 24));
                if (mounted) setState(() => _countries = list.where((c) => (c['name'] ?? '').toString().isNotEmpty).toList());
              } catch (_) {}
            }

            Future<void> _loadStations(String country) async {
              setState(() {
                _loading = true;
                _error = null;
                _country = country;
              });
              try {
                final list = await _radio('/json/stations/bycountry/$country', q: {
                  'hidebroken': 'true',
                  'order': 'clickcount',
                  'reverse': 'true',
                  'limit': settings.dataSaver ? '60' : '150',
                });
                if (mounted) setState(() => _stations = list);
              } catch (e) {
                if (mounted) setState(() => _error = 'Could not load stations. ${errText(e)}');
              }
              if (mounted) setState(() => _loading = false);
            }

            @override
            Widget build(BuildContext context) {
              final filtered = _stations.where((s) => (s['name'] ?? '').toString().toLowerCase().contains(_query.toLowerCase())).toList();
              return Padding(
                padding: const EdgeInsets.all(12),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    const PlayAllBar(title: 'Global FM Radio', tracks: []),
                    const SizedBox(height: 4),
                    DropdownButton<String>(
                      value: _countries.any((c) => c['name'] == _country) ? _country : null,
                      hint: Text(_country),
                      isExpanded: true,
                      borderRadius: BorderRadius.circular(12),
                      items: _countries.map<DropdownMenuItem<String>>((c) => DropdownMenuItem<String>(value: c['name'].toString(), child: Text(c['name'].toString()))).toList(),
                      onChanged: (v) {
                        if (v != null) _loadStations(v);
                      },
                    ),
                    const SizedBox(height: 8),
                    TextField(
                      decoration: InputDecoration(
                        hintText: 'Search station...',
                        prefixIcon: const Icon(Icons.search),
                        filled: true,
                        border: OutlineInputBorder(borderRadius: BorderRadius.circular(24), borderSide: BorderSide.none),
                      ),
                      onChanged: (v) => setState(() => _query = v),
                    ),
                    const SizedBox(height: 8),
                    Expanded(
                      child: _loading
                          ? const Center(child: CircularProgressIndicator())
                          : _error != null
                              ? RetryMessage(message: _error!, onRetry: () => _loadStations(_country))
                              : ListView.builder(
                                  itemCount: filtered.length,
                                  itemBuilder: (context, i) {
                                    final s = filtered[i];
                                    final url = (s['url_resolved'] ?? s['url'] ?? '').toString();
                                    if (url.isEmpty) return const SizedBox.shrink();
                                    final br = (s['bitrate'] as num?)?.toInt() ?? 0;
                                    final t = Track(
                                      id: 'radio-${s['stationuuid'] ?? url}',
                                      title: (s['name'] ?? 'Radio').toString().trim(),
                                      artist: br > 0 ? '$_country  -  ${br}k' : _country,
                                      url: url,
                                      artwork: (s['favicon'] ?? '').toString(),
                                      isLive: true,
                                    );
                                    return TrackTile(track: t, onTap: () => player.playQueue([t], 0));
                                  },
                                ),
                    ),
                  ],
                ),
              );
            }
          }

          // ---------------------------------------------------------------- music search

          class SearchItem {
            final String title;
            final String subtitle;
            final String image;
            final bool round;
            final Track? track;
            final Future<List<Track>> Function()? loader;
            final FollowedArtist? follow;

            const SearchItem({required this.title, this.subtitle = '', this.image = '', this.round = false, this.track, this.loader, this.follow});
          }

          class SearchTab extends StatefulWidget {
            const SearchTab({super.key});

            @override
            State<SearchTab> createState() => _SearchTabState();
          }

          class _SearchTabState extends State<SearchTab> {
            final TextEditingController _ctrl = TextEditingController();
            final stt.SpeechToText _speech = stt.SpeechToText();
            bool _listening = false;
            int _source = 0; // 0 Audius, 1 Jamendo, 2 Spotify
            int _mode = 0; // 0 songs, 1 artists, 2 albums
            List<SearchItem> _items = [];
            bool _loading = false;
            String? _error;
            String _heading = 'Trending';

            @override
            void initState() {
              super.initState();
              _run();
            }

            @override
            void dispose() {
              _speech.cancel();
              _ctrl.dispose();
              super.dispose();
            }

            Future<void> _toggleMic() async {
              if (_listening) {
                await _speech.stop();
                if (mounted) setState(() => _listening = false);
                return;
              }
              final ok = await _speech.initialize(
                onStatus: (st) {
                  if ((st == 'done' || st == 'notListening') && mounted) setState(() => _listening = false);
                },
                onError: (_) {
                  if (mounted) setState(() => _listening = false);
                },
              );
              if (!ok) {
                toast('Voice search is not available. Allow microphone access in your phone settings.');
                return;
              }
              setState(() => _listening = true);
              await _speech.listen(
                listenFor: const Duration(seconds: 20),
                pauseFor: const Duration(seconds: 3),
                onResult: (r) {
                  _ctrl.text = r.recognizedWords;
                  _ctrl.selection = TextSelection.collapsed(offset: _ctrl.text.length);
                  if (r.finalResult) {
                    if (mounted) setState(() => _listening = false);
                    _run();
                  }
                },
              );
            }

            Future<void> _run() async {
              final q = _ctrl.text.trim();
              if (_source == 2 && (!spotify.loggedIn || q.isEmpty)) {
                setState(() {
                  _items = [];
                  _error = null;
                  _heading = '';
                });
                return;
              }
              if (q.isEmpty && _mode != 0) {
                setState(() {
                  _items = [];
                  _error = null;
                  _heading = 'Type a name to search';
                });
                return;
              }
              setState(() {
                _loading = true;
                _error = null;
                _heading = q.isEmpty ? 'Trending' : 'Results';
              });
              try {
                List<SearchItem> items;
                if (_source == 1) {
                  items = await _jamendo(q);
                } else if (_source == 2) {
                  items = await _spotify(q);
                } else {
                  items = await _audius(q);
                }
                if (mounted) setState(() => _items = items);
              } catch (e) {
                if (mounted) setState(() => _error = 'Search failed. ${errText(e)}');
              }
              if (mounted) setState(() => _loading = false);
            }

            SearchItem _songItem(Track t) => SearchItem(title: t.title, subtitle: t.artist, image: t.artwork, track: t);

            Future<List<SearchItem>> _audius(String q) async {
              if (q.isEmpty) {
                final list = await getAudius('/tracks/trending', {}, ttl: const Duration(minutes: 20));
                return audiusTracks(list).map(_songItem).toList();
              }
              final path = const ['tracks', 'users', 'playlists'][_mode];
              final list = await getAudius('/$path/search', {'query': q}, ttl: const Duration(minutes: 5));
              if (_mode == 0) return audiusTracks(list).map(_songItem).toList();
              if (_mode == 1) {
                return list.whereType<Map>().map<SearchItem>((a) {
                  final id = a['id'].toString();
                  return SearchItem(
                    title: (a['name'] ?? '').toString(),
                    subtitle: '${a['track_count'] ?? 0} tracks',
                    image: imgOf(a['profile_picture']),
                    round: true,
                    follow: FollowedArtist(source: 'audius', id: id, name: (a['name'] ?? '').toString(), image: imgOf(a['profile_picture'])),
                    loader: () async => audiusTracks(await getAudius('/users/$id/tracks', {'limit': '100'})),
                  );
                }).toList();
              }
              return list.whereType<Map>().map<SearchItem>((p) {
                final id = p['id'].toString();
                final user = p['user'];
                final owner = user is Map ? (user['name'] ?? '').toString() : '';
                return SearchItem(
                  title: (p['playlist_name'] ?? 'Untitled').toString(),
                  subtitle: '${p['is_album'] == true ? 'Album' : 'Playlist'} - $owner',
                  image: imgOf(p['artwork']),
                  loader: () async => audiusTracks(await getAudius('/playlists/$id/tracks', {})),
                );
              }).toList();
            }

            Future<List<SearchItem>> _jamendo(String q) async {
              if (q.isEmpty) {
                final list = await getList(jamendoUri('/tracks/', {'order': 'popularity_week', 'limit': '30'}), ttl: const Duration(minutes: 20));
                return jamendoTracks(list).map(_songItem).toList();
              }
              if (_mode == 0) {
                final list = await getList(jamendoUri('/tracks/', {'search': q, 'limit': '30'}), ttl: const Duration(minutes: 5));
                return jamendoTracks(list).map(_songItem).toList();
              }
              if (_mode == 1) {
                final list = await getList(jamendoUri('/artists/', {'namesearch': q, 'limit': '20'}), ttl: const Duration(minutes: 5));
                return list.whereType<Map>().map<SearchItem>((a) {
                  final id = a['id'].toString();
                  final name = (a['name'] ?? '').toString();
                  final image = (a['image'] ?? '').toString();
                  return SearchItem(
                    title: name,
                    subtitle: 'Artist',
                    image: image,
                    round: true,
                    follow: FollowedArtist(source: 'jamendo', id: id, name: name, image: image),
                    loader: () async {
                      final r = await getList(jamendoUri('/artists/tracks/', {'id': id}));
                      if (r.isEmpty || r.first is! Map) return <Track>[];
                      final tr = ((r.first as Map)['tracks'] as List?) ?? [];
                      return jamendoTracks(tr, artist: name, image: image);
                    },
                  );
                }).toList();
              }
              final list = await getList(jamendoUri('/albums/', {'namesearch': q, 'limit': '20'}), ttl: const Duration(minutes: 5));
              return list.whereType<Map>().map<SearchItem>((a) {
                final id = a['id'].toString();
                final artist = (a['artist_name'] ?? '').toString();
                final image = (a['image'] ?? '').toString();
                return SearchItem(
                  title: (a['name'] ?? 'Untitled').toString(),
                  subtitle: 'Album - $artist',
                  image: image,
                  loader: () async {
                    final r = await getList(jamendoUri('/albums/tracks/', {'id': id}));
                    if (r.isEmpty || r.first is! Map) return <Track>[];
                    final tr = ((r.first as Map)['tracks'] as List?) ?? [];
                    return jamendoTracks(tr, artist: artist, image: image);
                  },
                );
              }).toList();
            }

            Future<List<SearchItem>> _spotify(String q) async {
              final type = const ['track', 'artist', 'album'][_mode];
              final data = await spotify.getJson('/search', {'q': q, 'type': type, 'limit': '10'});
              final bucket = data['${type}s'];
              final raw = (bucket is Map ? bucket['items'] : null) as List? ?? [];
              final items = raw.whereType<Map>().toList();
              if (_mode == 0) {
                return items.map((m) => _songItem(Track.fromSpotify(Map<String, dynamic>.from(m)))).toList();
              }
              if (_mode == 1) {
                return items.map<SearchItem>((m) {
                  final name = (m['name'] ?? '').toString();
                  return SearchItem(
                    title: name,
                    subtitle: 'Artist',
                    image: spImg(m['images']),
                    round: true,
                    loader: () async {
                      final d = await spotify.getJson('/search', {'q': 'artist:"$name"', 'type': 'track', 'limit': '10'});
                      final b = d['tracks'];
                      final r = (b is Map ? b['items'] : null) as List? ?? [];
                      return r.whereType<Map>().map((x) => Track.fromSpotify(Map<String, dynamic>.from(x))).toList();
                    },
                  );
                }).toList();
              }
              return items.map<SearchItem>((m) {
                final id = m['id'].toString();
                final image = spImg(m['images']);
                final artists = m['artists'];
                final artist = (artists is List && artists.isNotEmpty && artists.first is Map) ? (artists.first['name'] ?? '').toString() : '';
                return SearchItem(
                  title: (m['name'] ?? 'Untitled').toString(),
                  subtitle: 'Album - $artist',
                  image: image,
                  loader: () async {
                    final d = await spotify.getJson('/albums/$id');
                    final b = d['tracks'];
                    final r = (b is Map ? b['items'] : null) as List? ?? [];
                    return r.whereType<Map>().map((x) => Track.fromSpotify(Map<String, dynamic>.from(x), image: image)).toList();
                  },
                );
              }).toList();
            }

            Widget _spotifyGate() {
              return Center(
                child: Column(
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    const Text('Log in with a Spotify Premium account to search and play full songs.\nPlayback happens in the Spotify app.', textAlign: TextAlign.center),
                    const SizedBox(height: 12),
