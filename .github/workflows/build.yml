name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Fix Directory Structure & Build
        run: |
          # If a nested mobile_app/mobile_app folder exists, move files up to avoid path errors
          if [ -d "mobile_app/mobile_app" ]; then
            cp -r mobile_app/mobile_app/* mobile_app/
          fi
          
          # Find where pubspec.yaml is and build from that exact directory
          PROJECT_DIR=$(dirname $(find . -name "pubspec.yaml" -print -quit))
          echo "Building from: $PROJECT_DIR"
          cd $PROJECT_DIR
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
