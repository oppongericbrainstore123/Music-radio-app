            bool _loading = true;
            String? _error;

            @override
            void initState() {
              super.initState();
              _load();
            }

            Future<void> _load() async {
              try {
                final tracks = await widget.loader();
                if (mounted) setState(() => _tracks = tracks);
              } catch (_) {
