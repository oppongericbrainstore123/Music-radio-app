name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Generate and Build App
        run: |
          flutter create app_project --org com.musicradio --platforms=android
          cd app_project

          # Write pubspec.yaml with all required multimedia dependencies
          cat << 'EOF' > pubspec.yaml
          name: music_radio_app
          description: A multimedia radio, streaming, and local player app.
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            just_audio: ^0.9.36
            http: ^1.2.0
            path_provider: ^2.1.2
            file_picker: ^6.1.1
            permission_handler: ^11.3.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

          # Write lib/main.dart with Full-Length Open Audio Streaming, Public Music Downloads, and Global Radio
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:just_audio/just_audio.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:http/http.dart' as http;
          import 'dart:io';
          import 'dart:convert';

          void main() {
            runApp(const MusicRadioApp());
          }

          class MusicRadioApp extends StatelessWidget {
            const MusicRadioApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Music & Radio Hub',
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF121212),
                  primarySwatch: Colors.deepPurple,
                  useMaterial3: true,
                ),
                home: const MainHomeScreen(),
              );
            }
          }

          class MainHomeScreen extends StatefulWidget {
            const MainHomeScreen({super.key});

            @override
            State<MainHomeScreen> createState() => _MainHomeScreenState();
          }

          class _MainHomeScreenState extends State<MainHomeScreen> {
            int _currentIndex = 0;
            final AudioPlayer _audioPlayer = AudioPlayer();
            String _currentTitle = "Select a track or station";
            String _currentArtist = "Music & Radio Hub";
            String _currentArtwork = "";
            bool _isDownloading = false;
            bool _isPlaying = false;
            bool _showFullPlayer = false;
            final List<Map<String, dynamic>> _favorites = [];
            final List<Map<String, dynamic>> _downloadedSongs = [];
            Duration _duration = Duration.zero;
            Duration _position = Duration.zero;

            @override
            void initState() {
              super.initState();
              _audioPlayer.playerStateStream.listen((state) {
                setState(() => _isPlaying = state.playing);
              });
              _audioPlayer.durationStream.listen((d) {
                setState(() => _duration = d ?? Duration.zero);
              });
              _audioPlayer.positionStream.listen((p) {
                setState(() => _position = p);
              });
            }

            @override
            void dispose() {
              _audioPlayer.dispose();
              super.dispose();
            }

            Future<void> _playAudio(String url, String title, String artist, [String artwork = ""]) async {
              try {
                await _audioPlayer.setUrl(url);
                await _audioPlayer.play();
                setState(() {
                  _currentTitle = title;
                  _currentArtist = artist;
                  _currentArtwork = artwork;
                });
              } catch (e) {
                setState(() {
                  _currentTitle = "Error playing stream/track";
                });
              }
            }

            Future<void> _downloadMusicFile(String url, String fileName, String artist, String artwork) async {
              try {
                var status = await Permission.storage.request();
                if (!status.isGranted) {
                  await Permission.manageExternalStorage.request();
                }

                setState(() => _isDownloading = true);

                Directory? directory = Directory('/storage/emulated/0/Music');
                if (!await directory.exists()) {
                  directory = await getExternalStorageDirectory();
                }
                directory ??= await getApplicationDocumentsDirectory();

                final filePath = '${directory.path}/$fileName';
                final response = await http.get(Uri.parse(url));
                final file = File(filePath);
                await file.writeAsBytes(response.bodyBytes);

                final downloadedItem = {
                  "title": fileName.replaceAll('.mp3', ''),
                  "artist": artist,
                  "url": filePath,
                  "artwork": artwork,
                  "isLocal": true
                };

                if (!_downloadedSongs.any((d) => d['title'] == downloadedItem['title'])) {
                  _downloadedSongs.add(downloadedItem);
                }

                setState(() => _isDownloading = false);
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(content: Text('Downloaded successfully to Music folder!'), backgroundColor: Colors.green),
                  );
                }
              } catch (e) {
                setState(() => _isDownloading = false);
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(content: Text('Download failed: ${e.toString()}'), backgroundColor: Colors.red),
                  );
                }
              }
            }

            @override
            Widget build(BuildContext context) {
              final List<Widget> pages = [
                GlobalRadioTab(onPlay: _playAudio, favorites: _favorites),
                FullMusicSearchTab(onPlay: _playAudio, onDownload: _downloadMusicFile),
                FavoritesTab(favorites: _favorites, onPlay: _playAudio),
                LibraryTab(downloadedSongs: _downloadedSongs, onPlay: _playAudio),
              ];

              return Scaffold(
                appBar: AppBar(
                  title: Row(
                    children: [
                      const Icon(Icons.music_note, color: Colors.greenAccent),
                      const SizedBox(width: 8),
                      const Text('Music & Radio Hub', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 20, color: Colors.white)),
                    ],
                  ),
                  backgroundColor: Colors.transparent,
                  elevation: 0,
                ),
                body: Stack(
                  children: [
                    Column(
                      children: [
                        Expanded(child: pages[_currentIndex]),
                        // Sticky Mini Player Bar
                        GestureDetector(
                          onTap: () => setState(() => _showFullPlayer = true),
                          child: Container(
                            margin: const EdgeInsets.symmetric(horizontal: 8, vertical: 4),
                            padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),
                            decoration: BoxDecoration(
                              color: const Color(0xFF282828),
                              borderRadius: BorderRadius.circular(8),
                            ),
                            child: Row(
                              children: [
                                ClipRRect(
                                  borderRadius: BorderRadius.circular(4),
                                  child: _currentArtwork.isNotEmpty
                                      ? Image.network(_currentArtwork, width: 40, height: 40, fit: BoxFit.cover, errorBuilder: (_,__,___) => const Icon(Icons.music_note))
                                      : Container(width: 40, height: 40, color: Colors.deepPurple, child: const Icon(Icons.music_note)),
                                ),
                                const SizedBox(width: 12),
                                Expanded(
                                  child: Column(
                                    crossAxisAlignment: CrossAxisAlignment.start,
                                    children: [
                                      Text(_currentTitle, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 13, color: Colors.white), overflow: TextOverflow.ellipsis),
                                      Text(_currentArtist, style: TextStyle(fontSize: 11, color: Colors.grey.shade400), overflow: TextOverflow.ellipsis),
                                    ],
                                  ),
                                ),
                                IconButton(
                                  icon: Icon(_isPlaying ? Icons.pause : Icons.play_arrow, color: Colors.white),
                                  onPressed: () {
                                    if (_isPlaying) {
                                      _audioPlayer.pause();
                                    } else {
                                      _audioPlayer.play();
                                    }
                                  },
                                ),
                              ],
                            ),
                          ),
                        ),
                      ],
                    ),
                    // Full Screen Pop-up Player
                    if (_showFullPlayer)
                      FullPlayerScreen(
                        title: _currentTitle,
                        artist: _currentArtist,
                        artwork: _currentArtwork,
                        isPlaying: _isPlaying,
                        audioPlayer: _audioPlayer,
                        duration: _duration,
                        position: _position,
                        onClose: () => setState(() => _showFullPlayer = false),
                      ),
                  ],
                ),
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: _currentIndex,
                  type: BottomNavigationBarType.fixed,
                  selectedItemColor: Colors.greenAccent,
                  unselectedItemColor: Colors.grey,
                  backgroundColor: const Color(0xFF181818),
                  onTap: (index) => setState(() => _currentIndex = index),
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.radio), label: 'Radio'),
                    BottomNavigationBarItem(icon: Icon(Icons.search), label: 'Search'),
                    BottomNavigationBarItem(icon: Icon(Icons.favorite), label: 'Favorites'),
                    BottomNavigationBarItem(icon: Icon(Icons.library_music), label: 'Library'),
                  ],
                ),
              );
            }
          }

          class FullPlayerScreen extends StatelessWidget {
            final String title;
            final String artist;
            final String artwork;
            final bool isPlaying;
            final AudioPlayer audioPlayer;
            final Duration duration;
            final Duration position;
            final VoidCallback onClose;

            const FullPlayerScreen({
              super.key,
              required this.title,
              required this.artist,
              required this.artwork,
              required this.isPlaying,
              required this.audioPlayer,
              required this.duration,
              required this.position,
              required this.onClose,
            });

            String _formatDuration(Duration d) {
              String twoDigits(int n) => n.toString().padLeft(2, '0');
              final minutes = twoDigits(d.inMinutes.remainder(60));
              final seconds = twoDigits(d.inSeconds.remainder(60));
              return "$minutes:$seconds";
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF121212),
                appBar: AppBar(
                  backgroundColor: Colors.transparent,
                  elevation: 0,
                  leading: IconButton(
                    icon: const Icon(Icons.keyboard_arrow_down, size: 32, color: Colors.white),
                    onPressed: onClose,
                  ),
                  title: const Text("Now Playing", style: TextStyle(fontSize: 14, color: Colors.white)),
                  centerTitle: true,
                ),
                body: Padding(
                  padding: const EdgeInsets.all(24.0),
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      ClipRRect(
                        borderRadius: BorderRadius.circular(12),
                        child: artwork.isNotEmpty
                            ? Image.network(artwork, width: 300, height: 300, fit: BoxFit.cover, errorBuilder: (_,__,___) => const Icon(Icons.music_note, size: 100))
                            : Container(width: 300, height: 300, color: Colors.deepPurple, child: const Icon(Icons.music_note, size: 100)),
                      ),
                      const SizedBox(height: 30),
                      Align(
                        alignment: Alignment.centerLeft,
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Text(title, style: const TextStyle(fontSize: 22, fontWeight: FontWeight.bold, color: Colors.white)),
                            const SizedBox(height: 4),
                            Text(artist, style: TextStyle(fontSize: 14, color: Colors.grey.shade400)),
                          ],
                        ),
                      ),
                      const SizedBox(height: 20),
                      Slider(
                        activeColor: Colors.greenAccent,
                        inactiveColor: Colors.grey.shade800,
                        min: 0,
                        max: duration.inMilliseconds.toDouble() > 0 ? duration.inMilliseconds.toDouble() : 1.0,
                        value: position.inMilliseconds.toDouble().clamp(0.0, duration.inMilliseconds.toDouble() > 0 ? duration.inMilliseconds.toDouble() : 1.0),
                        onChanged: (val) {
                          audioPlayer.seek(Duration(milliseconds: val.toInt()));
                        },
                      ),
                      Padding(
                        padding: const EdgeInsets.symmetric(horizontal: 16),
                        child: Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            Text(_formatDuration(position), style: TextStyle(color: Colors.grey.shade400, fontSize: 12)),
                            Text(_formatDuration(duration), style: TextStyle(color: Colors.grey.shade400, fontSize: 12)),
                          ],
                        ),
                      ),
                      const SizedBox(height: 20),
                      Row(
                        mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                        children: [
                          IconButton(icon: const Icon(Icons.shuffle, color: Colors.white), onPressed: () {}),
                          IconButton(icon: const Icon(Icons.skip_previous, size: 36, color: Colors.white), onPressed: () {}),
                          CircleAvatar(
                            radius: 32,
                            backgroundColor: Colors.white,
                            child: IconButton(
                              icon: Icon(isPlaying ? Icons.pause : Icons.play_arrow, size: 36, color: Colors.black),
                              onPressed: () {
                                if (isPlaying) {
                                  audioPlayer.pause();
                                } else {
                                  audioPlayer.play();
                                }
                              },
                            ),
                          ),
                          IconButton(icon: const Icon(Icons.skip_next, size: 36, color: Colors.white), onPressed: () {}),
                          IconButton(icon: const Icon(Icons.repeat, color: Colors.white), onPressed: () {}),
                        ],
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class GlobalRadioTab extends StatefulWidget {
            final Function(String, String, String, [String]) onPlay;
            final List<Map<String, dynamic>> favorites;

            const GlobalRadioTab({super.key, required this.onPlay, required this.favorites});

            @override
            State<GlobalRadioTab> createState() => _GlobalRadioTabState();
          }

          class _GlobalRadioTabState extends State<GlobalRadioTab> {
            List<dynamic> _countries = [];
            List<dynamic> _stations = [];
            String _selectedCountry = "Ghana";
            String _searchQuery = "";
            bool _isLoadingCountries = true;
            bool _isLoadingStations = false;

            @override
            void initState() {
              super.initState();
              _fetchCountries();
              _fetchStations("Ghana");
            }

            Future<void> _fetchCountries() async {
              try {
                final response = await http.get(Uri.parse('https://de1.api.radio-browser.info/json/countries'));
                if (response.statusCode == 200) {
                  setState(() {
                    _countries = json.decode(response.body);
                    _isLoadingCountries = false;
                  });
                }
              } catch (e) {
                setState(() => _isLoadingCountries = false);
              }
            }

            Future<void> _fetchStations(String countryName) async {
              setState(() {
                _isLoadingStations = true;
                _selectedCountry = countryName;
              });
              try {
                final encoded = Uri.encodeComponent(countryName);
                final response = await http.get(Uri.parse('https://de1.api.radio-browser.info/json/stations/bycountry/$encoded'));
                if (response.statusCode == 200) {
                  setState(() {
                    _stations = json.decode(response.body);
                    _isLoadingStations = false;
                  });
                }
              } catch (e) {
                setState(() => _isLoadingStations = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              final filtered = _stations.where((s) => (s['name'] ?? '').toLowerCase().contains(_searchQuery.toLowerCase())).toList();

              return Padding(
                padding: const EdgeInsets.all(12.0),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    const Text("Global FM Radio Stations", style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.white)),
                    const SizedBox(height: 10),
                    DropdownButton<String>(
                      value: _countries.any((c) => c['name'] == _selectedCountry) ? _selectedCountry : null,
                      isExpanded: true,
                      dropdownColor: const Color(0xFF282828),
                      items: _countries.map<DropdownMenuItem<String>>((c) {
                        return DropdownMenuItem<String>(value: c['name'], child: Text(c['name'] ?? ''));
                      }).toList(),
                      onChanged: (val) {
                        if (val != null) _fetchStations(val);
                      },
                    ),
                    const SizedBox(height: 10),
                    TextField(
                      decoration: InputDecoration(
                        hintText: "Search FM station...",
                        prefixIcon: const Icon(Icons.search, color: Colors.white),
                        filled: true,
                        fillColor: const Color(0xFF282828),
                        border: OutlineInputBorder(borderRadius: BorderRadius.circular(8), borderSide: BorderSide.none),
                      ),
                      onChanged: (val) => setState(() => _searchQuery = val),
                    ),
                    const SizedBox(height: 10),
                    Expanded(
                      child: _isLoadingStations
                          ? const Center(child: CircularProgressIndicator(color: Colors.greenAccent))
                          : ListView.builder(
                              itemCount: filtered.length,
                              itemBuilder: (context, index) {
                                final station = filtered[index];
                                final name = station['name'] ?? 'Radio';
                                final url = station['url_resolved'] ?? station['url'] ?? '';
                                final favicon = station['favicon'] ?? '';

                                return Card(
                                  color: const Color(0xFF1E1E1E),
                                  child: ListTile(
                                    leading: favicon.isNotEmpty
                                        ? Image.network(favicon, width: 40, height: 40, errorBuilder: (_,__,___) => const Icon(Icons.radio))
                                        : const Icon(Icons.radio, color: Colors.greenAccent),
                                    title: Text(name, style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                                    subtitle: Text(_selectedCountry, style: TextStyle(color: Colors.grey.shade400)),
                                    trailing: IconButton(
                                      icon: const Icon(Icons.play_circle_fill, color: Colors.greenAccent, size: 36),
                                      onPressed: () => widget.onPlay(url, name, _selectedCountry, favicon),
                                    ),
                                  ),
                                );
                              },
                            ),
                    ),
                  ],
                ),
              );
            }
          }

          class FullMusicSearchTab extends StatefulWidget {
            final Function(String, String, String, [String]) onPlay;
            final Function(String, String, String, String) onDownload;

            const FullMusicSearchTab({super.key, required this.onPlay, required this.onDownload});

            @override
            State<FullMusicSearchTab> createState() => _FullMusicSearchTabState();
          }

          class _FullMusicSearchTabState extends State<FullMusicSearchTab> {
            List<Map<String, String>> _tracks = [
              {
                "title": "Acoustic Breeze",
                "artist": "Bensound",
                "url": "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                "artwork": "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500"
              },
              {
                "title": "Creative Minds",
                "artist": "AudioLibrary",
                "url": "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
                "artwork": "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=500"
              },
              {
                "title": "Summer Memories",
                "artist": "VibeMusic",
                "url": "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
                "artwork": "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=500"
              },
              {
                "title": "Inspiring Cinematic",
                "artist": "Relaxation Sound",
                "url": "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",
                "artwork": "https://images.unsplash.com/photo-1511379938547-c1f69419868d?w=500"
              },
            ];

            String _searchQuery = "";

            @override
            Widget build(BuildContext context) {
              final filtered = _tracks.where((t) => 
                t['title']!.toLowerCase().contains(_searchQuery.toLowerCase()) ||
                t['artist']!.toLowerCase().contains(_searchQuery.toLowerCase())
              ).toList();

              return Padding(
                padding: const EdgeInsets.all(12.0),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    const Text("Full-Length Music Streaming", style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.white)),
                    const SizedBox(height: 10),
                    TextField(
                      style: const TextStyle(color: Colors.white),
                      decoration: InputDecoration(
                        hintText: "Search full tracks...",
                        hintStyle: TextStyle(color: Colors.grey.shade500),
                        prefixIcon: const Icon(Icons.search, color: Colors.white),
                        filled: true,
                        fillColor: const Color(0xFF282828),
                        border: OutlineInputBorder(borderRadius: BorderRadius.circular(8), borderSide: BorderSide.none),
                      ),
                      onChanged: (val) => setState(() => _searchQuery = val),
                    ),
                    const SizedBox(height: 10),
                    Expanded(
                      child: ListView.builder(
                        itemCount: filtered.length,
                        itemBuilder: (context, index) {
                          final track = filtered[index];
                          return Card(
                            color: const Color(0xFF1E1E1E),
                            child: ListTile(
                              leading: ClipRRect(
                                borderRadius: BorderRadius.circular(4),
                                child: Image.network(track['artwork']!, width: 45, height: 45, fit: BoxFit.cover),
                              ),
                              title: Text(track['title']!, style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                              subtitle: Text(track['artist']!, style: TextStyle(color: Colors.grey.shade400)),
                              trailing: Row(
                                mainAxisSize: MainAxisSize.min,
                                children: [
                                  IconButton(
                                    icon: const Icon(Icons.download, color: Colors.blueAccent),
                                    onPressed: () => widget.onDownload(track['url']!, "${track['title']}.mp3", track['artist']!, track['artwork']!),
                                  ),
                                  IconButton(
                                    icon: const Icon(Icons.play_circle_fill, color: Colors.greenAccent, size: 36),
                                    onPressed: () => widget.onPlay(track['url']!, track['title']!, track['artist']!, track['artwork']!),
                                  ),
                                ],
                              ),
                            ),
                          );
                        },
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class FavoritesTab extends StatelessWidget {
            final List<Map<String, dynamic>> favorites;
            final Function(String, String, String, [String]) onPlay;

            const FavoritesTab({super.key, required this.favorites, required this.onPlay});

            @override
            Widget build(BuildContext context) {
              if (favorites.isEmpty) {
                return const Center(child: Text("No favorites added yet.", style: TextStyle(color: Colors.grey)));
              }
              return ListView.builder(
                itemCount: favorites.length,
                itemBuilder: (context, index) {
                  final item = favorites[index];
                  return ListTile(
                    title: Text(item['title'], style: const TextStyle(color: Colors.white)),
                    subtitle: Text(item['artist'], style: TextStyle(color: Colors.grey.shade400)),
                    trailing: IconButton(
                      icon: const Icon(Icons.play_arrow, color: Colors.greenAccent),
                      onPressed: () => onPlay(item['url'], item['title'], item['artist'], item['artwork']),
                    ),
                  );
                },
              );
            }
          }

          class LibraryTab extends StatelessWidget {
            final List<Map<String, dynamic>> downloadedSongs;
            final Function(String, String, String, [String]) onPlay;

            const LibraryTab({super.key, required this.downloadedSongs, required this.onPlay});

            @override
            Widget build(BuildContext context) {
              if (downloadedSongs.isEmpty) {
                return const Center(child: Text("No offline downloaded songs yet.", style: TextStyle(color: Colors.grey)));
              }
              return ListView.builder(
                itemCount: downloadedSongs.length,
                itemBuilder: (context, index) {
                  final song = downloadedSongs[index];
                  return Card(
                    color: const Color(0xFF1E1E1E),
                    child: ListTile(
                      leading: Image.network(song['artwork'], width: 45, height: 45, fit: BoxFit.cover, errorBuilder: (_,__,___) => const Icon(Icons.music_note)),
                      title: Text(song['title'], style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                      subtitle: Text(song['artist'], style: TextStyle(color: Colors.grey.shade400)),
                      trailing: IconButton(
                        icon: const Icon(Icons.play_circle_fill, color: Colors.greenAccent, size: 36),
                        onPressed: () => onPlay(song['url'], song['title'], song['artist'], song['artwork']),
                      ),
                    ),
                  );
                },
              );
            }
          }
          EOF

          # Inject Internet Permission into AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' $MANIFEST
            sed -i '/<application/i \    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>' $MANIFEST
            sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>' $MANIFEST
          fi

          # Update minSdk to 24 for audio plugins
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' $BUILD_GRADLE
            sed -i 's/minSdk = flutter.minSdkVersion/minSdkVersion = 24/g' $BUILD_GRADLE
          fi

          flutter pub get
          flutter build apk --release
