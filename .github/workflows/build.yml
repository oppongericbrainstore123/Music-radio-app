name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Generate and Build App
        run: |
          flutter create app_project --org com.musicradio --platforms=android
          cd app_project

          cat << 'EOF' > pubspec.yaml
          name: music_radio_app
          description: Music streaming, offline player, DJ studio and global FM radio.
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            just_audio: ^0.9.36
            just_audio_background: ^0.0.1-beta.11
            http: ^1.2.0
            path_provider: ^2.1.2
            shared_preferences: ^2.2.2
            on_audio_query: ^2.9.0
            speech_to_text: ^6.6.0
            webview_flutter: ^4.7.0

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
          EOF

          mkdir -p lib
          curl -sL https://raw.githubusercontent.com/oppongericbrainstore123/MusicRadioHub/main/lib/main.dart -o lib/main.dart || true

          if [ ! -s lib/main.dart ]; then
            python3 -c "
            with open('lib/main.dart', 'w') as f:
                f.write('''import 'dart:async';\nimport 'dart:convert';\nimport 'dart:io';\nimport 'package:flutter/material.dart';\nimport 'package:http/http.dart' as http;\nimport 'package:just_audio/just_audio.dart';\nimport 'package:just_audio_background/just_audio_background.dart';\nimport 'package:on_audio_query/on_audio_query.dart';\nimport 'package:path_provider/path_provider.dart';\nimport 'package:shared_preferences/shared_preferences.dart';\nimport 'package:speech_to_text/speech_to_text.dart' as stt;\nimport 'package:webview_flutter/webview_flutter.dart';\n\nvoid main() { runApp(MaterialApp(home: Scaffold(body: Center(child: Text('Music & Radio Hub'))))); }\n''')
            "
          fi

          python3 - << 'PY'
          import glob

          p = 'android/app/src/main/AndroidManifest.xml'
          clean_manifest = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <application
                  android:name="android.app.Application"
                  android:label="Music Radio Hub"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme"/>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
                  <service android:name="com.ryanheise.audioservice.AudioService" android:foregroundServiceType="mediaPlayback" android:exported="true">
                      <intent-filter><action android:name="android.media.browse.MediaBrowserService"/></intent-filter>
                  </service>
                  <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MEDIA_BUTTON"/></intent-filter>
                  </receiver>
              </application>
          </manifest>'''
          open(p, 'w').write(clean_manifest)

          for f in glob.glob('android/app/src/main/kotlin/**/MainActivity.kt', recursive=True):
              k = open(f).read()
              k = k.replace('import io.flutter.embedding.android.FlutterActivity', 'import com.ryanheise.audioservice.AudioServiceActivity')
              k = k.replace('FlutterActivity()', 'AudioServiceActivity()')
              open(f, 'w').write(k)

          for g in ['android/app/build.gradle', 'android/app/build.gradle.kts']:
              try:
                  t = open(g).read()
              except FileNotFoundError:
                  continue
              t = t.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 24')
              t = t.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
              open(g, 'w').write(t)
          PY

          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app_project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
