name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Generate and Build App
        run: |
          flutter create app_project --org com.musicradio --platforms=android
          cd app_project

          cat << 'EOF' > pubspec.yaml
          name: music_radio_app
          description: Music streaming, offline player, DJ studio and global FM radio.
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            just_audio: ^0.9.36
            just_audio_background: ^0.0.1-beta.11
            http: ^1.2.0
            path_provider: ^2.1.2
            shared_preferences: ^2.2.2
            on_audio_query: ^2.9.0
            speech_to_text: ^6.6.0

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
          EOF

          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';

          import 'package:flutter/material.dart';
          import 'package:http/http.dart' as http;
          import 'package:just_audio/just_audio.dart';
          import 'package:just_audio_background/just_audio_background.dart';
          import 'package:on_audio_query/on_audio_query.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:speech_to_text/speech_to_text.dart' as stt;

          const String kAppName = 'MusicRadioHub';
          const String kApiBase = 'https://api.audius.co/v1';
          const String kJamendoId = '5c8a0024';
          const String kSoundCloudClientId = 'a3250268a7356230bfdf26880ea77fcd';

          final GlobalKey<ScaffoldMessengerState> messengerKey = GlobalKey<ScaffoldMessengerState>();
          final PlayerController player = PlayerController();
          final SoundCloudService soundcloud = SoundCloudService();
          final FollowService follows = FollowService();
          final LocalCacheService cache = LocalCacheService();

          void toast(String message) {
            messengerKey.currentState
              ?..hideCurrentSnackBar()
              ..showSnackBar(SnackBar(content: Text(message)));
          }

          String imgOf(dynamic m) {
            if (m is Map) {
              return (m['480x480'] ?? m['1000x1000'] ?? m['150x150'] ?? '').toString();
            }
            return '';
          }

          String fmt(Duration d) {
            String two(int n) => n.toString().padLeft(2, '0');
            final h = d.inHours;
            final m = two(d.inMinutes.remainder(60));
            final s = two(d.inSeconds.remainder(60));
            return h > 0 ? '$h:$m:$s' : '$m:$s';
          }

          class LocalCacheService {
            final Map<String, dynamic> _mem = {};
            Future<List<dynamic>> getCachedList(Uri uri) async {
              final key = uri.toString();
              if (_mem.containsKey(key)) return _mem[key];
              try {
                final res = await http.get(uri, headers: {'User-Agent': 'MusicRadioHub/1.0'}).timeout(const Duration(seconds: 15));
                if (res.statusCode != 200) return [];
                final body = json.decode(res.body);
                if (body is List) {
                  _mem[key] = body;
                  return body;
                }
                final d = (body is Map) ? (body['data'] ?? body['results'] ?? body['response']) : null;
                if (d is Map && d['docs'] is List) {
                  final docs = d['docs'] as List;
                  _mem[key] = docs;
                  return docs;
                }
                final list = d is List ? d : <dynamic>[];
                _mem[key] = list;
                return list;
              } catch (_) {
                return [];
              }
            }
          }

          Future<List<dynamic>> getList(Uri uri) async => cache.getCachedList(uri);

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await JustAudioBackground.init(
              androidNotificationChannelId: 'com.musicradio.channel.audio',
              androidNotificationChannelName: 'Audio playback',
              androidNotificationOngoing: true,
            );
            await soundcloud.init();
            await follows.init();
            await player.init();
            runApp(const MusicRadioApp());
          }

          Uri jamendoUri(String path, Map<String, String> q) => Uri.https('api.jamendo.com', '/v3.0$path', {
                'client_id': kJamendoId,
                'format': 'json',
                'audioformat': 'mp32',
                ...q,
              });

          class Track {
            final String id;
            final String title;
            final String artist;
            final String url;
            final String artwork;
            final bool isLocal;
            final bool isLive;
            final bool canDownload;

            const Track({
              required this.id,
              required this.title,
              required this.artist,
              required this.url,
              this.artwork = '',
              this.isLocal = false,
              this.isLive = false,
              this.canDownload = true,
            });

            Map<String, dynamic> toJson() => {
                  'id': id,
                  'title': title,
                  'artist': artist,
                  'url': url,
                  'artwork': artwork,
                  'isLocal': isLocal,
                  'isLive': isLive,
                  'canDownload': canDownload,
                };

            factory Track.fromJson(Map<String, dynamic> j) => Track(
                  id: (j['id'] ?? '').toString(),
                  title: (j['title'] ?? 'Untitled Track').toString(),
                  artist: (j['artist'] ?? 'Unknown Artist').toString(),
                  url: (j['url'] ?? '').toString(),
                  artwork: (j['artwork'] ?? '').toString(),
                  isLocal: j['isLocal'] == true,
                  isLive: j['isLive'] == true,
                  canDownload: j['canDownload'] != false,
                );

            factory Track.fromAudius(Map<String, dynamic> j) {
              final id = j['id'].toString();
              final user = j['user'];
              return Track(
                id: 'audius-$id',
                title: (j['title'] ?? 'Untitled Track').toString(),
                artist: user is Map ? (user['name'] ?? 'Audius Artist').toString() : 'Audius Artist',
                url: '$kApiBase/tracks/$id/stream?app_name=$kAppName',
                artwork: imgOf(j['artwork']),
              );
            }

            factory Track.fromJamendo(Map<String, dynamic> j, {String artist = '', String image = ''}) {
              return Track(
                id: 'jm-${j['id']}',
                title: (j['name'] ?? j['title'] ?? 'Untitled Track').toString(),
                artist: (j['artist_name'] ?? artist).toString(),
                url: (j['audio'] ?? j['audiodownload'] ?? '').toString(),
                artwork: (j['image'] ?? j['album_image'] ?? image).toString(),
                canDownload: j['audiodownload_allowed'] != false,
              );
            }

            factory Track.fromSoundCloud(Map<String, dynamic> j) {
              final id = j['id'].toString();
              final user = j['user'];
              final artworkUrl = (j['artwork_url'] ?? (user is Map ? user['avatar_url'] : '') ?? '').toString();
              final highResArtwork = artworkUrl.replaceAll('large.jpg', 't500x500.jpg');
              final streamUrl = j['stream_url'] != null 
                  ? '${j['stream_url']}?client_id=$kSoundCloudClientId'
                  : 'https://api.soundcloud.com/tracks/$id/stream?client_id=$kSoundCloudClientId';

              return Track(
                id: 'sc-$id',
                title: (j['title'] ?? 'Untitled Track').toString(),
                artist: user is Map ? (user['username'] ?? 'SoundCloud Creator').toString() : 'SoundCloud Creator',
                url: streamUrl,
                artwork: highResArtwork,
              );
            }
          }

          List<Track> audiusTracks(List<dynamic> list) => list
              .where((j) => j is Map && j['is_streamable'] != false)
              .map((j) => Track.fromAudius(Map<String, dynamic>.from(j as Map)))
              .toList();

          List<Track> jamendoTracks(List<dynamic> list, {String artist = '', String image = ''}) => list
              .whereType<Map>()
              .map((j) => Track.fromJamendo(Map<String, dynamic>.from(j), artist: artist, image: image))
              .where((t) => t.url.isNotEmpty)
              .toList();

          class SoundCloudService extends ChangeNotifier {
            List<Track> libraryTracks = [];
            List<Track> searchResults = [];
            bool linked = false;
            bool searching = false;
            SharedPreferences? _prefs;

            Future<void> init() async {
              _prefs = await SharedPreferences.getInstance();
              linked = _prefs?.getBool('sc_linked') ?? false;
              final raw = _prefs?.getString('sc_library');
              if (raw != null) {
                try {
                  libraryTracks = (json.decode(raw) as List).map((e) => Track.fromJson(Map<String, dynamic>.from(e as Map))).toList();
                } catch (_) {}
              }
            }

            Future<void> search(String query) async {
              if (query.isEmpty) {
                searchResults = [];
                notifyListeners();
                return;
              }
              searching = true;
              notifyListeners();
              try {
                final uri = Uri.parse('https://api.soundcloud.com/tracks').replace(queryParameters: {
                  'client_id': kSoundCloudClientId,
                  'q': query,
                  'limit': '30',
                });
                final res = await http.get(uri);
                if (res.statusCode == 200) {
                  final list = json.decode(res.body) as List;
                  searchResults = list.whereType<Map>().map((m) => Track.fromSoundCloud(Map<String, dynamic>.from(m))).toList();
                }
              } catch (_) {}
              searching = false;
              notifyListeners();
            }

            Future<void> linkAccount() async {
              linked = true;
              await _prefs?.setBool('sc_linked', true);
              try {
                final uri = Uri.parse('https://api.soundcloud.com/tracks').replace(queryParameters: {
                  'client_id': kSoundCloudClientId,
                  'limit': '25',
                });
                final res = await http.get(uri);
                if (res.statusCode == 200) {
                  final list = json.decode(res.body) as List;
                  libraryTracks = list.whereType<Map>().map((m) => Track.fromSoundCloud(Map<String, dynamic>.from(m))).toList();
                  await _save();
                }
              } catch (_) {}
              notifyListeners();
              toast('SoundCloud library successfully linked!');
            }

            Future<void> unlink() async {
              linked = false;
              libraryTracks.clear();
              await _prefs?.remove('sc_linked');
              await _prefs?.remove('sc_library');
              notifyListeners();
              toast('SoundCloud unlinked');
            }

            Future<void> _save() async {
              await _prefs?.setString('sc_library', json.encode(libraryTracks.map((t) => t.toJson()).toList()));
            }

            Future<void> importTrack(Track t) async {
              if (!libraryTracks.any((x) => x.id == t.id)) {
                libraryTracks.add(t);
                await _save();
                notifyListeners();
                toast('Imported "${t.title}" to library');
              }
            }
          }

          class FollowedArtist {
            final String source;
            final String id;
            final String name;
            final String image;
            const FollowedArtist({required this.source, required this.id, required this.name, this.image = ''});

            Map<String, dynamic> toJson() => {'source': source, 'id': id, 'name': name, 'image': image};
            factory FollowedArtist.fromJson(Map<String, dynamic> j) => FollowedArtist(
                  source: (j['source'] ?? 'audius').toString(),
                  id: (j['id'] ?? '').toString(),
                  name: (j['name'] ?? '').toString(),
                  image: (j['image'] ?? '').toString(),
                );
          }

          class FollowService extends ChangeNotifier {
            List<FollowedArtist> artists = [];
            SharedPreferences? _prefs;

            Future<void> init() async {
              _prefs = await SharedPreferences.getInstance();
              final raw = _prefs?.getString('followed');
              if (raw != null) {
                try {
                  artists = (json.decode(raw) as List).map((e) => FollowedArtist.fromJson(Map<String, dynamic>.from(e as Map))).toList();
                } catch (_) {}
              }
            }

            bool isFollowing(FollowedArtist a) => artists.any((x) => x.source == a.source && x.id == a.id);

            Future<void> toggle(FollowedArtist a) async {
              if (isFollowing(a)) {
                artists.removeWhere((x) => x.source == a.source && x.id == a.id);
              } else {
                artists.add(a);
              }
              notifyListeners();
              await _prefs?.setString('followed', json.encode(artists.map((x) => x.toJson()).toList()));
            }
          }

          Future<List<Track>> loadArtistTracks(FollowedArtist a) async {
            if (a.source == 'jamendo') {
              final r = await getList(jamendoUri('/artists/tracks/', {'id': a.id}));
              if (r.isEmpty || r.first is! Map) return <Track>[];
              final tr = ((r.first as Map)['tracks'] as List?) ?? [];
              return jamendoTracks(tr, artist: a.name, image: a.image);
            }
            final r = await getList(Uri.parse('$kApiBase/users/${a.id}/tracks').replace(queryParameters: {'app_name': kAppName, 'limit': '100'}));
            return audiusTracks(r);
          }

          class PlayerController extends ChangeNotifier {
            final AndroidEqualizer equalizer = AndroidEqualizer();
            final AndroidLoudnessEnhancer loudness = AndroidLoudnessEnhancer();
            late final AudioPlayer audio = AudioPlayer(
              audioPipeline: AudioPipeline(androidAudioEffects: [loudness, equalizer]),
            );
            List<Track> queue = [];
            int index = 0;
            List<Track> favorites = [];
            List<Track> downloads = [];
            double speed = 1.0;
            bool shuffle = false;
            LoopMode loop = LoopMode.off;
            DateTime? sleepEnd;
            Timer? _sleepTimer;
            SharedPreferences? _prefs;

            Track? get current => (queue.isNotEmpty && index >= 0 && index < queue.length) ? queue[index] : null;
            bool isFavorite(Track t) => favorites.any((f) => f.id == t.id);
            bool isDownloaded(Track t) => downloads.any((d) => d.id == t.id);

            Future<void> init() async {
              _prefs = await SharedPreferences.getInstance();
              favorites = _load('favorites');
              downloads = _load('downloads').where((t) => File(t.url).existsSync()).toList();
              audio.currentIndexStream.listen((i) {
                if (i != null && i != index) {
                  index = i;
                  notifyListeners();
                }
              });
              audio.playerStateStream.listen((_) => notifyListeners());
            }

            List<Track> _load(String key) {
              final raw = _prefs?.getString(key);
              if (raw == null) return [];
              try {
                return (json.decode(raw) as List).map((e) => Track.fromJson(Map<String, dynamic>.from(e as Map))).toList();
              } catch (_) {
                return [];
              }
            }

            Future<void> _save(String key, List<Track> list) async {
              await _prefs?.setString(key, json.encode(list.map((t) => t.toJson()).toList()));
            }

            Future<void> playQueue(List<Track> tracks, int start) async {
              if (tracks.isEmpty || start < 0 || start >= tracks.length) return;
              final resolved = tracks.map((t) {
                final local = downloads.where((d) => d.id == t.id);
                return local.isNotEmpty ? local.first : t;
              }).toList();
              queue = resolved;
              index = start;
              notifyListeners();
              try {
                final sources = <AudioSource>[];
                for (var i = 0; i < resolved.length; i++) {
                  final t = resolved[i];
                  sources.add(AudioSource.uri(
                    t.isLocal ? Uri.file(t.url) : Uri.parse(t.url),
                    tag: MediaItem(
                      id: '$i-${t.id}',
                      title: t.title,
                      artist: t.artist,
                      artUri: t.artwork.isNotEmpty ? Uri.parse(t.artwork) : null,
                    ),
                  ));
                }
                await audio.setAudioSource(ConcatenatingAudioSource(children: sources), initialIndex: start);
                await audio.setSpeed(speed);
                audio.play();
              } catch (e) {
                toast('Could not play this item');
              }
            }

            Future<void> togglePlay() async {
              if (audio.playing) {
                await audio.pause();
              } else {
                audio.play();
              }
            }

            Future<void> next() async {
              await audio.seekToNext();
            }

            Future<void> previous() async {
              await audio.seekToPrevious();
            }

            Future<void> pauseAll() async {
              await audio.pause();
              notifyListeners();
            }

            Future<void> toggleFavorite(Track t) async {
              if (isFavorite(t)) {
                favorites.removeWhere((f) => f.id == t.id);
              } else {
                favorites.add(t);
              }
              notifyListeners();
              await _save('favorites', favorites);
            }

            Future<void> download(Track t) async {
              if (t.isLive || !t.canDownload) {
                toast('This item can only be streamed');
                return;
              }
              if (isDownloaded(t)) return;
              toast('Downloading "${t.title}"...');
              try {
                final base = await getExternalStorageDirectory() ?? await getApplicationDocumentsDirectory();
                final dir = Directory('${base.path}/Music');
                if (!await dir.exists()) await dir.create(recursive: true);
                final safe = t.title.replaceAll(RegExp(r'[^A-Za-z0-9 _-]'), '_');
                final file = File('${dir.path}/${t.id.hashCode.abs()}_$safe.mp3');
                final res = await http.get(Uri.parse(t.url)).timeout(const Duration(minutes: 5));
                if (res.statusCode != 200) throw 'HTTP ${res.statusCode}';
                await file.writeAsBytes(res.bodyBytes);
                downloads.add(Track(
                  id: t.id,
                  title: t.title,
                  artist: t.artist,
                  url: file.path,
                  artwork: t.artwork,
                  isLocal: true,
                ));
                notifyListeners();
                await _save('downloads', downloads);
                toast('Saved for offline listening');
              } catch (e) {
                toast('Download failed');
              }
            }

            Future<void> removeDownload(Track t) async {
              try {
                final f = File(t.url);
                if (await f.exists()) await f.delete();
              } catch (_) {}
              downloads.removeWhere((d) => d.id == t.id);
              notifyListeners();
              await _save('downloads', downloads);
            }

            Future<void> toggleShuffle() async {
              shuffle = !shuffle;
              if (shuffle) await audio.shuffle();
              await audio.setShuffleModeEnabled(shuffle);
              notifyListeners();
            }

            Future<void> cycleLoop() async {
              loop = loop == LoopMode.off ? LoopMode.all : (loop == LoopMode.all ? LoopMode.one : LoopMode.off);
              await audio.setLoopMode(loop);
              notifyListeners();
            }

            Future<void> setSpeed(double s) async {
              speed = s;
              await audio.setSpeed(s);
              notifyListeners();
            }

            void setSleepTimer(int minutes) {
              _sleepTimer?.cancel();
              sleepEnd = null;
              if (minutes > 0) {
                sleepEnd = DateTime.now().add(Duration(minutes: minutes));
                _sleepTimer = Timer(Duration(minutes: minutes), () {
                  sleepEnd = null;
                  pauseAll();
                });
                toast('Sleep timer: $minutes min');
              } else {
                toast('Sleep timer off');
              }
              notifyListeners();
            }
          }

          class MusicRadioApp extends StatelessWidget {
            const MusicRadioApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                scaffoldMessengerKey: messengerKey,
                title: 'Music & Radio Hub',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF121212),
                  colorSchemeSeed: Colors.deepPurple,
                  useMaterial3: true,
                ),
                home: const HomeScreen(),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});

            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            int _tab = 0;
            static final List<Widget> _pages = [
              const RadioTab(),
              const DiscoverTab(),
              const SearchTab(),
              const LocalTab(),
              const DjTab(),
              const LibraryTab(),
            ];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Row(
                    children: [
                      Icon(Icons.music_note, color: Colors.greenAccent),
                      SizedBox(width: 8),
                      Text('Music & Radio Hub', style: TextStyle(fontWeight: FontWeight.bold)),
                    ],
                  ),
                ),
                body: Column(
                  children: [
                    Expanded(
                      child: IndexedStack(
                        index: _tab,
                        children: _pages,
                      ),
                    ),
                    const MiniPlayer(),
                  ],
                ),
                bottomNavigationBar: NavigationBar(
                  selectedIndex: _tab,
                  onDestinationSelected: (i) => setState(() => _tab = i),
                  destinations: const [
                    NavigationDestination(icon: Icon(Icons.radio), label: 'Radio'),
                    NavigationDestination(icon: Icon(Icons.explore), label: 'Discover'),
                    NavigationDestination(icon: Icon(Icons.search), label: 'Search'),
                    NavigationDestination(icon: Icon(Icons.phone_android), label: 'Device'),
                    NavigationDestination(icon: Icon(Icons.album), label: 'DJ Studio'),
                    NavigationDestination(icon: Icon(Icons.library_music), label: 'Library'),
                  ],
                ),
              );
            }
          }

          class Art extends StatelessWidget {
            final String url;
            final double size;
            const Art({super.key, required this.url, this.size = 48});

            @override
            Widget build(BuildContext context) {
              Widget placeholder() => Container(
                    width: size,
                    height: size,
                    color: Colors.deepPurple.shade700,
                    child: Icon(Icons.music_note, size: size * 0.5, color: Colors.white70),
                  );
              return ClipRRect(
                borderRadius: BorderRadius.circular(8),
                child: url.isEmpty
                    ? placeholder()
                    : Image.network(url, width: size, height: size, fit: BoxFit.cover, errorBuilder: (_, __, ___) => placeholder()),
              );
            }
          }

          class PlayPauseButton extends StatelessWidget {
            final double size;
            const PlayPauseButton({super.key, this.size = 36});

            @override
            Widget build(BuildContext context) {
              return StreamBuilder<PlayerState>(
                stream: player.audio.playerStateStream,
                builder: (context, snap) {
                  final st = snap.data;
                  final loading = st?.processingState == ProcessingState.loading || st?.processingState == ProcessingState.buffering;
                  final playing = st?.playing ?? false;
                  if (loading) {
                    return SizedBox(
                      width: size + 16,
                      height: size + 16,
                      child: const Padding(padding: EdgeInsets.all(12), child: CircularProgressIndicator(strokeWidth: 3)),
                    );
                  }
                  return IconButton(
                    iconSize: size,
                    icon: Icon(playing ? Icons.pause_circle_filled : Icons.play_circle_filled),
                    onPressed: player.togglePlay,
                  );
                },
              );
            }
          }

          class TrackTile extends StatelessWidget {
            final Track track;
            final VoidCallback onTap;
            final bool downloadsMode;
            const TrackTile({super.key, required this.track, required this.onTap, this.downloadsMode = false});

            @override
            Widget build(BuildContext context) {
              return AnimatedBuilder(
                animation: player,
                builder: (context, _) {
                  final fav = player.isFavorite(track);
                  final dl = player.isDownloaded(track);
                  return ListTile(
                    leading: Art(url: track.artwork, size: 48),
                    title: Text(track.title, maxLines: 1, overflow: TextOverflow.ellipsis),
                    subtitle: Text(track.artist, maxLines: 1, overflow: TextOverflow.ellipsis),
                    onTap: onTap,
                    trailing: Row(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        IconButton(
                          icon: Icon(fav ? Icons.favorite : Icons.favorite_border, color: fav ? Colors.redAccent : null),
                          onPressed: () => player.toggleFavorite(track),
                        ),
                        if (downloadsMode)
                          IconButton(icon: const Icon(Icons.delete_outline), onPressed: () => player.removeDownload(track))
                        else if (!track.isLive && track.canDownload)
                          IconButton(
                            icon: Icon(dl ? Icons.download_done : Icons.download, color: dl ? Colors.greenAccent : null),
                            onPressed: dl ? null : () => player.download(track),
                          ),
                      ],
                    ),
                  );
                },
              );
            }
          }

          class MiniPlayer extends StatelessWidget {
            const MiniPlayer({super.key});

            @override
            Widget build(BuildContext context) {
              return AnimatedBuilder(
                animation: player,
                builder: (context, _) {
                  final t = player.current;
                  if (t == null) return const SizedBox.shrink();
                  return Material(
                    color: const Color(0xFF282828),
                    child: InkWell(
                      onTap: () => Navigator.of(context).push(MaterialPageRoute(builder: (_) => const PlayerScreen())),
                      child: Padding(
                        padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
                        child: Row(
                          children: [
                            Art(url: t.artwork, size: 44),
