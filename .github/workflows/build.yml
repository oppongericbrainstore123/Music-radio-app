name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Build Custom APK
        run: |
          # Create a clean standalone workspace
          flutter create build_workspace --org com.musicradio --platforms=android

          # Safely copy your custom code and pubspec from mobile_app
          if [ -f "mobile_app/lib/main.dart" ]; then
            cp mobile_app/lib/main.dart build_workspace/lib/main.dart
            echo "Copied main.dart successfully"
          fi

          if [ -f "mobile_app/pubspec.yaml" ]; then
            cp mobile_app/pubspec.yaml build_workspace/pubspec.yaml
            echo "Copied pubspec.yaml successfully"
          fi

          cd build_workspace

          # Automatically inject Internet Permission into AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' $MANIFEST
          fi

          # Update minSdk to 24 for path_provider and file_picker
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' $BUILD_GRADLE
            sed -i 's/minSdk = flutter.minSdkVersion/minSdkVersion 24/g' $BUILD_GRADLE
          fi

          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: 'build_workspace/build/app/outputs/flutter-apk/app-release.apk'
