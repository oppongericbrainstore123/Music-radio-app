name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Generate and Build App
        run: |
          flutter create app_project --org com.musicradio --platforms=android
          cd app_project

          # Write pubspec.yaml with all required multimedia dependencies
          cat << 'EOF' > pubspec.yaml
          name: music_radio_app
          description: A multimedia radio, streaming, and local player app.
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            just_audio: ^0.9.36
            http: ^1.2.0
            path_provider: ^2.1.2
            file_picker: ^6.1.1

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

          # Write lib/main.dart with global country radio search, streaming, and downloads
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:just_audio/just_audio.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:http/http.dart' as http;
          import 'dart:io';
          import 'dart:convert';

          void main() {
            runApp(const MusicRadioApp());
          }

          class MusicRadioApp extends StatelessWidget {
            const MusicRadioApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Music & Radio Hub',
                theme: ThemeData(
                  primarySwatch: Colors.deepPurple,
                  useMaterial3: true,
                ),
                home: const MainHomeScreen(),
              );
            }
          }

          class MainHomeScreen extends StatefulWidget {
            const MainHomeScreen({super.key});

            @override
            State<MainHomeScreen> createState() => _MainHomeScreenState();
          }

          class _MainHomeScreenState extends State<MainHomeScreen> {
            int _currentIndex = 0;
            final AudioPlayer _audioPlayer = AudioPlayer();
            String _nowPlaying = "Nothing playing";
            bool _isDownloading = false;

            @override
            void dispose() {
              _audioPlayer.dispose();
              super.dispose();
            }

            Future<void> _playAudio(String url, String title) async {
              try {
                await _audioPlayer.setUrl(url);
                await _audioPlayer.play();
                setState(() {
                  _nowPlaying = title;
                });
              } catch (e) {
                setState(() {
                  _nowPlaying = "Error playing audio";
                });
              }
            }

            Future<void> _downloadFile(String url, String fileName) async {
              try {
                setState(() => _isDownloading = true);
                final response = await http.get(Uri.parse(url));
                final directory = await getApplicationDocumentsDirectory();
                final file = File('${directory.path}/$fileName');
                await file.writeAsBytes(response.bodyBytes);
                setState(() => _isDownloading = false);
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(content: Text('Downloaded successfully to ${file.path}')),
                  );
                }
              } catch (e) {
                setState(() => _isDownloading = false);
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(content: Text('Download failed. Check connection.')),
                  );
                }
              }
            }

            @override
            Widget build(BuildContext context) {
              final List<Widget> pages = [
                const GlobalRadioSearchTab(),
                OnlineMusicTab(onPlay: _playAudio, onDownload: _downloadFile),
                const FavoritesTab(),
                LocalFileTab(onPlay: _playAudio),
              ];

              return Scaffold(
                appBar: AppBar(
                  title: const Text('Music & Radio Hub'),
                  backgroundColor: Colors.deepPurple.shade100,
                ),
                body: Column(
                  children: [
                    Expanded(child: pages[_currentIndex]),
                    Container(
                      padding: const EdgeInsets.all(12),
                      color: Colors.deepPurple.shade50,
                      child: Row(
                        children: [
                          const Icon(Icons.music_note, color: Colors.deepPurple),
                          const SizedBox(width: 12),
                          Expanded(
                            child: Text(
                              _isDownloading ? "Downloading track..." : "Playing: $_nowPlaying",
                              style: const TextStyle(fontWeight: FontWeight.bold),
                              overflow: TextOverflow.ellipsis,
                            ),
                          ),
                          IconButton(
                            icon: const Icon(Icons.pause),
                            onPressed: () => _audioPlayer.pause(),
                          ),
                          IconButton(
                            icon: const Icon(Icons.play_arrow),
                            onPressed: () => _audioPlayer.play(),
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: _currentIndex,
                  type: BottomNavigationBarType.fixed,
                  selectedItemColor: Colors.deepPurple,
                  unselectedItemColor: Colors.grey,
                  onTap: (index) => setState(() => _currentIndex = index),
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.public), label: 'Radio'),
                    BottomNavigationBarItem(icon: Icon(Icons.library_music), label: 'Online'),
                    BottomNavigationBarItem(icon: Icon(Icons.favorite), label: 'Favorites'),
                    BottomNavigationBarItem(icon: Icon(Icons.folder), label: 'Local'),
                  ],
                ),
              );
            }
          }

          class GlobalRadioSearchTab extends StatefulWidget {
            const GlobalRadioSearchTab({super.key});

            @override
            State<GlobalRadioSearchTab> createState() => _GlobalRadioSearchTabState();
          }

          class _GlobalRadioSearchTabState extends State<GlobalRadioSearchTab> {
            String _selectedCountry = "Ghana";
            String _searchQuery = "";
            List<dynamic> _stations = [];
            bool _isLoading = false;

            final List<String> _countries = [
              "Ghana", "United States", "United Kingdom", "Nigeria", "South Africa", "Canada", "Germany", "France"
            ];

            final Map<String, List<Map<String, String>>> _mockCountryStations = {
              "Ghana": [
                {"name": "Joy 99.7 FM", "url": "https://stream.zeno.fm/f3wvbbqmdg8uv", "genre": "News/Talk"},
                {"name": "Peace 104.3 FM", "url": "https://stream.zeno.fm/0r0xa792m8quv", "genre": "Akan/Talk"},
                {"name": "Citi 97.3 FM", "url": "https://stream.zeno.fm/bb8779ka5quv", "genre": "English/Music"}
              ],
              "United States": [
                {"name": "Hot 97 NY", "url": "https://stream.zeno.fm/f3wvbbqmdg8uv", "genre": "Hip Hop"},
                {"name": "Jazz 24 Seattle", "url": "https://stream.zeno.fm/0r0xa792m8quv", "genre": "Smooth Jazz"}
              ],
              "United Kingdom": [
                {"name": "BBC World Service", "url": "https://stream.zeno.fm/bb8779ka5quv", "genre": "Global News"},
                {"name": "Capital XTRA London", "url": "https://stream.zeno.fm/f3wvbbqmdg8uv", "genre": "Dance/Urban"}
              ],
              "Nigeria": [
                {"name": "Beat 99.9 FM Lagos", "url": "https://stream.zeno.fm/0r0xa792m8quv", "genre": "Afrobeats"},
                {"name": "Cool 96.9 FM", "url": "https://stream.zeno.fm/bb8779ka5quv", "genre": "Pop/Hits"}
              ]
            };

            @override
            Widget build(BuildContext context) {
              final stations = _mockCountryStations[_selectedCountry] ?? [
                {"name": "Global Hit Radio", "url": "https://stream.zeno.fm/f3wvbbqmdg8uv", "genre": "Universal"}
              ];

              final filteredStations = stations.where((s) => 
                s["name"]!.toLowerCase().contains(_searchQuery.toLowerCase()) ||
                s["genre"]!.toLowerCase().contains(_searchQuery.toLowerCase())
              ).toList();

              return Padding(
                padding: const EdgeInsets.all(12.0),
                child: Column(
                  children: [
                    Row(
                      children: [
                        const Text("Country: ", style: TextStyle(fontWeight: FontWeight.bold)),
                        const SizedBox(width: 8),
                        Expanded(
                          child: DropdownButton<String>(
                            value: _selectedCountry,
                            isExpanded: true,
                            items: _countries.map((c) => DropdownMenuItem(value: c, child: Text(c))).toList(),
                            onChanged: (val) => setState(() => _selectedCountry = val ?? "Ghana"),
                          ),
                        ),
                      ],
                    ),
                    const SizedBox(height: 10),
                    TextField(
                      decoration: const InputDecoration(
                        labelText: "Search FM station or genre...",
                        prefixIcon: Icon(Icons.search),
                        border: OutlineInputBorder(),
                      ),
                      onChanged: (val) => setState(() => _searchQuery = val),
                    ),
                    const SizedBox(height: 10),
                    Expanded(
                      child: ListView.builder(
                        itemCount: filteredStations.length,
                        itemBuilder: (context, index) {
                          final station = filteredStations[index];
                          return Card(
                            child: ListTile(
                              leading: const CircleAvatar(child: Icon(Icons.radio)),
                              title: Text(station["name"]!),
                              subtitle: Text("Genre: ${station["genre"]}"),
                              trailing: IconButton(
                                icon: const Icon(Icons.play_arrow, color: Colors.deepPurple),
                                onPressed: () {
                                  // Trigger playback from main state
                                  context.findAncestorStateOfType<_MainHomeScreenState>()?._playAudio(station["url"]!, station["name"]!);
                                },
                              ),
                            ),
                          );
                        },
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class OnlineMusicTab extends StatefulWidget {
            final Function(String, String) onPlay;
            final Function(String, String) onDownload;

            const OnlineMusicTab({super.key, required this.onPlay, required this.onDownload});

            @override
            State<OnlineMusicTab> createState() => _OnlineMusicTabState();
          }

          class _OnlineMusicTabState extends State<OnlineMusicTab> {
            String _searchQuery = "";

            final List<Map<String, String>> _tracks = [
              {"title": "Acoustic Breeze", "artist": "Bensound", "album": "Relaxation Album", "url": "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"},
              {"title": "Creative Minds", "artist": "AudioLibrary", "album": "Focus Playlist", "url": "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"},
              {"title": "Summer Memories", "artist": "VibeMusic", "album": "Sunshine Sessions", "url": "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"},
            ];

            @override
            Widget build(BuildContext context) {
              final filtered = _tracks.where((t) => 
                t["title"]!.toLowerCase().contains(_searchQuery.toLowerCase()) ||
                t["artist"]!.toLowerCase().contains(_searchQuery.toLowerCase()) ||
                t["album"]!.toLowerCase().contains(_searchQuery.toLowerCase())
              ).toList();

              return Padding(
                padding: const EdgeInsets.all(12.0),
                child: Column(
                  children: [
                    TextField(
                      decoration: const InputDecoration(
                        labelText: "Search songs, artists, or albums...",
                        prefixIcon: Icon(Icons.search),
                        border: OutlineInputBorder(),
                      ),
                      onChanged: (val) => setState(() => _searchQuery = val),
                    ),
                    const SizedBox(height: 10),
                    Expanded(
                      child: ListView.builder(
                        itemCount: filtered.length,
                        itemBuilder: (context, index) {
                          final track = filtered[index];
                          return Card(
                            child: ListTile(
                              leading: const CircleAvatar(child: Icon(Icons.music_note)),
                              title: Text(track["title"]!),
                              subtitle: Text("${track["artist"]} • ${track["album"]}"),
                              trailing: Row(
                                mainAxisSize: MainAxisSize.min,
                                children: [
                                  IconButton(
                                    icon: const Icon(Icons.download, color: Colors.blue),
                                    onPressed: () => widget.onDownload(track["url"]!, "${track["title"]}.mp3"),
                                  ),
                                  IconButton(
                                    icon: const Icon(Icons.play_arrow, color: Colors.deepPurple),
                                    onPressed: () => widget.onPlay(track["url"]!, track["title"]!),
                                  ),
                                ],
                              ),
                            ),
                          );
                        },
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class FavoritesTab extends StatelessWidget {
            const FavoritesTab({super.key});

            @override
            Widget build(BuildContext context) {
              return const Center(
                child: Text("Your bookmarked favorite stations and songs appear here.", style: TextStyle(color: Colors.grey)),
              );
            }
          }

          class LocalFileTab extends StatelessWidget {
            final Function(String, String) onPlay;

            const LocalFileTab({super.key, required this.onPlay});

            @override
            Widget build(BuildContext context) {
              return Center(
                child: ElevatedButton.icon(
                  onPressed: () async {
                    FilePickerResult? result = await FilePicker.platform.pickFiles(type: FileType.audio);
                    if (result != null && result.files.single.path != null) {
                      onPlay(result.files.single.path!, result.files.single.name);
                    }
                  },
                  icon: const Icon(Icons.folder_open),
                  label: const Text("Browse Local Audio Files"),
                ),
              );
            }
          }
          EOF

          # Inject Internet Permission into AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' $MANIFEST
          fi

          # Update minSdk to 24 for audio and storage plugins
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' $BUILD_GRADLE
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' $BUILD_GRADLE
          fi

          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: 'app_project/build/app/outputs/flutter-apk/app-release.apk'
