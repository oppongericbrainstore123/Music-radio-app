name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Create Project, Configure Android & Build APK
        run: |
          # Create a fresh standard Flutter app template
          flutter create my_app --org com.musicradio --platforms=android
          
          # Move user's custom main.dart and pubspec.yaml into the new project
          if [ -f "mobile_app/lib/main.dart" ]; then
            cp mobile_app/lib/main.dart my_app/lib/main.dart
          elif [ -f "mobile_app/mobile_app/lib/main.dart" ]; then
            cp mobile_app/mobile_app/lib/main.dart my_app/lib/main.dart
          fi

          if [ -f "mobile_app/pubspec.yaml" ]; then
            cp mobile_app/pubspec.yaml my_app/pubspec.yaml
          elif [ -f "mobile_app/mobile_app/pubspec.yaml" ]; then
            cp mobile_app/mobile_app/pubspec.yaml my_app/pubspec.yaml
          fi

          cd my_app

          # Update minSdk to 21 to support modern audio and storage plugins
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' $BUILD_GRADLE
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' $BUILD_GRADLE
          fi

          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
