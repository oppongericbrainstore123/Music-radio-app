name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Generate and Build App
        run: |
          flutter create app_project --org com.musicradio --platforms=android
          cd app_project

          # Write pubspec.yaml with all required multimedia dependencies
          cat << 'EOF' > pubspec.yaml
          name: music_radio_app
          description: A multimedia radio, streaming, and local player app.
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            just_audio: ^0.9.36
            http: ^1.2.0
            path_provider: ^2.1.2
            file_picker: ^6.1.1
            permission_handler: ^11.3.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

          # Write lib/main.dart with Error-Free Storage Downloads and Styled UI Matching Reference
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:just_audio/just_audio.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:http/http.dart' as http;
          import 'dart:io';
          import 'dart:convert';
          import 'dart:async';

          void main() {
            runApp(const MusicRadioApp());
          }

          class MusicRadioApp extends StatelessWidget {
            const MusicRadioApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Weezer',
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF121212),
                  primarySwatch: Colors.deepPurple,
                  useMaterial3: true,
                ),
                home: const MainHomeScreen(),
              );
            }
          }

          class MainHomeScreen extends StatefulWidget {
            const MainHomeScreen({super.key});

            @override
            State<MainHomeScreen> createState() => _MainHomeScreenState();
          }

          class _MainHomeScreenState extends State<MainHomeScreen> {
            int _currentIndex = 0;
            final AudioPlayer _audioPlayer = AudioPlayer();
            String _currentTitle = "Spontaneous Worship";
            String _currentArtist = "Yefter Nkansah";
            String _currentArtwork = "";
            bool _isDownloading = false;
            bool _isPlaying = false;
            bool _showFullPlayer = false;
            final List<Map<String, dynamic>> _favorites = [];
            final List<Map<String, dynamic>> _downloadedSongs = [];
            Duration _duration = Duration.zero;
            Duration _position = Duration.zero;

            @override
            void initState() {
              super.initState();
              _audioPlayer.playerStateStream.listen((state) {
                setState(() => _isPlaying = state.playing);
              });
              _audioPlayer.durationStream.listen((d) {
                setState(() => _duration = d ?? Duration.zero);
              });
              _audioPlayer.positionStream.listen((p) {
                setState(() => _position = p);
              });
            }

            @override
            void dispose() {
              _audioPlayer.dispose();
              super.dispose();
            }

            Future<void> _playAudio(String url, String title, String artist, [String artwork = ""]) async {
              try {
                await _audioPlayer.setUrl(url);
                await _audioPlayer.play();
                setState(() {
                  _currentTitle = title;
                  _currentArtist = artist;
                  _currentArtwork = artwork;
                });
              } catch (e) {
                setState(() {
                  _currentTitle = "Error playing track";
                });
              }
            }

            Future<void> _downloadMusicFile(String url, String fileName, String artist, String artwork) async {
              try {
                setState(() => _isDownloading = true);
                // Use safe application support directory to avoid Permission Denied (errno = 13)
                final directory = await getApplicationSupportDirectory();
                final filePath = '${directory.path}/$fileName';
                
                final response = await http.get(Uri.parse(url));
                final file = File(filePath);
                await file.writeAsBytes(response.bodyBytes);

                final downloadedItem = {
                  "title": fileName.replaceAll('.m4a', ''),
                  "artist": artist,
                  "url": filePath,
                  "artwork": artwork,
                  "isLocal": true
                };

                if (!_downloadedSongs.any((d) => d['title'] == downloadedItem['title'])) {
                  _downloadedSongs.add(downloadedItem);
                }

                setState(() => _isDownloading = false);
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(content: Text('Downloaded successfully to Offline Songs!'), backgroundColor: Colors.green),
                  );
                }
              } catch (e) {
                setState(() => _isDownloading = false);
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(content: Text('Download failed: ${e.toString()}'), backgroundColor: Colors.red),
                  );
                }
              }
            }

            @override
            Widget build(BuildContext context) {
              final List<Widget> pages = [
                HomeTab(onPlay: _playAudio, onDownload: _downloadMusicFile, downloadedSongs: _downloadedSongs),
                SearchTab(onPlay: _playAudio, onDownload: _downloadMusicFile),
                FavoritesTab(favorites: _favorites, onPlay: _playAudio),
                LibraryTab(downloadedSongs: _downloadedSongs, onPlay: _playAudio),
              ];

              return Scaffold(
                appBar: AppBar(
                  title: Row(
                    children: [
                      const Icon(Icons.music_note, color: Color(0xFF1ED760)),
                      const SizedBox(width: 8),
                      const Text('Weezer', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 22, color: Colors.white)),
                    ],
                  ),
                  backgroundColor: Colors.transparent,
                  elevation: 0,
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.settings, color: Colors.white),
                      onPressed: () {
                        ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Settings & Preferences')));
                      },
                    ),
                  ],
                ),
                body: Stack(
                  children: [
                    Column(
                      children: [
                        Expanded(child: pages[_currentIndex]),
                        // Sticky Mini Player Bar matching reference
                        GestureDetector(
                          onTap: () => setState(() => _showFullPlayer = true),
                          child: Container(
                            margin: const EdgeInsets.symmetric(horizontal: 8, vertical: 4),
                            padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),
                            decoration: BoxDecoration(
                              color: const Color(0xFF282828),
                              borderRadius: BorderRadius.circular(8),
                            ),
                            child: Row(
                              children: [
                                ClipRRect(
                                  borderRadius: BorderRadius.circular(4),
                                  child: _currentArtwork.isNotEmpty
                                      ? Image.network(_currentArtwork, width: 40, height: 40, fit: BoxFit.cover, errorBuilder: (_,__,___) => const Icon(Icons.music_note))
                                      : Container(width: 40, height: 40, color: Colors.deepPurple, child: const Icon(Icons.music_note)),
                                ),
                                const SizedBox(width: 12),
                                Expanded(
                                  child: Column(
                                    crossAxisAlignment: CrossAxisAlignment.start,
                                    children: [
                                      Text(_currentTitle, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 13, color: Colors.white), overflow: TextOverflow.ellipsis),
                                      Text(_currentArtist, style: TextStyle(fontSize: 11, color: Colors.grey.shade400), overflow: TextOverflow.ellipsis),
                                    ],
                                  ),
                                ),
                                IconButton(
                                  icon: Icon(_isPlaying ? Icons.pause : Icons.play_arrow, color: Colors.white),
                                  onPressed: () {
                                    if (_isPlaying) {
                                      _audioPlayer.pause();
                                    } else {
                                      _audioPlayer.play();
                                    }
                                  },
                                ),
                                IconButton(
                                  icon: const Icon(Icons.skip_next, color: Colors.white),
                                  onPressed: () {},
                                ),
                              ],
                            ),
                          ),
                        ),
                      ],
                    ),
                    // Full Screen Pop-up Player matching reference
                    if (_showFullPlayer)
                      FullPlayerScreen(
                        title: _currentTitle,
                        artist: _currentArtist,
                        artwork: _currentArtwork,
                        isPlaying: _isPlaying,
                        audioPlayer: _audioPlayer,
                        duration: _duration,
                        position: _position,
                        onClose: () => setState(() => _showFullPlayer = false),
                      ),
                  ],
                ),
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: _currentIndex,
                  type: BottomNavigationBarType.fixed,
                  selectedItemColor: const Color(0xFF1ED760),
                  unselectedItemColor: Colors.grey,
                  backgroundColor: const Color(0xFF181818),
                  onTap: (index) => setState(() => _currentIndex = index),
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.home), label: ''),
                    BottomNavigationBarItem(icon: Icon(Icons.search), label: ''),
                    BottomNavigationBarItem(icon: Icon(Icons.favorite), label: ''),
                    BottomNavigationBarItem(icon: Icon(Icons.library_music), label: ''),
                  ],
                ),
              );
            }
          }

          class FullPlayerScreen extends StatelessWidget {
            final String title;
            final String artist;
            final String artwork;
            final bool isPlaying;
            final AudioPlayer audioPlayer;
            final Duration duration;
            final Duration position;
            final VoidCallback onClose;

            const FullPlayerScreen({
              super.key,
              required this.title,
              required this.artist,
              required this.artwork,
              required this.isPlaying,
              required this.audioPlayer,
              required this.duration,
              required this.position,
              required this.onClose,
            });

            String _formatDuration(Duration d) {
              String twoDigits(int n) => n.toString().padLeft(2, '0');
              final minutes = twoDigits(d.inMinutes.remainder(60));
              final seconds = twoDigits(d.inSeconds.remainder(60));
              return "$minutes:$seconds";
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF121212),
                appBar: AppBar(
                  backgroundColor: Colors.transparent,
                  elevation: 0,
                  leading: IconButton(
                    icon: const Icon(Icons.keyboard_arrow_down, size: 32, color: Colors.white),
                    onPressed: onClose,
                  ),
                  title: const Text("Offline songs", style: TextStyle(fontSize: 14, color: Colors.white)),
                  centerTitle: true,
                ),
                body: Padding(
                  padding: const EdgeInsets.all(24.0),
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      ClipRRect(
                        borderRadius: BorderRadius.circular(12),
                        child: artwork.isNotEmpty
                            ? Image.network(artwork, width: 300, height: 300, fit: BoxFit.cover, errorBuilder: (_,__,___) => const Icon(Icons.music_note, size: 100))
                            : Container(width: 300, height: 300, color: Colors.deepPurple, child: const Icon(Icons.music_note, size: 100)),
                      ),
                      const SizedBox(height: 30),
                      Align(
                        alignment: Alignment.centerLeft,
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Text(title, style: const TextStyle(fontSize: 22, fontWeight: FontWeight.bold, color: Colors.white)),
                            const SizedBox(height: 4),
                            Text(artist, style: TextStyle(fontSize: 14, color: Colors.grey.shade400)),
                          ],
                        ),
                      ),
                      const SizedBox(height: 20),
                      Slider(
                        activeColor: Colors.white,
                        inactiveColor: Colors.grey.shade800,
                        min: 0,
                        max: duration.inMilliseconds.toDouble() > 0 ? duration.inMilliseconds.toDouble() : 1.0,
                        value: position.inMilliseconds.toDouble().clamp(0.0, duration.inMilliseconds.toDouble() > 0 ? duration.inMilliseconds.toDouble() : 1.0),
                        onChanged: (val) {
                          audioPlayer.seek(Duration(milliseconds: val.toInt()));
                        },
                      ),
                      Padding(
                        padding: const EdgeInsets.symmetric(horizontal: 16),
                        child: Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            Text(_formatDuration(position), style: TextStyle(color: Colors.grey.shade400, fontSize: 12)),
                            Text(_formatDuration(duration), style: TextStyle(color: Colors.grey.shade400, fontSize: 12)),
                          ],
                        ),
                      ),
                      const SizedBox(height: 20),
                      Row(
                        mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                        children: [
                          IconButton(icon: const Icon(Icons.shuffle, color: Colors.white), onPressed: () {}),
                          IconButton(icon: const Icon(Icons.skip_previous, size: 36, color: Colors.white), onPressed: () {}),
                          CircleAvatar(
                            radius: 32,
                            backgroundColor: Colors.white,
                            child: IconButton(
                              icon: Icon(isPlaying ? Icons.pause : Icons.play_arrow, size: 36, color: Colors.black),
                              onPressed: () {
                                if (isPlaying) {
                                  audioPlayer.pause();
                                } else {
                                  audioPlayer.play();
                                }
                              },
                            ),
                          ),
                          IconButton(icon: const Icon(Icons.skip_next, size: 36, color: Colors.white), onPressed: () {}),
                          IconButton(icon: const Icon(Icons.repeat, color: Colors.white), onPressed: () {}),
                        ],
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class HomeTab extends StatelessWidget {
            final Function(String, String, String, [String]) onPlay;
            final Function(String, String, String, String) onDownload;
            final List<Map<String, dynamic>> downloadedSongs;

            const HomeTab({super.key, required this.onPlay, required this.onDownload, required this.downloadedSongs});

            @override
            Widget build(BuildContext context) {
              return ListView(
                padding: const EdgeInsets.all(12),
                children: [
                  const Text("Recommended radios", style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.white)),
                  const SizedBox(height: 10),
                  _buildRecCard("Heavenly Tongues", "Freda Boateng Junior", "https://stream.zeno.fm/f3wvbbqmdg8uv"),
                  _buildRecCard("Sie Sie Me Medley", "KOFI OWUSU PEPRAH", "https://stream.zeno.fm/0r0xa792m8quv"),
                  _buildRecCard("Fa Me Sie", "Joe Mettle", "https://stream.zeno.fm/bb8779ka5quv"),
                  const SizedBox(height: 20),
                  const Text("Playlist", style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.white)),
                  const SizedBox(height: 10),
                  Row(
                    children: [
                      Expanded(
                        child: Container(
                          padding: const EdgeInsets.all(16),
                          decoration: BoxDecoration(color: Colors.teal.shade800, borderRadius: BorderRadius.circular(8)),
                          child: const Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              Icon(Icons.download, color: Colors.white, size: 32),
                              SizedBox(height: 12),
                              Text("Offline songs", style: TextStyle(fontWeight: FontWeight.bold, color: Colors.white)),
                            ],
                          ),
                        ),
                      ),
                      const SizedBox(width: 12),
                      Expanded(
                        child: Container(
                          padding: const EdgeInsets.all(16),
                          decoration: BoxDecoration(color: Colors.brown.shade700, borderRadius: BorderRadius.circular(8)),
                          child: const Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              Icon(Icons.folder, color: Colors.white, size: 32),
                              SizedBox(height: 12),
                              Text("Local songs", style: TextStyle(fontWeight: FontWeight.bold, color: Colors.white)),
                            ],
                          ),
                        ),
                      ),
                    ],
                  ),
                ],
              );
            }

            Widget _buildRecCard(String title, String artist, String url) {
              return Card(
                color: const Color(0xFF1E1E1E),
                child: ListTile(
                  title: Text(title, style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                  subtitle: Text(artist, style: TextStyle(color: Colors.grey.shade400)),
                  trailing: IconButton(
                    icon: const Icon(Icons.play_arrow, color: Color(0xFF1ED760)),
                    onPressed: () => onPlay(url, title, artist),
                  ),
                ),
              );
            }
          }

          class SearchTab extends StatefulWidget {
            final Function(String, String, String, [String]) onPlay;
            final Function(String, String, String, String) onDownload;

            const SearchTab({super.key, required this.onPlay, required this.onDownload});

            @override
            State<SearchTab> createState() => _SearchTabState();
          }

          class _SearchTabState extends State<SearchTab> {
            List<dynamic> _tracks = [];
            bool _isLoading = false;
            final TextEditingController _controller = TextEditingController(text: "Fameye");

            @override
            void initState() {
              super.initState();
              _search("Fameye");
            }

            Future<void> _search(String query) async {
              setState(() => _isLoading = true);
              try {
                final res = await http.get(Uri.parse('https://itunes.apple.com/search?term=${Uri.encodeComponent(query)}&entity=song&limit=40'));
                if (res.statusCode == 200) {
                  final data = json.decode(res.body);
                  setState(() {
                    _tracks = data['results'] ?? [];
                    _isLoading = false;
                  });
                }
              } catch (e) {
                setState(() => _isLoading = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Padding(
                padding: const EdgeInsets.all(12.0),
                child: Column(
                  children: [
                    TextField(
                      controller: _controller,
                      style: const TextStyle(color: Colors.white),
                      decoration: InputDecoration(
                        hintText: "Search music, artists...",
                        hintStyle: TextStyle(color: Colors.grey.shade500),
                        prefixIcon: const Icon(Icons.search, color: Colors.white),
                        filled: true,
                        fillColor: const Color(0xFF282828),
                        border: OutlineInputBorder(borderRadius: BorderRadius.circular(8), borderSide: BorderSide.none),
                      ),
                      onSubmitted: (val) => _search(val),
                    ),
                    const SizedBox(height: 10),
                    Expanded(
                      child: _isLoading
                          ? const Center(child: CircularProgressIndicator(color: Color(0xFF1ED760)))
                          : ListView.builder(
                              itemCount: _tracks.length,
                              itemBuilder: (context, index) {
                                final track = _tracks[index];
                                final title = track['trackName'] ?? '';
                                final artist = track['artistName'] ?? '';
                                final previewUrl = track['previewUrl'] ?? '';
                                final artwork = track['artworkUrl100'] ?? '';
                                final highRes = artwork.isNotEmpty ? artwork.replaceAll('100x100bb', '600x600bb') : '';

                                return Card(
                                  color: const Color(0xFF1E1E1E),
                                  child: ListTile(
                                    leading: ClipRRect(
                                      borderRadius: BorderRadius.circular(4),
                                      child: artwork.isNotEmpty ? Image.network(artwork, width: 45, height: 45, fit: BoxFit.cover) : const Icon(Icons.music_note),
                                    ),
                                    title: Text(title, style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold), maxLines: 1),
                                    subtitle: Text("$artist", style: TextStyle(color: Colors.grey.shade400), maxLines: 1),
                                    trailing: Row(
                                      mainAxisSize: MainAxisSize.min,
                                      children: [
                                        IconButton(
                                          icon: const Icon(Icons.download, color: Colors.blueAccent),
                                          onPressed: () => widget.onDownload(previewUrl, "$title - $artist.m4a", artist, highRes),
                                        ),
                                        IconButton(
                                          icon: const Icon(Icons.play_circle_fill, color: Color(0xFF1ED760), size: 36),
                                          onPressed: () => widget.onPlay(previewUrl, title, artist, highRes),
                                        ),
                                      ],
                                    ),
                                  ),
                                );
                              },
                            ),
                    ),
                  ],
                ),
              );
            }
          }

          class FavoritesTab extends StatelessWidget {
            final List<Map<String, dynamic>> favorites;
            final Function(String, String, String, [String]) onPlay;

            const FavoritesTab({super.key, required this.favorites, required this.onPlay});

            @override
            Widget build(BuildContext context) {
              if (favorites.isEmpty) {
                return const Center(child: Text("No favorites added yet.", style: TextStyle(color: Colors.grey)));
              }
              return ListView.builder(
                itemCount: favorites.length,
                itemBuilder: (context, index) {
                  final item = favorites[index];
                  return ListTile(
                    title: Text(item['title'], style: const TextStyle(color: Colors.white)),
                    subtitle: Text(item['artist'], style: TextStyle(color: Colors.grey.shade400)),
                    trailing: IconButton(
                      icon: const Icon(Icons.play_arrow, color: Color(0xFF1ED760)),
                      onPressed: () => onPlay(item['url'], item['title'], item['artist'], item['artwork']),
                    ),
                  );
                },
              );
            }
          }

          class LibraryTab extends StatelessWidget {
            final List<Map<String, dynamic>> downloadedSongs;
            final Function(String, String, String, [String]) onPlay;

            const LibraryTab({super.key, required this.downloadedSongs, required this.onPlay});

            @override
            Widget build(BuildContext context) {
              if (downloadedSongs.isEmpty) {
                return const Center(child: Text("No offline downloaded songs yet.", style: TextStyle(color: Colors.grey)));
              }
              return ListView.builder(
                itemCount: downloadedSongs.length,
                itemBuilder: (context, index) {
                  final song = downloadedSongs[index];
                  return Card(
                    color: const Color(0xFF1E1E1E),
                    child: ListTile(
                      leading: Image.network(song['artwork'], width: 45, height: 45, fit: BoxFit.cover, errorBuilder: (_,__,___) => const Icon(Icons.music_note)),
                      title: Text(song['title'], style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                      subtitle: Text(song['artist'], style: TextStyle(color: Colors.grey.shade400)),
                      trailing: IconButton(
                        icon: const Icon(Icons.play_circle_fill, color: Color(0xFF1ED760), size: 36),
                        onPressed: () => onPlay(song['url'], song['title'], song['artist'], song['artwork']),
                      ),
                    ),
                  );
                },
              );
            }
          }
          EOF

          # Inject Internet Permission into AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' $MANIFEST
          fi

          # Update minSdk to 24 for audio plugins
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' $BUILD_GRADLE
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' $BUILD_GRADLE
          fi

          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: 'app_project/build/app/outputs/flutter-apk/app-release.apk'
