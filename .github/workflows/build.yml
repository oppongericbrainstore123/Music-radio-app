          class EqualizerScreen extends StatefulWidget {
            const EqualizerScreen({super.key});

            @override
            State<EqualizerScreen> createState() => _EqualizerScreenState();
          }

          class _EqualizerScreenState extends State<EqualizerScreen> {
            String _preset = 'Custom';

            Future<void> _applyPreset(AndroidEqualizerParameters p, String name) async {
              setState(() => _preset = name);
              final bands = p.bands;
              final double min = p.minDecibels;
              final double max = p.maxDecibels;

              for (var b in bands) {
                double target = 0.0;
                final freq = b.centerFrequency;
                if (name == 'Bass Boost') {
                  if (freq < 300) target = max * 0.8;
                } else if (name == 'Rock') {
                  if (freq < 250 || freq > 4000) target = max * 0.6;
                } else if (name == 'Pop') {
                  if (freq >= 500 && freq <= 3000) target = max * 0.5;
                } else if (name == 'Classical') {
                  if (freq < 500 || freq > 5000) target = max * 0.4;
                } else if (name == 'Vocal') {
                  if (freq >= 1000 && freq <= 4000) target = max * 0.7;
                }
                await b.setGain(target.clamp(min, max));
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Sound Studio')),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    StreamBuilder<bool>(
                      stream: player.equalizer.enabledStream,
                      builder: (context, snap) {
                        final on = snap.data ?? false;
                        return SwitchListTile(
                          title: const Text('Equalizer Active', style: TextStyle(fontWeight: FontWeight.bold)),
                          value: on,
                          onChanged: player.equalizer.setEnabled,
                        );
                      },
                    ),
                    const Divider(),
                    const Text('Presets', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                    const SizedBox(height: 8),
                    FutureBuilder<AndroidEqualizerParameters>(
                      future: player.equalizer.parameters,
                      builder: (context, snap) {
                        final p = snap.data;
                        return Wrap(
                          spacing: 8,
                          children: ['Flat', 'Bass Boost', 'Rock', 'Pop', 'Classical', 'Vocal'].map((name) {
                            return ChoiceChip(
                              label: Text(name),
                              selected: _preset == name,
                              onSelected: (_) {
                                if (p != null) _applyPreset(p, name);
                              },
                            );
                          }).toList(),
                        );
                      },
                    ),
                    const Divider(height: 24),
                    const Text('Frequency Bands', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                    const SizedBox(height: 8),
                    FutureBuilder<AndroidEqualizerParameters>(
                      future: player.equalizer.parameters,
                      builder: (context, snap) {
                        final p = snap.data;
                        if (p == null) {
                          return const Padding(
                            padding: EdgeInsets.all(24),
                            child: Center(child: Text('Start playing a song first to unlock the bands.', textAlign: TextAlign.center)),
                          );
                        }
                        return Column(
                          children: p.bands.map((b) {
                            return Padding(
                              padding: const EdgeInsets.symmetric(vertical: 4),
                              child: Column(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  Text('${b.centerFrequency.round()} Hz', style: const TextStyle(color: Colors.grey)),
                                  StreamBuilder<double>(
                                    stream: b.gainStream,
                                    builder: (context, s) {
                                      final v = (s.data ?? b.gain).clamp(p.minDecibels, p.maxDecibels).toDouble();
                                      return Slider(
                                        min: p.minDecibels,
                                        max: p.maxDecibels,
                                        value: v,
                                        onChanged: (val) {
                                          setState(() => _preset = 'Custom');
                                          b.setGain(val);
                                        },
                                      );
                                    },
                                  ),
                                ],
                              ),
                            );
                          }).toList(),
                        );
                      },
                    ),
                    const Divider(height: 24),
                    const Text('Volume & Loudness Boost', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                    StreamBuilder<double>(
                      stream: player.loudness.targetGainStream,
                      builder: (context, s) {
                        final v = (s.data ?? 0.0).clamp(0.0, 10.0).toDouble();
                        return Slider(
                          min: 0,
                          max: 10,
                          divisions: 10,
                          label: '${v.toStringAsFixed(1)} dB',
                          value: v,
                          onChanged: player.loudness.setTargetGain,
                        );
                      },
                    ),
                  ],
                ),
              );
            }
          }

          // ---------------------------------------------------------------- dj mix studio

          class DjTab extends StatefulWidget {
            const DjTab({super.key});

            @override
            State<DjTab> createState() => _DjTabState();
          }

          class _DjTabState extends State<DjTab> {
            final AudioPlayer deckA = AudioPlayer();
            final AudioPlayer deckB = AudioPlayer();
            double crossfade = 0.5;
            double tempoA = 1.0;
            double tempoB = 1.0;
            Track? trackA;
            Track? trackB;

            @override
            void dispose() {
              deckA.dispose();
              deckB.dispose();
              super.dispose();
            }

            void _updateVolumes() {
              deckA.setVolume(1.0 - crossfade);
              deckB.setVolume(crossfade);
            }

            Future<void> _pickDeck(bool isA) async {
              final list = player.downloads.isNotEmpty ? player.downloads : player.favorites;
              if (list.isEmpty) {
                toast('Add some songs to your library or offline downloads first!');
                return;
              }
              showModalBottomSheet(
                context: context,
                builder: (ctx) => ListView.builder(
                  itemCount: list.length,
                  itemBuilder: (_, i) {
                    final t = list[i];
                    return ListTile(
                      leading: Art(url: t.artwork, size: 40),
                      title: Text(t.title, maxLines: 1),
                      subtitle: Text(t.artist, maxLines: 1),
                      onTap: () async {
                        Navigator.of(ctx).pop();
                        setState(() {
                          if (isA) {
                            trackA = t;
                          } else {
                            trackB = t;
                          }
                        });
                        final playerRef = isA ? deckA : deckB;
                        await playerRef.setUrl(t.isLocal ? t.url : t.url);
                        playerRef.play();
                      },
                    );
                  },
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Padding(
                padding: const EdgeInsets.all(12),
                child: Column(
                  children: [
                    const Text('DJ Mix Studio', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                    const SizedBox(height: 12),
                    Expanded(
                      child: Row(
                        children: [
                          Expanded(child: _buildDeck('DECK A', trackA, deckA, tempoA, (v) {
                            setState(() => tempoA = v);
                            deckA.setSpeed(v);
                          }, () => _pickDeck(true))),
                          const SizedBox(width: 12),
                          Expanded(child: _buildDeck('DECK B', trackB, deckB, tempoB, (v) {
                            setState(() => tempoB = v);
                            deckB.setSpeed(v);
                          }, () => _pickDeck(false))),
                        ],
                      ),
                    ),
                    const SizedBox(height: 12),
                    const Text('Crossfader (A <---> B)', style: TextStyle(fontWeight: FontWeight.bold)),
                    Row(
                      children: [
                        const Text('A'),
                        Expanded(
                          child: Slider(
                            value: crossfade,
                            onChanged: (v) {
                              setState(() => crossfade = v);
                              _updateVolumes();
                            },
                          ),
                        ),
                        const Text('B'),
                      ],
                    ),
                  ],
                ),
              );
            }

            Widget _buildDeck(String name, Track? track, AudioPlayer p, double tempo, ValueChanged<double> onTempo, VoidCallback onSelect) {
              return Card(
                color: const Color(0xFF1E1E1E),
                child: Padding(
                  padding: const EdgeInsets.all(12),
                  child: Column(
                    children: [
                      Text(name, style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.greenAccent)),
                      const SizedBox(height: 8),
                      Art(url: track?.artwork ?? '', size: 80),
                      const SizedBox(height: 8),
                      Text(track?.title ?? 'No track loaded', maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontWeight: FontWeight.bold)),
                      Text(track?.artist ?? 'Tap to select', maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 12, color: Colors.grey)),
                      const Spacer(),
                      OutlinedButton.icon(onPressed: onSelect, icon: const Icon(Icons.music_note, size: 16), label: const Text('Load')),
                      StreamBuilder<PlayerState>(
                        stream: p.playerStateStream,
                        builder: (context, snap) {
                          final playing = snap.data?.playing ?? false;
                          return Row(
                            mainAxisAlignment: MainAxisAlignment.center,
                            children: [
                              IconButton(
                                icon: Icon(playing ? Icons.pause_circle : Icons.play_circle, size: 36),
                                onPressed: track == null ? null : () => playing ? p.pause() : p.play(),
                              ),
                              IconButton(
                                icon: const Icon(Icons.replay, size: 28),
                                onPressed: track == null ? null : () => p.seek(Duration.zero),
                              ),
                            ],
                          );
                        },
                      ),
                      const Text('Tempo / Pitch', style: TextStyle(fontSize: 11, color: Colors.grey)),
                      Slider(
                        min: 0.5,
                        max: 2.0,
                        value: tempo,
                        onChanged: onTempo,
                      ),
                      Row(
                        mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                        children: [
                          ElevatedButton(onPressed: () => p.setSpeed(1.0), child: const Text('1x', style: TextStyle(fontSize: 11))),
                          ElevatedButton(onPressed: () => p.setSpeed(1.25), child: const Text('1.25x', style: TextStyle(fontSize: 11))),
                        ],
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          // ---------------------------------------------------------------- device music

          class LocalTab extends StatefulWidget {
            const LocalTab({super.key});

            @override
            State<LocalTab> createState() => _LocalTabState();
          }

          class _LocalTabState extends State<LocalTab> {
            final OnAudioQuery _query = OnAudioQuery();
            bool _loading = true;
            bool _denied = false;
            List<Track> _songs = [];
            Map<String, List<Track>> _albums = {};
            Map<String, List<Track>> _artists = {};
            Map<String, List<Track>> _folders = {};

            @override
            void initState() {
              super.initState();
              _scan();
            }

            Future<void> _scan() async {
              setState(() {
                _loading = true;
                _denied = false;
              });
              try {
                var ok = await _query.permissionsStatus();
                if (!ok) ok = await _query.permissionsRequest();
                if (!ok) {
                  if (mounted) {
                    setState(() {
                      _denied = true;
                      _loading = false;
                    });
                  }
                  return;
                }
                final found = await _query.querySongs(
                  sortType: SongSortType.TITLE,
                  orderType: OrderType.ASC_OR_SMALLER,
                  uriType: UriType.EXTERNAL,
                  ignoreCase: true,
                );
                final songs = <Track>[];
                final albums = <String, List<Track>>{};
                final artists = <String, List<Track>>{};
                final folders = <String, List<Track>>{};
                for (final s in found) {
                  if ((s.duration ?? 0) < 30000) continue;
                  final artist = s.artist ?? 'Unknown artist';
                  final t = Track(
                    id: 'dev-${s.id}',
                    title: s.title,
                    artist: artist,
                    url: s.uri ?? 'file://${s.data}',
                    canDownload: false,
                  );
                  songs.add(t);
                  albums.putIfAbsent(s.album ?? 'Unknown album', () => []).add(t);
                  artists.putIfAbsent(artist, () => []).add(t);
                  final i = s.data.lastIndexOf('/');
                  folders.putIfAbsent(i > 0 ? s.data.substring(0, i) : '/', () => []).add(t);
                }
                if (mounted) {
                  setState(() {
                    _songs = songs;
                    _albums = albums;
                    _artists = artists;
                    _folders = folders;
                    _loading = false;
                  });
                }
              } catch (e) {
                if (mounted) setState(() => _loading = false);
              }
            }

            Widget _groups(Map<String, List<Track>> m, IconData icon, {bool folder = false}) {
              final keys = m.keys.toList()..sort((a, b) => a.toLowerCase().compareTo(b.toLowerCase()));
              return ListView.builder(
                itemCount: keys.length,
                itemBuilder: (_, i) {
                  final k = keys[i];
                  final tracks = m[k]!;
                  return ListTile(
                    leading: Icon(icon),
                    title: Text(folder ? k.split('/').last : k, maxLines: 1, overflow: TextOverflow.ellipsis),
                    subtitle: Text(folder ? k : '${tracks.length} songs', maxLines: 1, overflow: TextOverflow.ellipsis),
                    onTap: () => Navigator.of(context).push(MaterialPageRoute(
                      builder: (_) => TrackListPage(title: folder ? k.split('/').last : k, loader: () async => tracks),
                    )),
                  );
                },
              );
            }

            @override
            Widget build(BuildContext context) {
              if (_loading) return const Center(child: CircularProgressIndicator());
              if (_denied) {
                return Center(
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      const Text('Allow access to your music files to play them here.', textAlign: TextAlign.center),
                      const SizedBox(height: 12),
                      FilledButton(onPressed: _scan, child: const Text('Allow access')),
                    ],
                  ),
                );
              }
              if (_songs.isEmpty) {
                return Center(
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      const Text('No music files found on this device.'),
                      const SizedBox(height: 12),
                      OutlinedButton(onPressed: _scan, child: const Text('Scan again')),
                    ],
                  ),
                );
              }
              return DefaultTabController(
                length: 4,
                child: Column(
                  children: [
                    Row(
                      children: [
                        const Expanded(child: TabBar(tabs: [Tab(text: 'Music'), Tab(text: 'Album'), Tab(text: 'Artist'), Tab(text: 'Folder')])),
                        IconButton(icon: const Icon(Icons.refresh), tooltip: 'Scan again', onPressed: _scan),
                      ],
                    ),
                    Expanded(
                      child: TabBarView(
                        children: [
                          ListView.builder(
                            itemCount: _songs.length,
                            itemBuilder: (_, i) => TrackTile(track: _songs[i], onTap: () => player.playQueue(_songs, i)),
                          ),
                          _groups(_albums, Icons.album),
                          _groups(_artists, Icons.person),
                          _groups(_folders, Icons.folder, folder: true),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

