          class SpinningDisc extends StatefulWidget {
            final String url;
            final double size;
            final bool spinning;
            const SpinningDisc({super.key, required this.url, required this.size, required this.spinning});

            @override
            State<SpinningDisc> createState() => _SpinningDiscState();
          }

          class _SpinningDiscState extends State<SpinningDisc> with SingleTickerProviderStateMixin {
            late final AnimationController _c = AnimationController(vsync: this, duration: const Duration(seconds: 6));

            @override
            void initState() {
              super.initState();
              if (widget.spinning) _c.repeat();
            }

            @override
            void didUpdateWidget(SpinningDisc old) {
              super.didUpdateWidget(old);
              if (widget.spinning && !_c.isAnimating) {
                _c.repeat();
              } else if (!widget.spinning && _c.isAnimating) {
                _c.stop();
              }
            }

            @override
            void dispose() {
              _c.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final s = widget.size;
              return RotationTransition(
                turns: _c,
                child: Container(
                  width: s,
                  height: s,
                  decoration: BoxDecoration(
                    shape: BoxShape.circle,
                    color: Colors.black,
                    boxShadow: [BoxShadow(color: Colors.deepPurpleAccent.withOpacity(widget.spinning ? 0.45 : 0.2), blurRadius: 18)],
                  ),
                  child: Stack(
                    alignment: Alignment.center,
                    children: [
                      ClipOval(child: Art(url: widget.url, size: s - 8)),
                      Container(
                        width: s * 0.18,
                        height: s * 0.18,
                        decoration: BoxDecoration(
                          shape: BoxShape.circle,
                          color: const Color(0xFF121212),
                          border: Border.all(color: Colors.white24, width: 1.5),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

