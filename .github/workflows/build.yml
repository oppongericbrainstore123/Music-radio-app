                                ],
                              );
                            },
                          ),
                        ],
                      ),
                    ),
                  );
                },
              );
            }

            Widget _seekBar() {
              return StreamBuilder<Duration?>(
                stream: player.audio.durationStream,
                builder: (context, ds) {
                  final dur = ds.data ?? Duration.zero;
                  return StreamBuilder<Duration>(
                    stream: player.audio.positionStream,
                    builder: (context, ps) {
                      final pos = ps.data ?? Duration.zero;
                      if (dur == Duration.zero) {
                        return const Padding(padding: EdgeInsets.symmetric(vertical: 16), child: Text('LIVE / loading...'));
                      }
                      final max = dur.inMilliseconds.toDouble();
                      final val = pos.inMilliseconds.toDouble().clamp(0.0, max).toDouble();
                      return Column(
                        children: [
                          Slider(
                            min: 0,
                            max: max,
                            value: val,
                            onChanged: (v) => player.audio.seek(Duration(milliseconds: v.toInt())),
                          ),
                          Padding(
                            padding: const EdgeInsets.symmetric(horizontal: 16),
                            child: Row(
                              mainAxisAlignment: MainAxisAlignment.spaceBetween,
                              children: [Text(fmt(pos)), Text(fmt(dur))],
                            ),
                          ),
                        ],
                      );
                    },
                  );
                },
              );
            }

            void _showQueue(BuildContext context) {
              showModalBottomSheet<void>(
                context: context,
                builder: (ctx) => ListView.builder(
                  itemCount: player.queue.length,
                  itemBuilder: (_, i) {
                    final t = player.queue[i];
                    return ListTile(
                      leading: Art(url: t.artwork, size: 40),
                      title: Text(t.title, maxLines: 1, overflow: TextOverflow.ellipsis),
                      subtitle: Text(t.artist, maxLines: 1, overflow: TextOverflow.ellipsis),
                      selected: i == player.index,
                      onTap: () {
                        player.audio.seek(Duration.zero, index: i);
                        player.audio.play();
                        Navigator.of(ctx).pop();
                      },
                    );
                  },
                ),
              );
            }
          }

          class RadioTab extends StatefulWidget {
            const RadioTab({super.key});

            @override
            State<RadioTab> createState() => _RadioTabState();
          }

          class _RadioTabState extends State<RadioTab> {
            static const String _host = 'de1.api.radio-browser.info';
            List<dynamic> _countries = [];
            List<dynamic> _stations = [];
            String _country = 'Ghana';
            String _query = '';
            bool _loading = false;

            @override
            void initState() {
              super.initState();
              _loadCountries();
              _loadStations(_country);
            }

            Future<void> _loadCountries() async {
              try {
                final list = await getList(Uri.https(_host, '/json/countries'));
                if (mounted) setState(() => _countries = list.where((c) => (c['name'] ?? '').toString().isNotEmpty).toList());
              } catch (_) {}
            }

            Future<void> _loadStations(String country) async {
              setState(() {
                _loading = true;
                _country = country;
              });
              try {
                final list = await getList(Uri.https(_host, '/json/stations/bycountry/$country', {
                  'hidebroken': 'true',
                  'order': 'clickcount',
                  'reverse': 'true',
                  'limit': '200',
                }));
                if (mounted) setState(() => _stations = list);
              } catch (_) {
                toast('Could not load stations');
              }
              if (mounted) setState(() => _loading = false);
            }

            @override
            Widget build(BuildContext context) {
              final filtered = _stations.where((s) => (s['name'] ?? '').toString().toLowerCase().contains(_query.toLowerCase())).toList();
              return Padding(
                padding: const EdgeInsets.all(12),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    const Text('Global FM Radio', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                    const SizedBox(height: 8),
                    DropdownButton<String>(
                      value: _countries.any((c) => c['name'] == _country) ? _country : null,
                      hint: Text(_country),
                      isExpanded: true,
                      items: _countries.map<DropdownMenuItem<String>>((c) => DropdownMenuItem<String>(value: c['name'].toString(), child: Text(c['name'].toString()))).toList(),
                      onChanged: (v) {
                        if (v != null) _loadStations(v);
                      },
                    ),
                    const SizedBox(height: 8),
                    TextField(
                      decoration: InputDecoration(
                        hintText: 'Search station...',
                        prefixIcon: const Icon(Icons.search),
                        filled: true,
                        border: OutlineInputBorder(borderRadius: BorderRadius.circular(8), borderSide: BorderSide.none),
                      ),
                      onChanged: (v) => setState(() => _query = v),
                    ),
                    const SizedBox(height: 8),
                    Expanded(
                      child: _loading
                          ? const Center(child: CircularProgressIndicator())
                          : ListView.builder(
                              itemCount: filtered.length,
                              itemBuilder: (context, i) {
                                final s = filtered[i];
                                final url = (s['url_resolved'] ?? s['url'] ?? '').toString();
                                if (url.isEmpty) return const SizedBox.shrink();
                                final t = Track(
                                  id: 'radio-${s['stationuuid'] ?? url}',
                                  title: (s['name'] ?? 'Radio').toString().trim(),
                                  artist: _country,
                                  url: url,
                                  artwork: (s['favicon'] ?? '').toString(),
                                  isLive: true,
                                );
                                return TrackTile(track: t, onTap: () => player.playQueue([t], 0));
                              },
                            ),
                    ),
                  ],
                ),
              );
            }
          }

          class SearchItem {
            final String title;
            final String subtitle;
            final String image;
            final bool round;
            final Track? track;
            final Future<List<Track>> Function()? loader;
            final FollowedArtist? follow;

            const SearchItem({required this.title, this.subtitle = '', this.image = '', this.round = false, this.track, this.loader, this.follow});
          }

          class SearchTab extends StatefulWidget {
            const SearchTab({super.key});

            @override
            State<SearchTab> createState() => _SearchTabState();
          }

          class _SearchTabState extends State<SearchTab> {
            final TextEditingController _ctrl = TextEditingController();
            final stt.SpeechToText _speech = stt.SpeechToText();
            bool _listening = false;
            int _source = 0; // 0 Audius, 1 Cloud Music, 2 SoundCloud
            int _mode = 0;
            List<SearchItem> _items = [];
            bool _loading = false;
            String? _error;
            String _heading = 'Trending';

            @override
            void initState() {
              super.initState();
              _run();
            }

            @override
            void dispose() {
              _speech.cancel();
              _ctrl.dispose();
              super.dispose();
            }

            Future<void> _toggleMic() async {
              if (_listening) {
                await _speech.stop();
                if (mounted) setState(() => _listening = false);
                return;
              }
              final ok = await _speech.initialize(
                onStatus: (st) {
                  if ((st == 'done' || st == 'notListening') && mounted) setState(() => _listening = false);
                },
                onError: (_) {
                  if (mounted) setState(() => _listening = false);
                },
              );
              if (!ok) {
                toast('Voice search is not available. Allow microphone access in your phone settings.');
                return;
              }
              setState(() => _listening = true);
              await _speech.listen(
                listenFor: const Duration(seconds: 20),
                pauseFor: const Duration(seconds: 3),
                onResult: (r) {
                  _ctrl.text = r.recognizedWords;
                  _ctrl.selection = TextSelection.collapsed(offset: _ctrl.text.length);
                  if (r.finalResult) {
                    if (mounted) setState(() => _listening = false);
                    _run();
                  }
                },
              );
            }

            Future<void> _run() async {
              final q = _ctrl.text.trim();
              setState(() {
                _loading = true;
                _error = null;
                _heading = q.isEmpty ? 'Trending' : 'Results';
              });
              try {
                List<SearchItem> items;
                if (_source == 1) {
                  items = await _jamendoCloud(q);
                } else if (_source == 2) {
                  await soundcloud.search(q);
                  items = soundcloud.searchResults.map(_songItem).toList();
                } else {
                  items = await _audius(q);
                }
                if (mounted) setState(() => _items = items);
              } catch (e) {
                if (mounted) setState(() => _error = 'Search failed. Check your connection and try again.');
              }
              if (mounted) setState(() => _loading = false);
            }

            SearchItem _songItem(Track t) => SearchItem(title: t.title, subtitle: t.artist, image: t.artwork, track: t);

            Future<List<SearchItem>> _audius(String q) async {
              if (q.isEmpty) {
                final list = await getList(Uri.parse('$kApiBase/tracks/trending').replace(queryParameters: {'app_name': kAppName}));
                return audiusTracks(list).map(_songItem).toList();
              }
              final path = const ['tracks', 'users', 'playlists'][_mode];
              final list = await getList(Uri.parse('$kApiBase/$path/search').replace(queryParameters: {'query': q, 'app_name': kAppName}));
              if (_mode == 0) return audiusTracks(list).map(_songItem).toList();
              if (_mode == 1) {
                return list.whereType<Map>().map<SearchItem>((a) {
                  final id = a['id'].toString();
                  return SearchItem(
                    title: (a['name'] ?? '').toString(),
                    subtitle: '${a['track_count'] ?? 0} tracks',
                    image: imgOf(a['profile_picture']),
                    round: true,
                    follow: FollowedArtist(source: 'audius', id: id, name: (a['name'] ?? '').toString(), image: imgOf(a['profile_picture'])),
                    loader: () async {
                      final r = await getList(Uri.parse('$kApiBase/users/$id/tracks').replace(queryParameters: {'app_name': kAppName, 'limit': '100'}));
                      return audiusTracks(r);
                    },
                  );
                }).toList();
              }
              return list.whereType<Map>().map<SearchItem>((p) {
                final id = p['id'].toString();
                final user = p['user'];
                final owner = user is Map ? (user['name'] ?? '').toString() : '';
                return SearchItem(
                  title: (p['playlist_name'] ?? 'Untitled Playlist').toString(),
                  subtitle: '${p['is_album'] == true ? 'Album' : 'Playlist'} - $owner',
                  image: imgOf(p['artwork']),
                  loader: () async {
                    final r = await getList(Uri.parse('$kApiBase/playlists/$id/tracks').replace(queryParameters: {'app_name': kAppName}));
                    return audiusTracks(r);
                  },
                );
              }).toList();
            }

            Future<List<SearchItem>> _jamendoCloud(String q) async {
              if (q.isEmpty) {
                final list = await getList(jamendoUri('/tracks/', {'order': 'popularity_week', 'limit': '30'}));
                return jamendoTracks(list).map(_songItem).toList();
              }
              if (_mode == 0) {
                final list = await getList(jamendoUri('/tracks/', {'search': q, 'limit': '30'}));
                return jamendoTracks(list).map(_songItem).toList();
              }
              if (_mode == 1) {
                final list = await getList(jamendoUri('/artists/', {'namesearch': q, 'limit': '20'}));
                return list.whereType<Map>().map<SearchItem>((a) {
                  final id = a['id'].toString();
                  final name = (a['name'] ?? '').toString();
                  final image = (a['image'] ?? '').toString();
                  return SearchItem(
                    title: name,
                    subtitle: 'Cloud Artist',
                    image: image,
                    round: true,
                    follow: FollowedArtist(source: 'jamendo', id: id, name: name, image: image),
                    loader: () async {
                      final r = await getList(jamendoUri('/artists/tracks/', {'id': id}));
                      if (r.isEmpty || r.first is! Map) return <Track>[];
                      final tr = ((r.first as Map)['tracks'] as List?) ?? [];
                      return jamendoTracks(tr, artist: name, image: image);
                    },
                  );
                }).toList();
              }
              final list = await getList(jamendoUri('/albums/', {'namesearch': q, 'limit': '20'}));
              return list.whereType<Map>().map<SearchItem>((a) {
                final id = a['id'].toString();
                final artist = (a['artist_name'] ?? '').toString();
                final image = (a['image'] ?? '').toString();
                return SearchItem(
                  title: (a['name'] ?? 'Untitled Album').toString(),
                  subtitle: 'Cloud Album - $artist',
                  image: image,
                  loader: () async {
                    final r = await getList(jamendoUri('/albums/tracks/', {'id': id}));
                    if (r.isEmpty || r.first is! Map) return <Track>[];
                    final tr = ((r.first as Map)['tracks'] as List?) ?? [];
                    return jamendoTracks(tr, artist: artist, image: image);
                  },
                );
              }).toList();
            }

            Widget _results() {
              if (_loading) return const Center(child: CircularProgressIndicator());
              if (_error != null) return Center(child: Text(_error!, textAlign: TextAlign.center));
              if (_items.isEmpty) return const Center(child: Text('Nothing to show yet'));
              final songs = _items.where((i) => i.track != null).map((i) => i.track!).toList();
              return ListView.builder(
                itemCount: _items.length,
                itemBuilder: (_, i) {
                  final item = _items[i];
                  final t = item.track;
                  if (t != null) {
                    return TrackTile(track: t, onTap: () => player.playQueue(songs, songs.indexWhere((s) => s.id == t.id)));
                  }
                  return ListTile(
                    leading: item.round
                        ? CircleAvatar(backgroundImage: item.image.isNotEmpty ? NetworkImage(item.image) : null, child: item.image.isEmpty ? const Icon(Icons.person) : null)
                        : Art(url: item.image, size: 48),
                    title: Text(item.title, maxLines: 1, overflow: TextOverflow.ellipsis),
                    subtitle: Text(item.subtitle, maxLines: 1, overflow: TextOverflow.ellipsis),
                    onTap: () => Navigator.of(context).push(MaterialPageRoute(builder: (_) => TrackListPage(title: item.title, loader: item.loader!, follow: item.follow))),
                  );
                },
              );
            }

            @override
            Widget build(BuildContext context) {
              return Padding(
                padding: const EdgeInsets.all(12),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    TextField(
                      controller: _ctrl,
                      textInputAction: TextInputAction.search,
                      decoration: InputDecoration(
                        hintText: _listening ? 'Listening...' : 'Search songs, artists, albums...',
                        prefixIcon: const Icon(Icons.search),
                        suffixIcon: IconButton(
                          tooltip: 'Voice search',
                          icon: Icon(_listening ? Icons.mic : Icons.mic_none, color: _listening ? Colors.redAccent : null),
                          onPressed: _toggleMic,
                        ),
                        filled: true,
                        border: OutlineInputBorder(borderRadius: BorderRadius.circular(8), borderSide: BorderSide.none),
                      ),
                      onSubmitted: (_) => _run(),
                    ),
                    const SizedBox(height: 8),
                    Wrap(
                      spacing: 8,
                      children: [
                        for (final e in const ['Audius', 'Cloud Music', 'SoundCloud'].asMap().entries)
                          ChoiceChip(
                            label: Text(e.value),
                            selected: _source == e.key,
                            onSelected: (_) {
                              setState(() => _source = e.key);
                              _run();
                            },
                          ),
                      ],
                    ),
                    const SizedBox(height: 8),
                    if (_source != 2) ...[
                      SegmentedButton<int>(
                        segments: const [
                          ButtonSegment<int>(value: 0, label: Text('Songs')),
                          ButtonSegment<int>(value: 1, label: Text('Artists')),
                          ButtonSegment<int>(value: 2, label: Text('Albums')),
                        ],
                        selected: {_mode},
                        onSelectionChanged: (s) {
                          setState(() => _mode = s.first);
                          _run();
                        },
                      ),
                      const SizedBox(height: 8),
                    ],
                    if (_heading.isNotEmpty) Text(_heading, style: const TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                    Expanded(child: _results()),
                  ],
                ),
              );
            }
          }

          class TrackListPage extends StatefulWidget {
