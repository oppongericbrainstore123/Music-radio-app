          // ---------------------------------------------------------------- device music

          class LocalTab extends StatelessWidget {
            const LocalTab({super.key});

            Widget _groups(BuildContext context, Map<String, List<Track>> m, IconData icon, {bool folder = false}) {
              final keys = m.keys.toList()..sort((a, b) => a.toLowerCase().compareTo(b.toLowerCase()));
              return ListView.builder(
                itemCount: keys.length,
                itemBuilder: (_, i) {
                  final k = keys[i];
                  final tracks = m[k]!;
                  return ListTile(
                    leading: Icon(icon),
                    title: Text(folder ? k.split('/').last : k, maxLines: 1, overflow: TextOverflow.ellipsis),
                    subtitle: Text(folder ? k : '${tracks.length} songs', maxLines: 1, overflow: TextOverflow.ellipsis),
                    onTap: () => Navigator.of(context).push(MaterialPageRoute(
                      builder: (_) => TrackListPage(title: folder ? k.split('/').last : k, loader: () async => tracks),
                    )),
                  );
                },
              );
            }

            @override
            Widget build(BuildContext context) {
              return AnimatedBuilder(
                animation: deviceLib,
                builder: (context, _) {
                  if (!deviceLib.loaded && !deviceLib.denied && !deviceLib.loading) {
                    WidgetsBinding.instance.addPostFrameCallback((_) => deviceLib.ensureLoaded());
                  }
                  if (deviceLib.loading && !deviceLib.loaded) return const Center(child: CircularProgressIndicator());
                  if (deviceLib.denied) {
                    return Center(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          const Text('Allow access to your music files to play them here.', textAlign: TextAlign.center),
                          const SizedBox(height: 12),
                          FilledButton(onPressed: deviceLib.scan, child: const Text('Allow access')),
                        ],
                      ),
                    );
                  }
                  if (deviceLib.songs.isEmpty) {
                    return Center(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          const Text('No music files found on this device.'),
                          const SizedBox(height: 12),
                          OutlinedButton(onPressed: deviceLib.scan, child: const Text('Scan again')),
                        ],
                      ),
                    );
                  }
                  return DefaultTabController(
                    length: 4,
                    child: Column(
                      children: [
                        Row(
                          children: [
                            const Expanded(child: TabBar(tabs: [Tab(text: 'Music'), Tab(text: 'Album'), Tab(text: 'Artist'), Tab(text: 'Folder')])),
                            IconButton(icon: const Icon(Icons.refresh), tooltip: 'Scan again', onPressed: deviceLib.scan),
                          ],
                        ),
                        Expanded(
                          child: TabBarView(
                            children: [
                              Column(
                                children: [
                                  Padding(padding: const EdgeInsets.symmetric(horizontal: 12), child: PlayAllBar(title: 'All songs', tracks: deviceLib.songs)),
                                  Expanded(
                                    child: ListView.builder(
                                      itemCount: deviceLib.songs.length,
                                      itemBuilder: (_, i) => TrackTile(track: deviceLib.songs[i], onTap: () => player.playQueue(deviceLib.songs, i)),
                                    ),
                                  ),
                                ],
                              ),
                              _groups(context, deviceLib.albums, Icons.album),
                              _groups(context, deviceLib.artists, Icons.person),
                              _groups(context, deviceLib.folders, Icons.folder, folder: true),
                            ],
                          ),
                        ),
                      ],
                    ),
                  );
                },
              );
            }
          }

          // ---------------------------------------------------------------- discover

          class DiscoverTab extends StatefulWidget {
            const DiscoverTab({super.key});

            @override
            State<DiscoverTab> createState() => _DiscoverTabState();
          }

          class _DiscoverTabState extends State<DiscoverTab> {
            static const List<Map<String, String>> _chips = [
              {'label': 'Trending'},
              {'label': 'Afrobeats', 'query': 'afrobeats'},
              {'label': 'Hip-Hop', 'genre': 'Hip-Hop/Rap'},
              {'label': 'R&B', 'genre': 'R&B/Soul'},
              {'label': 'Pop', 'genre': 'Pop'},
              {'label': 'Electronic', 'genre': 'Electronic'},
              {'label': 'Reggae', 'genre': 'Reggae'},
              {'label': 'Dancehall', 'genre': 'Dancehall'},
              {'label': 'Gospel', 'query': 'gospel'},
              {'label': 'Latin', 'genre': 'Latin'},
              {'label': 'Lo-Fi', 'genre': 'Lo-Fi'},
            ];

            int _chip = 0;
            List<Track> _tracks = [];
            List<Map<String, dynamic>> _playlists = [];
            bool _loading = true;
            String? _error;

            @override
            void initState() {
              super.initState();
              _loadPlaylists();
              _loadTracks();
            }

            Future<void> _refresh() async {
              ApiCache.clearMemory();
              await Future.wait([_loadPlaylists(), _loadTracks()]);
            }

            Future<void> _loadPlaylists() async {
              try {
                final list = await getAudius('/playlists/trending', {'time': 'week'}, ttl: const Duration(minutes: 30));
                if (mounted) {
                  setState(() => _playlists = list.whereType<Map>().map((m) => Map<String, dynamic>.from(m)).take(12).toList());
                }
              } catch (_) {}
            }

            Future<void> _loadTracks() async {
              setState(() {
                _loading = true;
                _error = null;
              });
              try {
                final c = _chips[_chip];
                final List<dynamic> list;
                if (c['query'] != null) {
                  list = await getAudius('/tracks/search', {'query': c['query']!});
                } else {
                  final qp = <String, String>{'time': 'week'};
                  if (c['genre'] != null) qp['genre'] = c['genre']!;
                  list = await getAudius('/tracks/trending', qp);
                }
                if (mounted) setState(() => _tracks = audiusTracks(list));
              } catch (e) {
                if (mounted) setState(() => _error = 'Could not load music. ${errText(e)}');
              }
              if (mounted) setState(() => _loading = false);
            }

            Widget _artistAvatar(FollowedArtist a) {
              return InkWell(
                onTap: () => Navigator.of(context).push(MaterialPageRoute(
                  builder: (_) => TrackListPage(title: a.name, loader: () => loadArtistTracks(a), follow: a),
                )),
                child: Padding(
                  padding: const EdgeInsets.only(right: 12),
                  child: SizedBox(
                    width: 72,
                    child: Column(
                      children: [
                        CircleAvatar(
                          radius: 30,
                          backgroundImage: a.image.startsWith('http') ? CachedNetworkImageProvider(a.image) : null,
                          child: a.image.startsWith('http') ? null : const Icon(Icons.person),
                        ),
                        const SizedBox(height: 6),
                        Text(a.name, maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 12)),
                      ],
                    ),
                  ),
                ),
              );
            }

            Widget _playlistCard(Map<String, dynamic> p) {
              final name = (p['playlist_name'] ?? 'Playlist').toString();
              final id = p['id'].toString();
              return InkWell(
                borderRadius: BorderRadius.circular(12),
                onTap: () => Navigator.of(context).push(MaterialPageRoute(
                  builder: (_) => TrackListPage(
                    title: name,
                    loader: () async => audiusTracks(await getAudius('/playlists/$id/tracks', {})),
                  ),
                )),
                child: Padding(
                  padding: const EdgeInsets.only(right: 12),
                  child: SizedBox(
                    width: 110,
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Art(url: imgOf(p['artwork']), size: 110),
                        const SizedBox(height: 6),
                        Text(name, maxLines: 2, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 12)),
                      ],
                    ),
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              const h = TextStyle(fontSize: 16, fontWeight: FontWeight.bold);
              return AnimatedBuilder(
                animation: follows,
                builder: (context, _) {
                  return RefreshIndicator(
                    onRefresh: _refresh,
                    child: ListView(
                      physics: const AlwaysScrollableScrollPhysics(),
                      padding: const EdgeInsets.all(12),
                      children: [
                        if (follows.artists.isNotEmpty) ...[
                          const Text('Following', style: h),
                          const SizedBox(height: 8),
                          SizedBox(
                            height: 96,
                            child: ListView(scrollDirection: Axis.horizontal, children: follows.artists.map(_artistAvatar).toList()),
                          ),
                          const SizedBox(height: 12),
                        ],
                        if (_playlists.isNotEmpty) ...[
                          const Text('Trending playlists', style: h),
                          const SizedBox(height: 8),
                          SizedBox(
                            height: 150,
                            child: ListView(scrollDirection: Axis.horizontal, children: _playlists.map(_playlistCard).toList()),
                          ),
                          const SizedBox(height: 12),
                        ],
                        Wrap(
                          spacing: 8,
                          children: [
                            for (var i = 0; i < _chips.length; i++)
                              ChoiceChip(
                                label: Text(_chips[i]['label']!),
                                selected: _chip == i,
                                onSelected: (_) {
                                  setState(() => _chip = i);
                                  _loadTracks();
                                },
                              ),
                          ],
                        ),
                        const SizedBox(height: 8),
                        PlayAllBar(title: _chips[_chip]['label']!, tracks: _loading ? const <Track>[] : _tracks),
                        if (_loading)
                          const Center(child: Padding(padding: EdgeInsets.all(24), child: CircularProgressIndicator()))
                        else if (_error != null)
                          SizedBox(height: 220, child: RetryMessage(message: _error!, onRetry: _loadTracks))
                        else
                          ..._tracks.asMap().entries.map((e) => TrackTile(track: e.value, onTap: () => player.playQueue(_tracks, e.key))),
                      ],
                    ),
                  );
                },
              );
            }
          }
