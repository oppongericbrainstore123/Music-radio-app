              '        <service android:name="com.ryanheise.audioservice.AudioService"'
              ' android:foregroundServiceType="mediaPlayback" android:exported="true">\n'
              '            <intent-filter><action android:name="android.media.browse.MediaBrowserService"/></intent-filter>\n'
              '        </service>\n'
              '        <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver" android:exported="true">\n'
              '            <intent-filter><action android:name="android.intent.action.MEDIA_BUTTON"/></intent-filter>\n'
              '        </receiver>\n    ')
          s = s.replace('</application>', services + '</application>', 1)
          open(p, 'w').write(s)

          # MainActivity must extend AudioServiceActivity for background playback
          for f in glob.glob('android/app/src/main/kotlin/**/MainActivity.kt', recursive=True):
              k = open(f).read()
              k = k.replace('import io.flutter.embedding.android.FlutterActivity',
                            'import com.ryanheise.audioservice.AudioServiceActivity')
              k = k.replace('FlutterActivity()', 'AudioServiceActivity()')
