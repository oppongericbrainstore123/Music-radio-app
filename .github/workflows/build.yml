          class DjTab extends StatefulWidget {
            const DjTab({super.key});

            @override
            State<DjTab> createState() => _DjTabState();
          }

          class _DjTabState extends State<DjTab> {
            double _cross = 0.5;
            bool _smooth = true;
            double _master = 1.0;
            int _mixSeconds = 8;
            bool _autoRunning = false;
            Timer? _auto;

            @override
            void initState() {
              super.initState();
              _applyMix();
            }

            @override
            void dispose() {
              _auto?.cancel();
              super.dispose();
            }

            void _applyMix() {
              final double ga = _smooth ? math.cos(_cross * math.pi / 2) : 1.0 - _cross;
              final double gb = _smooth ? math.sin(_cross * math.pi / 2) : _cross;
              deckA.master = _master;
              deckB.master = _master;
              deckA.setGain(ga);
              deckB.setGain(gb);
            }

            void _pick(Deck d) {
              showModalBottomSheet<void>(
                context: context,
                isScrollControlled: true,
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(20))),
                builder: (ctx) => Padding(
                  padding: EdgeInsets.only(bottom: MediaQuery.of(ctx).viewInsets.bottom),
                  child: SizedBox(
                    height: MediaQuery.of(ctx).size.height * 0.8,
                    child: DeckPicker(onPick: (t) {
                      Navigator.of(ctx).pop();
                      player.pauseAll();
                      d.load(t);
                    }),
                  ),
                ),
              );
            }

            void _autoMix(bool toB) {
              _auto?.cancel();
              final to = toB ? deckB : deckA;
              final from = toB ? deckA : deckB;
              if (to.track == null) {
                toast('Load a track on deck ${to.name} first');
                return;
              }
              if (!to.playing) to.togglePlay();
              final start = _cross;
              final target = toB ? 1.0 : 0.0;
              final total = _mixSeconds * 1000;
              final sw = Stopwatch()..start();
              setState(() => _autoRunning = true);
              _auto = Timer.periodic(const Duration(milliseconds: 100), (t) {
                final f = (sw.elapsedMilliseconds / total).clamp(0.0, 1.0).toDouble();
                if (!mounted) {
                  t.cancel();
                  return;
                }
                setState(() {
                  _cross = start + (target - start) * f;
                  _applyMix();
                  if (f >= 1.0) {
                    t.cancel();
                    _autoRunning = false;
                    from.pause();
                  }
                });
              });
            }

            void _stopAuto() {
              _auto?.cancel();
              setState(() => _autoRunning = false);
            }

            @override
            Widget build(BuildContext context) {
              return ListView(
                padding: const EdgeInsets.all(12),
                children: [
                  const PlayAllBar(title: 'DJ Mix Studio', tracks: []),
                  const SizedBox(height: 4),
                  Row(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Expanded(child: DeckCard(deck: deckA, onLoad: () => _pick(deckA))),
                      const SizedBox(width: 10),
                      Expanded(child: DeckCard(deck: deckB, onLoad: () => _pick(deckB))),
                    ],
                  ),
                  const SizedBox(height: 8),
                  Card(
                    color: const Color(0xFF1E1E1E),
