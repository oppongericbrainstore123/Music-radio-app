name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Create Project and Build APK
        run: |
          # Create clean project
          flutter create app_project --org com.musicradio --platforms=android

          # Explicitly copy your custom code from mobile_app folder
          if [ -f "mobile_app/lib/main.dart" ]; then
            cp mobile_app/lib/main.dart app_project/lib/main.dart
            echo "Successfully copied mobile_app/lib/main.dart"
          else
            echo "ERROR: mobile_app/lib/main.dart not found!"
            exit 1
          fi

          if [ -f "mobile_app/pubspec.yaml" ]; then
            cp mobile_app/pubspec.yaml app_project/pubspec.yaml
            echo "Successfully copied mobile_app/pubspec.yaml"
          else
            echo "ERROR: mobile_app/pubspec.yaml not found!"
            exit 1
          fi

          cd app_project

          # Inject Internet Permission into AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' $MANIFEST
          fi

          # Update minSdk to 24 for file_picker and path_provider
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' $BUILD_GRADLE
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' $BUILD_GRADLE
          fi

          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: 'app_project/build/app/outputs/flutter-apk/app-release.apk'
