name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Generate and Build App
        run: |
          flutter create app_project --org com.musicradio --platforms=android
          cd app_project

          cat << 'EOF' > pubspec.yaml
          name: music_radio_app
          description: Music streaming, offline player and global FM radio.
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            just_audio: ^0.9.36
            just_audio_background: ^0.0.1-beta.11
            http: ^1.2.0
            path_provider: ^2.1.2
            shared_preferences: ^2.2.2

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
          EOF

          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';

          import 'package:flutter/material.dart';
          import 'package:http/http.dart' as http;
          import 'package:just_audio/just_audio.dart';
          import 'package:just_audio_background/just_audio_background.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          const String kAppName = 'MusicRadioHub';
          const String kApiBase = 'https://api.audius.co/v1';

          final GlobalKey<ScaffoldMessengerState> messengerKey = GlobalKey<ScaffoldMessengerState>();
          final PlayerController player = PlayerController();

          void toast(String message) {
            messengerKey.currentState
              ?..hideCurrentSnackBar()
              ..showSnackBar(SnackBar(content: Text(message)));
          }

          String imgOf(dynamic m) {
            if (m is Map) {
              return (m['480x480'] ?? m['1000x1000'] ?? m['150x150'] ?? '').toString();
            }
            return '';
          }

          String fmt(Duration d) {
            String two(int n) => n.toString().padLeft(2, '0');
            final h = d.inHours;
            final m = two(d.inMinutes.remainder(60));
            final s = two(d.inSeconds.remainder(60));
            return h > 0 ? '$h:$m:$s' : '$m:$s';
          }

          Future<List<dynamic>> getList(Uri uri) async {
            final res = await http.get(uri, headers: {'User-Agent': 'MusicRadioHub/1.0'}).timeout(const Duration(seconds: 25));
            if (res.statusCode != 200) {
              throw 'Server error ${res.statusCode}';
            }
            final body = json.decode(res.body);
            if (body is List) return body;
            final d = body['data'];
            return d is List ? d : <dynamic>[];
          }

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await JustAudioBackground.init(
              androidNotificationChannelId: 'com.musicradio.channel.audio',
              androidNotificationChannelName: 'Audio playback',
              androidNotificationOngoing: true,
            );
            await player.init();
            runApp(const MusicRadioApp());
          }

          // ---------------------------------------------------------------- models

          class Track {
            final String id;
            final String title;
            final String artist;
            final String url;
            final String artwork;
            final bool isLocal;
            final bool isLive;

            const Track({
              required this.id,
              required this.title,
              required this.artist,
              required this.url,
              this.artwork = '',
              this.isLocal = false,
              this.isLive = false,
            });

            Map<String, dynamic> toJson() => {
                  'id': id,
                  'title': title,
                  'artist': artist,
                  'url': url,
                  'artwork': artwork,
                  'isLocal': isLocal,
                  'isLive': isLive,
                };

            factory Track.fromJson(Map<String, dynamic> j) => Track(
                  id: (j['id'] ?? '').toString(),
                  title: (j['title'] ?? '').toString(),
                  artist: (j['artist'] ?? '').toString(),
                  url: (j['url'] ?? '').toString(),
                  artwork: (j['artwork'] ?? '').toString(),
                  isLocal: j['isLocal'] == true,
                  isLive: j['isLive'] == true,
                );

            factory Track.fromAudius(Map<String, dynamic> j) {
              final id = j['id'].toString();
              final user = j['user'];
              return Track(
                id: id,
                title: (j['title'] ?? 'Untitled').toString(),
                artist: user is Map ? (user['name'] ?? '').toString() : '',
                url: '$kApiBase/tracks/$id/stream?app_name=$kAppName',
                artwork: imgOf(j['artwork']),
              );
            }
          }

          // ---------------------------------------------------------------- controller

          class PlayerController extends ChangeNotifier {
            final AudioPlayer audio = AudioPlayer();
            List<Track> queue = [];
            int index = 0;
            List<Track> favorites = [];
            List<Track> downloads = [];
            double speed = 1.0;
            bool shuffle = false;
            LoopMode loop = LoopMode.off;
            DateTime? sleepEnd;
            Timer? _sleepTimer;
            SharedPreferences? _prefs;

            Track? get current => (queue.isNotEmpty && index >= 0 && index < queue.length) ? queue[index] : null;
            bool isFavorite(Track t) => favorites.any((f) => f.id == t.id);
            bool isDownloaded(Track t) => downloads.any((d) => d.id == t.id);

            Future<void> init() async {
              _prefs = await SharedPreferences.getInstance();
              favorites = _load('favorites');
              downloads = _load('downloads').where((t) => File(t.url).existsSync()).toList();
              audio.currentIndexStream.listen((i) {
                if (i != null && i != index) {
                  index = i;
                  notifyListeners();
                }
              });
              audio.playerStateStream.listen((_) => notifyListeners());
            }

            List<Track> _load(String key) {
              final raw = _prefs?.getString(key);
              if (raw == null) return [];
              try {
                return (json.decode(raw) as List).map((e) => Track.fromJson(Map<String, dynamic>.from(e as Map))).toList();
              } catch (_) {
                return [];
              }
            }

            Future<void> _save(String key, List<Track> list) async {
              await _prefs?.setString(key, json.encode(list.map((t) => t.toJson()).toList()));
            }

            Future<void> playQueue(List<Track> tracks, int start) async {
              if (tracks.isEmpty) return;
              final resolved = tracks.map((t) {
                final local = downloads.where((d) => d.id == t.id);
                return local.isNotEmpty ? local.first : t;
              }).toList();
              queue = resolved;
              index = start;
              notifyListeners();
              try {
                final sources = <AudioSource>[];
                for (var i = 0; i < resolved.length; i++) {
                  final t = resolved[i];
                  sources.add(AudioSource.uri(
                    t.isLocal ? Uri.file(t.url) : Uri.parse(t.url),
                    tag: MediaItem(
                      id: '$i-${t.id}',
                      title: t.title,
                      artist: t.artist,
                      artUri: t.artwork.isNotEmpty ? Uri.parse(t.artwork) : null,
                    ),
                  ));
                }
                await audio.setAudioSource(ConcatenatingAudioSource(children: sources), initialIndex: start);
                await audio.setSpeed(speed);
                audio.play();
              } catch (e) {
                toast('Could not play this item');
              }
            }

            Future<void> toggleFavorite(Track t) async {
              if (isFavorite(t)) {
                favorites.removeWhere((f) => f.id == t.id);
              } else {
                favorites.add(t);
              }
              notifyListeners();
              await _save('favorites', favorites);
            }

            Future<void> download(Track t) async {
              if (t.isLive || isDownloaded(t)) return;
              toast('Downloading "${t.title}"...');
              try {
                final base = await getExternalStorageDirectory() ?? await getApplicationDocumentsDirectory();
                final dir = Directory('${base.path}/Music');
                if (!await dir.exists()) await dir.create(recursive: true);
                final safe = t.title.replaceAll(RegExp(r'[^A-Za-z0-9 _-]'), '_');
                final file = File('${dir.path}/${t.id.hashCode.abs()}_$safe.mp3');
                final res = await http.get(Uri.parse(t.url)).timeout(const Duration(minutes: 5));
                if (res.statusCode != 200) throw 'HTTP ${res.statusCode}';
                await file.writeAsBytes(res.bodyBytes);
                downloads.add(Track(
                  id: t.id,
                  title: t.title,
                  artist: t.artist,
                  url: file.path,
                  artwork: t.artwork,
                  isLocal: true,
                ));
                notifyListeners();
                await _save('downloads', downloads);
                toast('Saved for offline listening');
              } catch (e) {
                toast('Download failed');
              }
            }

            Future<void> removeDownload(Track t) async {
              try {
                final f = File(t.url);
                if (await f.exists()) await f.delete();
              } catch (_) {}
              downloads.removeWhere((d) => d.id == t.id);
              notifyListeners();
              await _save('downloads', downloads);
            }

            Future<void> toggleShuffle() async {
              shuffle = !shuffle;
              if (shuffle) await audio.shuffle();
              await audio.setShuffleModeEnabled(shuffle);
              notifyListeners();
            }

            Future<void> cycleLoop() async {
              loop = loop == LoopMode.off ? LoopMode.all : (loop == LoopMode.all ? LoopMode.one : LoopMode.off);
              await audio.setLoopMode(loop);
              notifyListeners();
            }

            Future<void> setSpeed(double s) async {
              speed = s;
              await audio.setSpeed(s);
              notifyListeners();
            }

            void setSleepTimer(int minutes) {
              _sleepTimer?.cancel();
              sleepEnd = null;
              if (minutes > 0) {
                sleepEnd = DateTime.now().add(Duration(minutes: minutes));
                _sleepTimer = Timer(Duration(minutes: minutes), () {
                  audio.pause();
                  sleepEnd = null;
                  notifyListeners();
                });
                toast('Sleep timer: $minutes min');
              } else {
                toast('Sleep timer off');
              }
              notifyListeners();
            }
          }

          // ---------------------------------------------------------------- app shell

          class MusicRadioApp extends StatelessWidget {
            const MusicRadioApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                scaffoldMessengerKey: messengerKey,
                title: 'Music & Radio Hub',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF121212),
                  colorSchemeSeed: Colors.deepPurple,
                  useMaterial3: true,
                ),
                home: const HomeScreen(),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});

            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            int _tab = 0;

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Row(
                    children: [
                      Icon(Icons.music_note, color: Colors.greenAccent),
                      SizedBox(width: 8),
                      Text('Music & Radio Hub', style: TextStyle(fontWeight: FontWeight.bold)),
                    ],
                  ),
                ),
                body: Column(
                  children: [
                    Expanded(
                      child: IndexedStack(
                        index: _tab,
                        children: const [RadioTab(), SearchTab(), LibraryTab()],
                      ),
                    ),
                    const MiniPlayer(),
                  ],
                ),
                bottomNavigationBar: NavigationBar(
                  selectedIndex: _tab,
                  onDestinationSelected: (i) => setState(() => _tab = i),
                  destinations: const [
                    NavigationDestination(icon: Icon(Icons.radio), label: 'Radio'),
                    NavigationDestination(icon: Icon(Icons.search), label: 'Music'),
                    NavigationDestination(icon: Icon(Icons.library_music), label: 'Library'),
                  ],
                ),
              );
            }
          }

          // ---------------------------------------------------------------- shared widgets

          class Art extends StatelessWidget {
            final String url;
            final double size;
            const Art({super.key, required this.url, this.size = 48});

            @override
            Widget build(BuildContext context) {
              Widget placeholder() => Container(
                    width: size,
                    height: size,
                    color: Colors.deepPurple.shade700,
                    child: Icon(Icons.music_note, size: size * 0.5, color: Colors.white70),
                  );
              return ClipRRect(
                borderRadius: BorderRadius.circular(8),
                child: url.isEmpty
                    ? placeholder()
                    : Image.network(url, width: size, height: size, fit: BoxFit.cover, errorBuilder: (_, __, ___) => placeholder()),
              );
            }
          }

          class PlayPauseButton extends StatelessWidget {
            final double size;
            const PlayPauseButton({super.key, this.size = 36});

            @override
            Widget build(BuildContext context) {
              return StreamBuilder<PlayerState>(
                stream: player.audio.playerStateStream,
                builder: (context, snap) {
                  final st = snap.data;
                  final loading = st?.processingState == ProcessingState.loading || st?.processingState == ProcessingState.buffering;
                  final playing = st?.playing ?? false;
                  if (loading) {
                    return SizedBox(
                      width: size + 16,
                      height: size + 16,
                      child: const Padding(padding: EdgeInsets.all(12), child: CircularProgressIndicator(strokeWidth: 3)),
                    );
                  }
                  return IconButton(
                    iconSize: size,
                    icon: Icon(playing ? Icons.pause_circle_filled : Icons.play_circle_filled),
                    onPressed: () {
                      if (playing) {
                        player.audio.pause();
                      } else {
                        player.audio.play();
                      }
                    },
                  );
                },
              );
            }
          }

          class TrackTile extends StatelessWidget {
            final Track track;
            final VoidCallback onTap;
            final bool downloadsMode;
            const TrackTile({super.key, required this.track, required this.onTap, this.downloadsMode = false});

            @override
            Widget build(BuildContext context) {
              return AnimatedBuilder(
                animation: player,
                builder: (context, _) {
                  final fav = player.isFavorite(track);
                  final dl = player.isDownloaded(track);
                  return ListTile(
                    leading: Art(url: track.artwork, size: 48),
                    title: Text(track.title, maxLines: 1, overflow: TextOverflow.ellipsis),
                    subtitle: Text(track.artist, maxLines: 1, overflow: TextOverflow.ellipsis),
                    onTap: onTap,
                    trailing: Row(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        IconButton(
                          icon: Icon(fav ? Icons.favorite : Icons.favorite_border, color: fav ? Colors.redAccent : null),
                          onPressed: () => player.toggleFavorite(track),
                        ),
                        if (downloadsMode)
                          IconButton(icon: const Icon(Icons.delete_outline), onPressed: () => player.removeDownload(track))
                        else if (!track.isLive)
                          IconButton(
                            icon: Icon(dl ? Icons.download_done : Icons.download, color: dl ? Colors.greenAccent : null),
                            onPressed: dl ? null : () => player.download(track),
                          ),
                      ],
                    ),
                  );
                },
              );
            }
          }

          class MiniPlayer extends StatelessWidget {
            const MiniPlayer({super.key});

            @override
            Widget build(BuildContext context) {
              return AnimatedBuilder(
                animation: player,
                builder: (context, _) {
                  final t = player.current;
                  if (t == null) return const SizedBox.shrink();
                  return Material(
                    color: const Color(0xFF282828),
                    child: InkWell(
                      onTap: () => Navigator.of(context).push(MaterialPageRoute(builder: (_) => const PlayerScreen())),
                      child: Padding(
                        padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
                        child: Row(
                          children: [
                            Art(url: t.artwork, size: 44),
                            const SizedBox(width: 12),
                            Expanded(
                              child: Column(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  Text(t.title, maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontWeight: FontWeight.bold)),
                                  Text(t.artist, maxLines: 1, overflow: TextOverflow.ellipsis, style: TextStyle(fontSize: 12, color: Colors.grey.shade400)),
                                ],
                              ),
                            ),
                            IconButton(icon: const Icon(Icons.skip_previous), onPressed: () => player.audio.seekToPrevious()),
                            const PlayPauseButton(size: 32),
                            IconButton(icon: const Icon(Icons.skip_next), onPressed: () => player.audio.seekToNext()),
                          ],
                        ),
                      ),
                    ),
                  );
                },
              );
            }
          }

          // ---------------------------------------------------------------- full player

          class PlayerScreen extends StatelessWidget {
            const PlayerScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return AnimatedBuilder(
                animation: player,
                builder: (context, _) {
                  final t = player.current;
                  if (t == null) {
                    return Scaffold(appBar: AppBar(), body: const Center(child: Text('Nothing playing')));
                  }
                  final fav = player.isFavorite(t);
                  final dl = player.isDownloaded(t);
                  return Scaffold(
                    appBar: AppBar(
                      leading: IconButton(icon: const Icon(Icons.keyboard_arrow_down, size: 32), onPressed: () => Navigator.of(context).pop()),
                      title: const Text('Now Playing', style: TextStyle(fontSize: 14)),
                      centerTitle: true,
                      actions: [
                        IconButton(icon: const Icon(Icons.queue_music), onPressed: () => _showQueue(context)),
                      ],
                    ),
                    body: SingleChildScrollView(
                      padding: const EdgeInsets.symmetric(horizontal: 24, vertical: 8),
                      child: Column(
                        children: [
                          Art(url: t.artwork, size: 260),
                          const SizedBox(height: 20),
                          Align(
                            alignment: Alignment.centerLeft,
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                Text(t.title, maxLines: 2, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 20, fontWeight: FontWeight.bold)),
                                const SizedBox(height: 4),
                                Text(t.artist, style: TextStyle(fontSize: 14, color: Colors.grey.shade400)),
                              ],
                            ),
                          ),
                          const SizedBox(height: 8),
                          _seekBar(),
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                            children: [
                              IconButton(
                                icon: Icon(Icons.shuffle, color: player.shuffle ? Colors.greenAccent : null),
                                onPressed: player.toggleShuffle,
                              ),
                              IconButton(iconSize: 36, icon: const Icon(Icons.skip_previous), onPressed: () => player.audio.seekToPrevious()),
                              const PlayPauseButton(size: 64),
                              IconButton(iconSize: 36, icon: const Icon(Icons.skip_next), onPressed: () => player.audio.seekToNext()),
                              IconButton(
                                icon: Icon(player.loop == LoopMode.one ? Icons.repeat_one : Icons.repeat, color: player.loop != LoopMode.off ? Colors.greenAccent : null),
                                onPressed: player.cycleLoop,
                              ),
                            ],
                          ),
                          const SizedBox(height: 8),
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                            children: [
                              IconButton(
                                icon: Icon(fav ? Icons.favorite : Icons.favorite_border, color: fav ? Colors.redAccent : null),
                                onPressed: () => player.toggleFavorite(t),
                              ),
                              if (!t.isLive)
                                IconButton(
                                  icon: Icon(dl ? Icons.download_done : Icons.download, color: dl ? Colors.greenAccent : null),
                                  onPressed: dl ? null : () => player.download(t),
                                ),
                              PopupMenuButton<double>(
                                icon: Icon(Icons.speed, color: player.speed != 1.0 ? Colors.greenAccent : null),
                                tooltip: 'Playback speed',
                                onSelected: player.setSpeed,
                                itemBuilder: (_) => [0.5, 0.75, 1.0, 1.25, 1.5, 2.0].map((s) => PopupMenuItem<double>(value: s, child: Text('${s}x'))).toList(),
                              ),
                              PopupMenuButton<int>(
                                icon: Icon(Icons.bedtime, color: player.sleepEnd != null ? Colors.greenAccent : null),
                                tooltip: 'Sleep timer',
                                onSelected: player.setSleepTimer,
                                itemBuilder: (_) => const [
                                  PopupMenuItem<int>(value: 0, child: Text('Off')),
                                  PopupMenuItem<int>(value: 15, child: Text('15 minutes')),
                                  PopupMenuItem<int>(value: 30, child: Text('30 minutes')),
                                  PopupMenuItem<int>(value: 60, child: Text('1 hour')),
                                ],
                              ),
                            ],
                          ),
                          StreamBuilder<double>(
                            stream: player.audio.volumeStream,
                            builder: (context, snap) {
                              final v = (snap.data ?? 1.0).clamp(0.0, 1.0).toDouble();
                              return Row(
                                children: [
                                  const Icon(Icons.volume_down, size: 20),
                                  Expanded(child: Slider(min: 0, max: 1, value: v, onChanged: player.audio.setVolume)),
                                  const Icon(Icons.volume_up, size: 20),
                                ],
                              );
                            },
                          ),
                        ],
                      ),
                    ),
                  );
                },
              );
            }

            Widget _seekBar() {
              return StreamBuilder<Duration?>(
                stream: player.audio.durationStream,
                builder: (context, ds) {
                  final dur = ds.data ?? Duration.zero;
                  return StreamBuilder<Duration>(
                    stream: player.audio.positionStream,
                    builder: (context, ps) {
                      final pos = ps.data ?? Duration.zero;
                      if (dur == Duration.zero) {
                        return const Padding(padding: EdgeInsets.symmetric(vertical: 16), child: Text('LIVE / loading...'));
                      }
                      final max = dur.inMilliseconds.toDouble();
                      final val = pos.inMilliseconds.toDouble().clamp(0.0, max).toDouble();
                      return Column(
                        children: [
                          Slider(
                            min: 0,
                            max: max,
                            value: val,
                            onChanged: (v) => player.audio.seek(Duration(milliseconds: v.toInt())),
                          ),
                          Padding(
                            padding: const EdgeInsets.symmetric(horizontal: 16),
                            child: Row(
                              mainAxisAlignment: MainAxisAlignment.spaceBetween,
                              children: [Text(fmt(pos)), Text(fmt(dur))],
                            ),
                          ),
                        ],
                      );
                    },
                  );
                },
              );
            }

            void _showQueue(BuildContext context) {
              showModalBottomSheet<void>(
                context: context,
                builder: (ctx) => ListView.builder(
                  itemCount: player.queue.length,
                  itemBuilder: (_, i) {
                    final t = player.queue[i];
                    return ListTile(
                      leading: Art(url: t.artwork, size: 40),
                      title: Text(t.title, maxLines: 1, overflow: TextOverflow.ellipsis),
                      subtitle: Text(t.artist, maxLines: 1, overflow: TextOverflow.ellipsis),
                      selected: i == player.index,
                      onTap: () {
                        player.audio.seek(Duration.zero, index: i);
                        player.audio.play();
                        Navigator.of(ctx).pop();
                      },
                    );
                  },
                ),
              );
            }
          }

          // ---------------------------------------------------------------- radio

          class RadioTab extends StatefulWidget {
            const RadioTab({super.key});

            @override
            State<RadioTab> createState() => _RadioTabState();
          }

          class _RadioTabState extends State<RadioTab> {
            static const String _host = 'de1.api.radio-browser.info';
            List<dynamic> _countries = [];
            List<dynamic> _stations = [];
            String _country = 'Ghana';
            String _query = '';
            bool _loading = false;

            @override
            void initState() {
              super.initState();
              _loadCountries();
              _loadStations(_country);
            }

            Future<void> _loadCountries() async {
              try {
                final list = await getList(Uri.https(_host, '/json/countries'));
                if (mounted) setState(() => _countries = list.where((c) => (c['name'] ?? '').toString().isNotEmpty).toList());
              } catch (_) {}
            }

            Future<void> _loadStations(String country) async {
              setState(() {
                _loading = true;
                _country = country;
              });
              try {
                final list = await getList(Uri.https(_host, '/json/stations/bycountry/$country', {
                  'hidebroken': 'true',
                  'order': 'clickcount',
                  'reverse': 'true',
                  'limit': '200',
                }));
                if (mounted) setState(() => _stations = list);
              } catch (_) {
                toast('Could not load stations');
              }
              if (mounted) setState(() => _loading = false);
            }

            @override
            Widget build(BuildContext context) {
              final filtered = _stations.where((s) => (s['name'] ?? '').toString().toLowerCase().contains(_query.toLowerCase())).toList();
              return Padding(
                padding: const EdgeInsets.all(12),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    const Text('Global FM Radio', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                    const SizedBox(height: 8),
                    DropdownButton<String>(
                      value: _countries.any((c) => c['name'] == _country) ? _country : null,
                      hint: Text(_country),
                      isExpanded: true,
                      items: _countries.map<DropdownMenuItem<String>>((c) => DropdownMenuItem<String>(value: c['name'].toString(), child: Text(c['name'].toString()))).toList(),
                      onChanged: (v) {
                        if (v != null) _loadStations(v);
                      },
                    ),
                    const SizedBox(height: 8),
                    TextField(
                      decoration: InputDecoration(
                        hintText: 'Search station...',
                        prefixIcon: const Icon(Icons.search),
                        filled: true,
                        border: OutlineInputBorder(borderRadius: BorderRadius.circular(8), borderSide: BorderSide.none),
                      ),
                      onChanged: (v) => setState(() => _query = v),
                    ),
                    const SizedBox(height: 8),
                    Expanded(
                      child: _loading
                          ? const Center(child: CircularProgressIndicator())
                          : ListView.builder(
                              itemCount: filtered.length,
                              itemBuilder: (context, i) {
                                final s = filtered[i];
                                final url = (s['url_resolved'] ?? s['url'] ?? '').toString();
                                if (url.isEmpty) return const SizedBox.shrink();
                                final t = Track(
                                  id: 'radio-${s['stationuuid'] ?? url}',
                                  title: (s['name'] ?? 'Radio').toString().trim(),
                                  artist: _country,
                                  url: url,
                                  artwork: (s['favicon'] ?? '').toString(),
                                  isLive: true,
                                );
                                return TrackTile(track: t, onTap: () => player.playQueue([t], 0));
                              },
                            ),
                    ),
                  ],
                ),
              );
            }
          }

          // ---------------------------------------------------------------- music search

          class SearchTab extends StatefulWidget {
            const SearchTab({super.key});

            @override
            State<SearchTab> createState() => _SearchTabState();
          }

          class _SearchTabState extends State<SearchTab> {
            final TextEditingController _ctrl = TextEditingController();
            int _mode = 0; // 0 songs, 1 artists, 2 albums
            List<dynamic> _results = [];
            bool _loading = false;
            String? _error;
            String _heading = 'Trending';

            @override
            void initState() {
              super.initState();
              _run();
            }

            @override
            void dispose() {
              _ctrl.dispose();
              super.dispose();
            }

            Future<void> _run() async {
              final q = _ctrl.text.trim();
              setState(() {
                _loading = true;
                _error = null;
              });
              try {
                Uri uri;
                if (q.isEmpty) {
                  _heading = 'Trending';
                  uri = Uri.parse('$kApiBase/tracks/trending').replace(queryParameters: {'app_name': kAppName});
                  _mode = 0;
                } else {
                  _heading = 'Results';
                  final path = const ['tracks', 'users', 'playlists'][_mode];
                  uri = Uri.parse('$kApiBase/$path/search').replace(queryParameters: {'query': q, 'app_name': kAppName});
                }
                final list = await getList(uri);
                if (mounted) setState(() => _results = list);
              } catch (e) {
                if (mounted) setState(() => _error = 'Search failed. Check your connection and try again.');
              }
              if (mounted) setState(() => _loading = false);
            }

            Widget _body() {
              if (_loading) return const Center(child: CircularProgressIndicator());
              if (_error != null) return Center(child: Text(_error!));
              if (_results.isEmpty) return const Center(child: Text('Nothing found'));

              if (_mode == 0) {
                final tracks = _results.where((j) => j['is_streamable'] != false).map((j) => Track.fromAudius(Map<String, dynamic>.from(j as Map))).toList();
                return ListView.builder(
                  itemCount: tracks.length,
                  itemBuilder: (_, i) => TrackTile(track: tracks[i], onTap: () => player.playQueue(tracks, i)),
                );
              }
              if (_mode == 1) {
                return ListView.builder(
                  itemCount: _results.length,
                  itemBuilder: (_, i) {
                    final a = _results[i] as Map;
                    final id = a['id'].toString();
                    final name = (a['name'] ?? '').toString();
                    final pic = imgOf(a['profile_picture']);
                    return ListTile(
                      leading: CircleAvatar(backgroundImage: pic.isNotEmpty ? NetworkImage(pic) : null, child: pic.isEmpty ? const Icon(Icons.person) : null),
                      title: Text(name),
                      subtitle: Text('${a['track_count'] ?? 0} tracks'),
                      onTap: () => Navigator.of(context).push(MaterialPageRoute(
                        builder: (_) => TrackListPage(title: name, uri: Uri.parse('$kApiBase/users/$id/tracks').replace(queryParameters: {'app_name': kAppName, 'limit': '100'})),
                      )),
                    );
                  },
                );
              }
              return ListView.builder(
                itemCount: _results.length,
                itemBuilder: (_, i) {
                  final p = _results[i] as Map;
                  final id = p['id'].toString();
                  final name = (p['playlist_name'] ?? 'Untitled').toString();
                  final user = p['user'];
                  final owner = user is Map ? (user['name'] ?? '').toString() : '';
                  return ListTile(
                    leading: Art(url: imgOf(p['artwork']), size: 48),
                    title: Text(name, maxLines: 1, overflow: TextOverflow.ellipsis),
                    subtitle: Text('${p['is_album'] == true ? 'Album' : 'Playlist'} - $owner'),
                    onTap: () => Navigator.of(context).push(MaterialPageRoute(
                      builder: (_) => TrackListPage(title: name, uri: Uri.parse('$kApiBase/playlists/$id/tracks').replace(queryParameters: {'app_name': kAppName})),
                    )),
                  );
                },
              );
            }

            @override
            Widget build(BuildContext context) {
              return Padding(
                padding: const EdgeInsets.all(12),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    TextField(
                      controller: _ctrl,
                      textInputAction: TextInputAction.search,
                      decoration: InputDecoration(
                        hintText: 'Search songs, artists, albums...',
                        prefixIcon: const Icon(Icons.search),
                        filled: true,
                        border: OutlineInputBorder(borderRadius: BorderRadius.circular(8), borderSide: BorderSide.none),
                      ),
                      onSubmitted: (_) => _run(),
                    ),
                    const SizedBox(height: 8),
                    SegmentedButton<int>(
                      segments: const [
                        ButtonSegment<int>(value: 0, label: Text('Songs')),
                        ButtonSegment<int>(value: 1, label: Text('Artists')),
                        ButtonSegment<int>(value: 2, label: Text('Albums')),
                      ],
                      selected: {_mode},
                      onSelectionChanged: (s) {
                        setState(() => _mode = s.first);
                        _run();
                      },
                    ),
                    const SizedBox(height: 8),
                    Text(_heading, style: const TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                    Expanded(child: _body()),
                  ],
                ),
              );
            }
          }

          class TrackListPage extends StatefulWidget {
            final String title;
            final Uri uri;
            const TrackListPage({super.key, required this.title, required this.uri});

            @override
            State<TrackListPage> createState() => _TrackListPageState();
          }

          class _TrackListPageState extends State<TrackListPage> {
            List<Track> _tracks = [];
            bool _loading = true;
            String? _error;

            @override
            void initState() {
              super.initState();
              _load();
            }

            Future<void> _load() async {
              try {
                final list = await getList(widget.uri);
                final tracks = list.where((j) => j['is_streamable'] != false).map((j) => Track.fromAudius(Map<String, dynamic>.from(j as Map))).toList();
                if (mounted) setState(() => _tracks = tracks);
              } catch (_) {
                if (mounted) setState(() => _error = 'Could not load tracks');
              }
              if (mounted) setState(() => _loading = false);
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text(widget.title)),
                floatingActionButton: _tracks.isEmpty
                    ? null
                    : FloatingActionButton.extended(
                        onPressed: () => player.playQueue(_tracks, 0),
                        icon: const Icon(Icons.play_arrow),
                        label: const Text('Play all'),
                      ),
                body: _loading
                    ? const Center(child: CircularProgressIndicator())
                    : _error != null
                        ? Center(child: Text(_error!))
                        : _tracks.isEmpty
                            ? const Center(child: Text('No tracks'))
                            : ListView.builder(
                                padding: const EdgeInsets.only(bottom: 80),
                                itemCount: _tracks.length,
                                itemBuilder: (_, i) => TrackTile(track: _tracks[i], onTap: () => player.playQueue(_tracks, i)),
                              ),
              );
            }
          }

          // ---------------------------------------------------------------- library

          class LibraryTab extends StatelessWidget {
            const LibraryTab({super.key});

            @override
            Widget build(BuildContext context) {
              return DefaultTabController(
                length: 2,
                child: Column(
                  children: [
                    const TabBar(tabs: [Tab(text: 'Favorites'), Tab(text: 'Offline')]),
                    Expanded(
                      child: AnimatedBuilder(
                        animation: player,
                        builder: (context, _) {
                          return TabBarView(
                            children: [
                              _list(player.favorites, 'No favorites yet.\nTap the heart on any song or station.', false),
                              _list(player.downloads, 'No offline tracks yet.\nTap the download icon on a song.', true),
                            ],
                          );
                        },
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget _list(List<Track> items, String empty, bool downloadsMode) {
              if (items.isEmpty) {
                return Center(child: Text(empty, textAlign: TextAlign.center, style: const TextStyle(color: Colors.grey)));
              }
              return ListView.builder(
                itemCount: items.length,
                itemBuilder: (_, i) => TrackTile(
                  track: items[i],
                  downloadsMode: downloadsMode,
                  onTap: () => player.playQueue(items, i),
                ),
              );
            }
          }
