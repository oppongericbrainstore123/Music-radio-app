          # AndroidManifest: permissions, cleartext radio streams, background audio service
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = ''.join('    <uses-permission android:name="android.permission.%s"/>\n' % n for n in [
              'INTERNET', 'WAKE_LOCK', 'FOREGROUND_SERVICE', 'FOREGROUND_SERVICE_MEDIA_PLAYBACK'])
