          class Art extends StatelessWidget {
            final String url;
            final double size;
            final String fallback;
            final bool shadow;
            const Art({super.key, required this.url, this.size = 48, this.fallback = '', this.shadow = false});

            Widget _placeholder() => Container(
                  width: size,
                  height: size,
                  decoration: BoxDecoration(
                    gradient: LinearGradient(
                      begin: Alignment.topLeft,
                      end: Alignment.bottomRight,
                      colors: [Colors.deepPurple.shade700, Colors.deepPurple.shade900],
                    ),
                  ),
                  child: Icon(Icons.music_note, size: size * 0.5, color: Colors.white70),
                );

            Widget _img(String u, Widget Function() onError) => CachedNetworkImage(
                  imageUrl: u,
                  width: size,
                  height: size,
                  fit: BoxFit.cover,
                  memCacheWidth: math.min(size * 3, 900).round(),
                  fadeInDuration: const Duration(milliseconds: 200),
                  placeholder: (_, __) => _placeholder(),
                  errorWidget: (_, __, ___) => onError(),
                );

            @override
            Widget build(BuildContext context) {
              final bool valid = url.startsWith('http');
              final Widget core = !valid
                  ? _placeholder()
                  : _img(url, () => (fallback.startsWith('http') && fallback != url) ? _img(fallback, _placeholder) : _placeholder());
              final radius = BorderRadius.circular(size > 120 ? 16 : 8);
              return Container(
                width: size,
                height: size,
                decoration: BoxDecoration(
                  borderRadius: radius,
                  boxShadow: shadow ? [BoxShadow(color: Colors.deepPurpleAccent.withOpacity(0.35), blurRadius: 28, offset: const Offset(0, 10))] : null,
                ),
                child: ClipRRect(borderRadius: radius, child: core),
              );
            }
