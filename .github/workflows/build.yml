name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Generate and Build App
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: |
          flutter create app_project --org com.musicradio --platforms=android
          cd app_project

          cat << 'EOF' > pubspec.yaml
          name: music_radio_app
          description: Music streaming, offline player, DJ studio and global FM radio.
          publish_to: 'none'
          version: 1.1.0+2

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            just_audio: ^0.9.36
            just_audio_background: ^0.0.1-beta.11
            audioplayers: 6.0.0
            cached_network_image: ^3.3.1
            http: ^1.2.0
            path_provider: ^2.1.2
            shared_preferences: ^2.2.2
            flutter_appauth: ^6.0.2
            on_audio_query: ^2.9.0
            speech_to_text: ^6.6.0

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
          EOF

          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'dart:math' as math;

          import 'package:audioplayers/audioplayers.dart' as ap;
          import 'package:cached_network_image/cached_network_image.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter_appauth/flutter_appauth.dart';
          import 'package:http/http.dart' as http;
          import 'package:just_audio/just_audio.dart';
          import 'package:just_audio_background/just_audio_background.dart';
          import 'package:on_audio_query/on_audio_query.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:speech_to_text/speech_to_text.dart' as stt;

          const String kAppName = 'MusicRadioHub';
          const List<String> kAudiusHosts = [
            'api.audius.co',
            'discoveryprovider.audius.co',
            'discoveryprovider2.audius.co',
          ];
          const String _kJamendoEnv = String.fromEnvironment('JAMENDO_CLIENT_ID');
          String get kJamendoId => _kJamendoEnv.isNotEmpty ? _kJamendoEnv : '5c8a0024';
          const String kSpotifyId = String.fromEnvironment('SPOTIFY_CLIENT_ID');
          const String kSpotifyRedirect = 'com.musicradio.app://callback';

          final GlobalKey<ScaffoldMessengerState> messengerKey = GlobalKey<ScaffoldMessengerState>();
          final AppSettings settings = AppSettings();
          final PlayerController player = PlayerController();
          final SpotifyService spotify = SpotifyService();
          final FollowService follows = FollowService();
          final DeviceLibrary deviceLib = DeviceLibrary();

          bool djStarted = false;
          final Deck deckA = Deck('A');
          final Deck deckB = Deck('B');

          void toast(String message) {
            messengerKey.currentState
              ?..hideCurrentSnackBar()
              ..showSnackBar(SnackBar(content: Text(message), behavior: SnackBarBehavior.floating));
          }

          String fmt(Duration d) {
            String two(int n) => n.toString().padLeft(2, '0');
            final h = d.inHours;
            final m = two(d.inMinutes.remainder(60));
            final s = two(d.inSeconds.remainder(60));
            return h > 0 ? '$h:$m:$s' : '$m:$s';
          }

          String cleanArtist(String? a) {
            final s = (a ?? '').trim();
            if (s.isEmpty || s == '<unknown>' || s.toLowerCase() == 'unknown') return 'Unknown artist';
            return s;
          }

          String errText(Object e) {
            if (e is TimeoutException) return 'The connection timed out.';
            if (e is SocketException) return 'No internet connection.';
            final s = e.toString();
            return s.length > 90 ? '${s.substring(0, 90)}...' : s;
          }

          // ---------------------------------------------------------------- settings

          class AppSettings extends ChangeNotifier {
            bool dataSaver = false;
            SharedPreferences? _prefs;

            Future<void> init() async {
              _prefs = await SharedPreferences.getInstance();
              dataSaver = _prefs?.getBool('data_saver') ?? false;
            }

            Future<void> setDataSaver(bool v) async {
              dataSaver = v;
              notifyListeners();
              await _prefs?.setBool('data_saver', v);
            }
          }

          // ---------------------------------------------------------------- network layer

          final http.Client _client = http.Client();
          const Map<String, String> _headers = {
            'User-Agent': 'MusicRadioHub/1.0',
            'Accept': 'application/json',
            'Accept-Encoding': 'gzip',
          };

          class _Hit {
            final DateTime at;
            final String body;
            _Hit(this.at, this.body);
          }

          class ApiCache {
            static final Map<String, _Hit> _mem = {};
            static Directory? _dir;

            static String key(Uri u) {
              var h = 0x811c9dc5;
              for (final c in '${u.path}?${u.query}'.codeUnits) {
                h ^= c;
                h = (h * 0x01000193) & 0xFFFFFFFF;
              }
              return h.toRadixString(16);
            }

            static Future<Directory?> _d() async {
              if (_dir != null) return _dir;
              try {
                final t = await getTemporaryDirectory();
                final d = Directory('${t.path}/api_cache');
                if (!await d.exists()) await d.create(recursive: true);
                _dir = d;
              } catch (_) {}
              return _dir;
            }

            static String? fresh(String k, Duration ttl) {
              final h = _mem[k];
              if (h != null && DateTime.now().difference(h.at) < ttl) return h.body;
              return null;
            }

            static Future<void> put(String k, String body) async {
              _mem[k] = _Hit(DateTime.now(), body);
              try {
                final d = await _d();
                if (d != null) await File('${d.path}/$k.json').writeAsString(body);
              } catch (_) {}
            }

            static Future<String?> stale(String k) async {
              final h = _mem[k];
              if (h != null) return h.body;
              try {
                final d = await _d();
                if (d == null) return null;
                final f = File('${d.path}/$k.json');
                if (await f.exists()) return await f.readAsString();
              } catch (_) {}
              return null;
            }

            static void clearMemory() => _mem.clear();
          }

          Future<dynamic> fetchJson(List<Uri> uris, {Duration ttl = const Duration(minutes: 10)}) async {
            final k = ApiCache.key(uris.first);
            final cached = ApiCache.fresh(k, ttl);
            if (cached != null) return json.decode(cached);
            Object? lastErr;
            for (final uri in uris) {
              final tries = identical(uri, uris.first) ? 2 : 1;
              for (var attempt = 0; attempt < tries; attempt++) {
                try {
                  final res = await _client.get(uri, headers: _headers).timeout(const Duration(seconds: 15));
                  if (res.statusCode == 200) {
                    final body = utf8.decode(res.bodyBytes, allowMalformed: true);
                    final decoded = json.decode(body);
                    ApiCache.put(k, body);
                    return decoded;
                  }
                  lastErr = 'Server error ${res.statusCode}';
                  if (res.statusCode < 500 && res.statusCode != 429) break;
                } catch (e) {
                  lastErr = e;
                }
                await Future.delayed(const Duration(milliseconds: 400));
              }
            }
            final old = await ApiCache.stale(k);
            if (old != null) return json.decode(old);
            throw lastErr ?? 'Network error';
          }

          List<dynamic> _asList(dynamic body) {
            if (body is List) return body;
            if (body is Map) {
              final h = body['headers'];
              if (h is Map && h['status'] == 'failed') throw 'API error';
              final d = body['data'] ?? body['results'];
              if (d is List) return d;
            }
            return <dynamic>[];
          }

          Future<List<dynamic>> getList(Uri uri, {Duration ttl = const Duration(minutes: 10)}) async => _asList(await fetchJson([uri], ttl: ttl));

          Future<List<dynamic>> getAudius(String path, Map<String, String> q, {Duration ttl = const Duration(minutes: 10)}) async {
            final params = <String, String>{...q, 'app_name': kAppName};
            final uris = [for (final h in kAudiusHosts) Uri.https(h, '/v1$path', params)];
            return _asList(await fetchJson(uris, ttl: ttl));
          }

          String imgOf(dynamic m) {
            if (m is Map) {
              return (m['150x150'] ?? m['480x480'] ?? m['1000x1000'] ?? '').toString();
            }
            return '';
          }

          String spImg(dynamic images) {
            if (images is List && images.isNotEmpty) {
              final m = images[images.length > 1 ? 1 : 0];
              if (m is Map) return (m['url'] ?? '').toString();
            }
            return '';
          }

          Uri jamendoUri(String path, Map<String, String> q) => Uri.https('api.jamendo.com', '/v3.0$path', {
                'client_id': kJamendoId,
                'format': 'json',
                'audioformat': settings.dataSaver ? 'mp31' : 'mp32',
                'imagesize': '100',
                ...q,
              });

          // ---------------------------------------------------------------- models

          class Track {
            final String id;
            final String title;
            final String artist;
            final String url;
            final String artwork;
            final String path;
            final bool isLocal;
            final bool isLive;
            final bool isSpotify;
            final bool canDownload;

            const Track({
              required this.id,
              required this.title,
              required this.artist,
              required this.url,
              this.artwork = '',
              this.path = '',
              this.isLocal = false,
              this.isLive = false,
              this.isSpotify = false,
              this.canDownload = true,
            });

            String get bigArtwork => artwork.contains('150x150') ? artwork.replaceFirst('150x150', '480x480') : artwork;

            ap.Source get deckSource {
              if (path.isNotEmpty) return ap.DeviceFileSource(path);
              if (isLocal) return ap.DeviceFileSource(url);
              return ap.UrlSource(url);
            }

            Map<String, dynamic> toJson() => {
                  'id': id,
                  'title': title,
                  'artist': artist,
                  'url': url,
                  'artwork': artwork,
                  'path': path,
                  'isLocal': isLocal,
                  'isLive': isLive,
                  'isSpotify': isSpotify,
                  'canDownload': canDownload,
                };

            factory Track.fromJson(Map<String, dynamic> j) => Track(
                  id: (j['id'] ?? '').toString(),
                  title: (j['title'] ?? '').toString(),
                  artist: (j['artist'] ?? '').toString(),
                  url: (j['url'] ?? '').toString(),
                  artwork: (j['artwork'] ?? '').toString(),
                  path: (j['path'] ?? '').toString(),
                  isLocal: j['isLocal'] == true,
                  isLive: j['isLive'] == true,
                  isSpotify: j['isSpotify'] == true,
                  canDownload: j['canDownload'] != false,
                );

            factory Track.fromAudius(Map<String, dynamic> j) {
              final id = j['id'].toString();
              final user = j['user'];
              return Track(
                id: id,
                title: (j['title'] ?? 'Untitled').toString(),
                artist: user is Map ? (user['name'] ?? '').toString() : '',
                url: 'https://${kAudiusHosts.first}/v1/tracks/$id/stream?app_name=$kAppName',
                artwork: imgOf(j['artwork']),
              );
            }

            factory Track.fromJamendo(Map<String, dynamic> j, {String artist = '', String image = ''}) {
              return Track(
                id: 'jm-${j['id']}',
                title: (j['name'] ?? 'Untitled').toString(),
                artist: (j['artist_name'] ?? artist).toString(),
                url: (j['audio'] ?? '').toString(),
                artwork: (j['image'] ?? j['album_image'] ?? image).toString(),
                canDownload: j['audiodownload_allowed'] != false,
              );
            }

            factory Track.fromSpotify(Map<String, dynamic> j, {String image = ''}) {
              final artists = j['artists'];
              final album = j['album'];
              return Track(
                id: 'sp-${j['id']}',
                title: (j['name'] ?? 'Untitled').toString(),
                artist: (artists is List && artists.isNotEmpty && artists.first is Map) ? (artists.first['name'] ?? '').toString() : '',
                url: (j['uri'] ?? '').toString(),
                artwork: album is Map ? spImg(album['images']) : image,
                isSpotify: true,
                canDownload: false,
              );
            }
          }

          List<Track> audiusTracks(List<dynamic> list) => list
              .where((j) => j is Map && j['is_streamable'] != false)
              .map((j) => Track.fromAudius(Map<String, dynamic>.from(j as Map)))
              .toList();

          List<Track> jamendoTracks(List<dynamic> list, {String artist = '', String image = ''}) => list
              .whereType<Map>()
              .map((j) => Track.fromJamendo(Map<String, dynamic>.from(j), artist: artist, image: image))
              .where((t) => t.url.isNotEmpty)
              .toList();

          // ---------------------------------------------------------------- spotify

          class SpotifyService extends ChangeNotifier {
            static const String clientId = kSpotifyId;
            static const String redirect = 'com.musicradio.app://callback';
            static const List<String> scopes = [
              'user-modify-playback-state',
              'user-read-playback-state',
              'user-read-currently-playing',
            ];

            final FlutterAppAuth _auth = FlutterAppAuth();
            final AuthorizationServiceConfiguration _config = AuthorizationServiceConfiguration(
              authorizationEndpoint: 'https://accounts.spotify.com/authorize',
              tokenEndpoint: 'https://accounts.spotify.com/api/token',
            );

            SharedPreferences? _prefs;
            String? _access;
            String? _refresh;
            DateTime? _expiry;

            bool get configured => clientId.isNotEmpty;
            bool get loggedIn => _refresh != null;

            Future<void> init() async {
              _prefs = await SharedPreferences.getInstance();
              _refresh = _prefs?.getString('sp_refresh');
            }

            Future<void> login() async {
              if (!configured) {
                toast('Spotify Client ID is not configured');
                return;
              }
              try {
                final r = await _auth.authorizeAndExchangeCode(
                  AuthorizationTokenRequest(clientId, redirect, serviceConfiguration: _config, scopes: scopes),
                );
                if (r == null || r.refreshToken == null) {
                  toast('Spotify login was cancelled');
                  return;
                }
                _access = r.accessToken;
                _expiry = r.accessTokenExpirationDateTime;
                _refresh = r.refreshToken;
                await _prefs?.setString('sp_refresh', _refresh!);
                notifyListeners();
                toast('Logged in to Spotify');
              } catch (e) {
                toast('Spotify login failed');
              }
            }

            Future<void> logout() async {
              _access = null;
              _refresh = null;
              _expiry = null;
              await _prefs?.remove('sp_refresh');
              notifyListeners();
            }

            Future<String?> token() async {
              if (_refresh == null) return null;
              if (_access != null && _expiry != null && DateTime.now().isBefore(_expiry!.subtract(const Duration(minutes: 1)))) {
                return _access;
              }
              try {
                final r = await _auth.token(TokenRequest(clientId, redirect, refreshToken: _refresh, serviceConfiguration: _config, scopes: scopes));
                if (r == null || r.accessToken == null) return null;
                _access = r.accessToken;
                _expiry = r.accessTokenExpirationDateTime;
                if (r.refreshToken != null) {
                  _refresh = r.refreshToken;
                  await _prefs?.setString('sp_refresh', _refresh!);
                }
                return _access;
              } catch (_) {
                return null;
              }
            }

            Future<http.Response?> _send(String method, String path, {Map<String, String>? query, Object? body}) async {
              final tok = await token();
              if (tok == null) return null;
              final uri = Uri.https('api.spotify.com', '/v1$path', query);
              final headers = {'Authorization': 'Bearer $tok', 'Content-Type': 'application/json'};
              final enc = body == null ? null : json.encode(body);
              const timeout = Duration(seconds: 20);
              switch (method) {
                case 'PUT':
                  return _client.put(uri, headers: headers, body: enc).timeout(timeout);
                case 'POST':
                  return _client.post(uri, headers: headers, body: enc).timeout(timeout);
                default:
                  return _client.get(uri, headers: headers).timeout(timeout);
              }
            }

            Future<Map<String, dynamic>> getJson(String path, [Map<String, String>? query]) async {
              final res = await _send('GET', path, query: query);
              if (res == null) throw 'Not logged in';
              if (res.statusCode != 200) throw 'Spotify error ${res.statusCode}';
              return Map<String, dynamic>.from(json.decode(utf8.decode(res.bodyBytes)) as Map);
            }

            Future<String?> play(List<String> uris) async {
              http.Response? res = await _send('PUT', '/me/player/play', body: {'uris': uris});
              if (res == null) return 'Log in to Spotify first';
              if (res.statusCode == 404) {
                final dev = await _send('GET', '/me/player/devices');
                if (dev != null && dev.statusCode == 200) {
                  final list = (json.decode(dev.body)['devices'] as List?) ?? [];
                  if (list.isNotEmpty) {
                    res = await _send('PUT', '/me/player/play', query: {'device_id': list.first['id'].toString()}, body: {'uris': uris});
                  }
                }
              }
              if (res == null) return 'Spotify request failed';
              final code = res.statusCode;
              if (code == 200 || code == 202 || code == 204) return null;
              if (code == 403) return 'Spotify Premium is required for playback';
              if (code == 404) return 'Open the Spotify app on this phone once, then try again';
              if (code == 429) return 'Spotify rate limit reached, try again soon';
              return 'Spotify error $code';
            }

            Future<void> cmd(String method, String path, {Map<String, String>? query}) async {
              try {
                await _send(method, path, query: query);
              } catch (_) {}
            }

            Future<Map<String, dynamic>?> state() async {
              try {
                final res = await _send('GET', '/me/player');
                if (res == null || res.statusCode != 200) return null;
                return Map<String, dynamic>.from(json.decode(utf8.decode(res.bodyBytes)) as Map);
              } catch (_) {
                return null;
              }
            }
          }

          // ---------------------------------------------------------------- following

          class FollowedArtist {
            final String source;
            final String id;
            final String name;
            final String image;
            const FollowedArtist({required this.source, required this.id, required this.name, this.image = ''});

            Map<String, dynamic> toJson() => {'source': source, 'id': id, 'name': name, 'image': image};
            factory FollowedArtist.fromJson(Map<String, dynamic> j) => FollowedArtist(
                  source: (j['source'] ?? 'audius').toString(),
                  id: (j['id'] ?? '').toString(),
                  name: (j['name'] ?? '').toString(),
                  image: (j['image'] ?? '').toString(),
                );
          }

          class FollowService extends ChangeNotifier {
            List<FollowedArtist> artists = [];
            SharedPreferences? _prefs;

            Future<void> init() async {
              _prefs = await SharedPreferences.getInstance();
              final raw = _prefs?.getString('followed');
              if (raw != null) {
                try {
                  artists = (json.decode(raw) as List).map((e) => FollowedArtist.fromJson(Map<String, dynamic>.from(e as Map))).toList();
                } catch (_) {}
              }
            }

            bool isFollowing(FollowedArtist a) => artists.any((x) => x.source == a.source && x.id == a.id);

            Future<void> toggle(FollowedArtist a) async {
              if (isFollowing(a)) {
                artists.removeWhere((x) => x.source == a.source && x.id == a.id);
              } else {
                artists.add(a);
              }
              notifyListeners();
              await _prefs?.setString('followed', json.encode(artists.map((x) => x.toJson()).toList()));
            }
          }

          Future<List<Track>> loadArtistTracks(FollowedArtist a) async {
            if (a.source == 'jamendo') {
              final r = await getList(jamendoUri('/artists/tracks/', {'id': a.id}));
              if (r.isEmpty || r.first is! Map) return <Track>[];
              final tr = ((r.first as Map)['tracks'] as List?) ?? [];
              return jamendoTracks(tr, artist: a.name, image: a.image);
            }
            final r = await getAudius('/users/${a.id}/tracks', {'limit': '100'});
            return audiusTracks(r);
          }

          // ---------------------------------------------------------------- device library

          class DeviceLibrary extends ChangeNotifier {
            final OnAudioQuery _query = OnAudioQuery();
            bool loading = false;
            bool denied = false;
            bool loaded = false;
            List<Track> songs = [];
            Map<String, List<Track>> albums = {};
            Map<String, List<Track>> artists = {};
            Map<String, List<Track>> folders = {};

            Future<void> ensureLoaded() async {
              if (!loaded && !loading) await scan();
            }

            Future<void> scan() async {
              loading = true;
              denied = false;
              notifyListeners();
              try {
                var ok = await _query.permissionsStatus();
                if (!ok) ok = await _query.permissionsRequest();
                if (!ok) {
                  denied = true;
                  loading = false;
                  notifyListeners();
                  return;
                }
                final found = await _query.querySongs(
                  sortType: SongSortType.TITLE,
                  orderType: OrderType.ASC_OR_SMALLER,
                  uriType: UriType.EXTERNAL,
                  ignoreCase: true,
                );
                final s1 = <Track>[];
                final al = <String, List<Track>>{};
                final ar = <String, List<Track>>{};
                final fo = <String, List<Track>>{};
                for (final s in found) {
                  if ((s.duration ?? 0) < 30000) continue;
                  final artist = cleanArtist(s.artist);
                  final t = Track(
                    id: 'dev-${s.id}',
                    title: s.title,
                    artist: artist,
                    url: s.uri ?? 'file://${s.data}',
                    path: s.data,
                    canDownload: false,
                  );
                  s1.add(t);
                  al.putIfAbsent(s.album ?? 'Unknown album', () => []).add(t);
                  ar.putIfAbsent(artist, () => []).add(t);
                  final i = s.data.lastIndexOf('/');
                  fo.putIfAbsent(i > 0 ? s.data.substring(0, i) : '/', () => []).add(t);
                }
                songs = s1;
                albums = al;
                artists = ar;
                folders = fo;
                loaded = true;
              } catch (_) {
                loaded = true;
              }
              loading = false;
              notifyListeners();
            }
          }

          // ---------------------------------------------------------------- DJ deck

          class Deck extends ChangeNotifier {
            final String name;
            final ap.AudioPlayer p = ap.AudioPlayer();
            final List<StreamSubscription<dynamic>> _subs = [];

            Track? track;
            bool playing = false;
            bool loading = false;
            bool loop = false;
            double tempo = 1.0;
            double trim = 1.0;
            double gain = 1.0;
            double master = 1.0;
            Duration pos = Duration.zero;
            Duration dur = Duration.zero;
            Duration? cue;

            Deck(this.name) {
              _subs.add(p.onPlayerStateChanged.listen((s) {
                playing = s == ap.PlayerState.playing;
                notifyListeners();
              }));
              _subs.add(p.onPositionChanged.listen((d) {
                pos = d;
                notifyListeners();
              }));
              _subs.add(p.onDurationChanged.listen((d) {
                dur = d;
                notifyListeners();
              }));
              _subs.add(p.onPlayerComplete.listen((_) {
                pos = Duration.zero;
                playing = false;
                notifyListeners();
              }));
              p.setAudioContext(ap.AudioContextConfig(focus: ap.AudioContextConfigFocus.mixWithOthers).build()).catchError((_) {});
            }

            Future<void> applyVolume() => p.setVolume((trim * gain * master).clamp(0.0, 1.0).toDouble());

            Future<void> load(Track t) async {
              djStarted = true;
              loading = true;
              track = t;
              pos = Duration.zero;
              dur = Duration.zero;
              cue = null;
              notifyListeners();
              try {
                await p.stop();
                await p.setReleaseMode(loop ? ap.ReleaseMode.loop : ap.ReleaseMode.stop);
                await p.setSource(t.deckSource);
                await p.setPlaybackRate(tempo);
                await applyVolume();
                await p.resume();
              } catch (e) {
                toast('Could not load "${t.title}"');
                track = null;
              }
              loading = false;
              notifyListeners();
            }

            Future<void> eject() async {
              try {
                await p.stop();
              } catch (_) {}
              track = null;
              playing = false;
              pos = Duration.zero;
              dur = Duration.zero;
              cue = null;
              notifyListeners();
            }

            Future<void> togglePlay() async {
              if (track == null) return;
              try {
                if (playing) {
                  await p.pause();
                } else {
                  if (dur > Duration.zero && pos >= dur - const Duration(milliseconds: 300)) await p.seek(Duration.zero);
                  await p.resume();
                }
              } catch (_) {}
            }

            Future<void> pause() async {
              if (playing) {
                try {
                  await p.pause();
                } catch (_) {}
              }
            }

            Future<void> seek(Duration d) async {
              if (track == null) return;
              try {
                await p.seek(d);
              } catch (_) {}
            }

            Future<void> skip(int seconds) async {
              var t = pos + Duration(seconds: seconds);
              if (t < Duration.zero) t = Duration.zero;
              if (dur > Duration.zero && t > dur) t = dur;
              await seek(t);
            }

            Future<void> setTempo(double v) async {
              tempo = v.clamp(0.5, 2.0).toDouble();
              notifyListeners();
              try {
                await p.setPlaybackRate(tempo);
              } catch (_) {}
            }

            Future<void> setTrim(double v) async {
              trim = v;
              notifyListeners();
              await applyVolume();
            }

            Future<void> setGain(double g) async {
              gain = g;
              await applyVolume();
            }

            Future<void> toggleLoop() async {
              loop = !loop;
              notifyListeners();
              try {
                await p.setReleaseMode(loop ? ap.ReleaseMode.loop : ap.ReleaseMode.stop);
              } catch (_) {}
            }

            void setCue() {
              if (track == null) return;
              cue = pos;
              notifyListeners();
              toast('Cue point set at ${fmt(pos)}');
            }

            Future<void> goCue() async => seek(cue ?? Duration.zero);

            @override
            void dispose() {
              for (final s in _subs) {
                s.cancel();
              }
              p.dispose();
              super.dispose();
            }
          }

          // ---------------------------------------------------------------- controller

          class PlayerController extends ChangeNotifier {
            final AndroidEqualizer equalizer = AndroidEqualizer();
            final AndroidLoudnessEnhancer loudness = AndroidLoudnessEnhancer();
            late final AudioPlayer audio = AudioPlayer(
              audioLoadConfiguration: AudioLoadConfiguration(
                androidLoadControl: AndroidLoadControl(
                  minBufferDuration: const Duration(seconds: 15),
                  maxBufferDuration: const Duration(seconds: 30),
                  bufferForPlaybackDuration: const Duration(seconds: 2),
                  bufferForPlaybackAfterRebufferDuration: const Duration(seconds: 5),
                  prioritizeTimeOverSizeThresholds: true,
                ),
              ),
              audioPipeline: AudioPipeline(androidAudioEffects: [loudness, equalizer]),
            );
            List<Track> queue = [];
            int index = 0;
            List<Track> favorites = [];
            List<Track> downloads = [];
            final Set<String> downloading = {};
            double speed = 1.0;
            bool shuffle = false;
            LoopMode loop = LoopMode.off;
            DateTime? sleepEnd;
            Timer? _sleepTimer;
            SharedPreferences? _prefs;

            bool spotifyActive = false;
            bool spotifyPlaying = false;
            Duration spPos = Duration.zero;
            Duration spDur = Duration.zero;
            Timer? _spPoll;

            Track? get current => (queue.isNotEmpty && index >= 0 && index < queue.length) ? queue[index] : null;
            bool isFavorite(Track t) => favorites.any((f) => f.id == t.id);
            bool isDownloaded(Track t) => downloads.any((d) => d.id == t.id);

            Future<void> init() async {
              _prefs = await SharedPreferences.getInstance();
              favorites = _load('favorites');
              downloads = _load('downloads').where((t) => File(t.url).existsSync()).toList();
              audio.currentIndexStream.listen((i) {
                if (!spotifyActive && i != null && i != index) {
                  index = i;
                  notifyListeners();
                }
              });
              audio.playerStateStream.listen((_) => notifyListeners());
            }

            List<Track> _load(String key) {
              final raw = _prefs?.getString(key);
              if (raw == null) return [];
              try {
                return (json.decode(raw) as List).map((e) => Track.fromJson(Map<String, dynamic>.from(e as Map))).toList();
              } catch (_) {
                return [];
              }
            }

            Future<void> _save(String key, List<Track> list) async {
              await _prefs?.setString(key, json.encode(list.map((t) => t.toJson()).toList()));
            }

            Future<void> playQueue(List<Track> tracks, int start) async {
              if (tracks.isEmpty || start < 0 || start >= tracks.length) return;
              if (djStarted) {
                deckA.pause();
                deckB.pause();
              }
              final first = tracks[start];
              final same = tracks.where((t) => t.isSpotify == first.isSpotify).toList();
              final s = same.indexWhere((t) => t.id == first.id);
              if (first.isSpotify) {
                await _playSpotify(same.skip(s).take(100).toList());
                return;
              }
              await _stopSpotify();
              final resolved = same.map((t) {
                final local = downloads.where((d) => d.id == t.id);
                return local.isNotEmpty ? local.first : t;
              }).toList();
              queue = resolved;
              index = s;
              notifyListeners();
              try {
                final sources = <AudioSource>[];
                for (var i = 0; i < resolved.length; i++) {
                  final t = resolved[i];
                  sources.add(AudioSource.uri(
                    t.isLocal ? Uri.file(t.url) : Uri.parse(t.url),
                    tag: MediaItem(
                      id: '$i-${t.id}',
                      title: t.title,
                      artist: t.artist,
                      artUri: t.artwork.startsWith('http') ? Uri.parse(t.artwork) : null,
                    ),
                  ));
                }
                await audio.setAudioSource(ConcatenatingAudioSource(children: sources), initialIndex: s);
                await audio.setSpeed(speed);
                audio.play();
              } catch (e) {
                toast('Could not play this item');
              }
            }

            Future<void> _playSpotify(List<Track> list) async {
              await audio.pause();
              queue = list;
              index = 0;
              spotifyActive = true;
              spotifyPlaying = false;
              spPos = Duration.zero;
              spDur = Duration.zero;
              notifyListeners();
              final err = await spotify.play(list.map((t) => t.url).toList());
              if (err != null) {
                spotifyActive = false;
                toast(err);
                notifyListeners();
                return;
              }
              spotifyPlaying = true;
              notifyListeners();
              _spPoll?.cancel();
              _spPoll = Timer.periodic(const Duration(seconds: 3), (_) => _poll());
            }

            Future<void> _poll() async {
              if (!spotifyActive) return;
              final st = await spotify.state();
              if (st == null || !spotifyActive) return;
              spotifyPlaying = st['is_playing'] == true;
              spPos = Duration(milliseconds: (st['progress_ms'] as num?)?.toInt() ?? 0);
              final item = st['item'];
              if (item is Map) {
                spDur = Duration(milliseconds: (item['duration_ms'] as num?)?.toInt() ?? 0);
                final i = queue.indexWhere((t) => t.url == item['uri']);
                if (i >= 0) index = i;
              }
              notifyListeners();
            }

            Future<void> _stopSpotify() async {
              if (!spotifyActive) return;
              spotifyActive = false;
              spotifyPlaying = false;
              _spPoll?.cancel();
              await spotify.cmd('PUT', '/me/player/pause');
            }

            Future<void> togglePlay() async {
              if (spotifyActive) {
                if (spotifyPlaying) {
                  spotifyPlaying = false;
                  notifyListeners();
                  await spotify.cmd('PUT', '/me/player/pause');
                } else {
                  spotifyPlaying = true;
                  notifyListeners();
                  await spotify.cmd('PUT', '/me/player/play');
                }
              } else if (audio.playing) {
                await audio.pause();
              } else {
                if (djStarted) {
                  deckA.pause();
                  deckB.pause();
                }
                audio.play();
              }
            }

            Future<void> next() async {
              if (spotifyActive) {
                await spotify.cmd('POST', '/me/player/next');
                await Future.delayed(const Duration(milliseconds: 800));
                await _poll();
              } else {
                await audio.seekToNext();
              }
            }

            Future<void> previous() async {
              if (spotifyActive) {
                await spotify.cmd('POST', '/me/player/previous');
                await Future.delayed(const Duration(milliseconds: 800));
                await _poll();
              } else {
                await audio.seekToPrevious();
              }
            }

            Future<void> pauseAll() async {
              await audio.pause();
              if (spotifyActive) {
                spotifyPlaying = false;
                await spotify.cmd('PUT', '/me/player/pause');
              }
              notifyListeners();
            }

            Future<void> toggleFavorite(Track t) async {
              if (isFavorite(t)) {
                favorites.removeWhere((f) => f.id == t.id);
              } else {
                favorites.add(t);
              }
              notifyListeners();
              await _save('favorites', favorites);
            }

            Future<void> download(Track t) async {
              if (t.isLive || t.isSpotify || !t.canDownload) {
                toast('This item can only be streamed');
                return;
              }
              if (isDownloaded(t) || downloading.contains(t.id)) return;
              downloading.add(t.id);
              notifyListeners();
              toast('Downloading "${t.title}"...');
              File? file;
              try {
                final base = await getExternalStorageDirectory() ?? await getApplicationDocumentsDirectory();
                final dir = Directory('${base.path}/Music');
                if (!await dir.exists()) await dir.create(recursive: true);
                final safe = t.title.replaceAll(RegExp(r'[^A-Za-z0-9 _-]'), '_');
                file = File('${dir.path}/${t.id.hashCode.abs()}_$safe.mp3');
                final resp = await _client.send(http.Request('GET', Uri.parse(t.url))).timeout(const Duration(seconds: 30));
                if (resp.statusCode != 200) throw 'HTTP ${resp.statusCode}';
                final sink = file.openWrite();
                try {
                  await sink.addStream(resp.stream.timeout(const Duration(seconds: 30)));
                } finally {
                  await sink.close();
                }
                downloads.add(Track(
                  id: t.id,
                  title: t.title,
                  artist: t.artist,
                  url: file.path,
                  artwork: t.artwork,
                  isLocal: true,
                ));
                await _save('downloads', downloads);
                toast('Saved for offline listening');
              } catch (e) {
                try {
                  if (file != null && await file.exists()) await file.delete();
                } catch (_) {}
                toast('Download failed. Check your connection and try again.');
              }
              downloading.remove(t.id);
              notifyListeners();
            }

            Future<void> removeDownload(Track t) async {
              try {
                final f = File(t.url);
                if (await f.exists()) await f.delete();
              } catch (_) {}
              downloads.removeWhere((d) => d.id == t.id);
              notifyListeners();
              await _save('downloads', downloads);
            }

            Future<void> toggleShuffle() async {
              shuffle = !shuffle;
              if (spotifyActive) {
                await spotify.cmd('PUT', '/me/player/shuffle', query: {'state': '$shuffle'});
              } else {
                if (shuffle) await audio.shuffle();
                await audio.setShuffleModeEnabled(shuffle);
              }
              notifyListeners();
            }

            Future<void> cycleLoop() async {
              loop = loop == LoopMode.off ? LoopMode.all : (loop == LoopMode.all ? LoopMode.one : LoopMode.off);
              if (spotifyActive) {
                final state = loop == LoopMode.off ? 'off' : (loop == LoopMode.all ? 'context' : 'track');
                await spotify.cmd('PUT', '/me/player/repeat', query: {'state': state});
              } else {
                await audio.setLoopMode(loop);
              }
              notifyListeners();
            }

            Future<void> setSpeed(double s) async {
              speed = s;
              await audio.setSpeed(s);
              notifyListeners();
            }

            void setSleepTimer(int minutes) {
              _sleepTimer?.cancel();
              sleepEnd = null;
              if (minutes > 0) {
                sleepEnd = DateTime.now().add(Duration(minutes: minutes));
                _sleepTimer = Timer(Duration(minutes: minutes), () {
                  sleepEnd = null;
                  pauseAll();
                });
                toast('Sleep timer: $minutes min');
              } else {
                toast('Sleep timer off');
              }
              notifyListeners();
            }
          }

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await JustAudioBackground.init(
              androidNotificationChannelId: 'com.musicradio.channel.audio',
              androidNotificationChannelName: 'Audio playback',
              androidNotificationOngoing: true,
            );
            await settings.init();
            await spotify.init();
            await follows.init();
            await player.init();
            runApp(const MusicRadioApp());
          }

