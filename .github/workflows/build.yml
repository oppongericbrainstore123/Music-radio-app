name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Generate and Build App
        run: |
          flutter create app_project --org com.musicradio --platforms=android
          cd app_project

          # Write pubspec.yaml with all required multimedia dependencies
          cat << 'EOF' > pubspec.yaml
          name: music_radio_app
          description: A multimedia radio, streaming, and local player app.
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            just_audio: ^0.9.36
            http: ^1.2.0
            path_provider: ^2.1.2
            file_picker: ^6.1.1

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

          # Write lib/main.dart with enhanced radio graphics and universal music search
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:just_audio/just_audio.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:http/http.dart' as http;
          import 'dart:io';
          import 'dart:convert';

          void main() {
            runApp(const MusicRadioApp());
          }

          class MusicRadioApp extends StatelessWidget {
            const MusicRadioApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Music & Radio Hub',
                theme: ThemeData(
                  primarySwatch: Colors.deepPurple,
                  useMaterial3: true,
                  colorScheme: ColorScheme.fromSeed(seedColor: Colors.deepPurple),
                ),
                home: const MainHomeScreen(),
              );
            }
          }

          class MainHomeScreen extends StatefulWidget {
            const MainHomeScreen({super.key});

            @override
            State<MainHomeScreen> createState() => _MainHomeScreenState();
          }

          class _MainHomeScreenState extends State<MainHomeScreen> {
            int _currentIndex = 0;
            final AudioPlayer _audioPlayer = AudioPlayer();
            String _nowPlaying = "Nothing playing";
            bool _isDownloading = false;
            final List<Map<String, dynamic>> _favorites = [];

            @override
            void dispose() {
              _audioPlayer.dispose();
              super.dispose();
            }

            Future<void> _playAudio(String url, String title) async {
              try {
                await _audioPlayer.setUrl(url);
                await _audioPlayer.play();
                setState(() {
                  _nowPlaying = title;
                });
              } catch (e) {
                setState(() {
                  _nowPlaying = "Error playing stream";
                });
              }
            }

            Future<void> _downloadFile(String url, String fileName) async {
              try {
                setState(() => _isDownloading = true);
                final response = await http.get(Uri.parse(url));
                final directory = await getApplicationDocumentsDirectory();
                final file = File('${directory.path}/$fileName');
                await file.writeAsBytes(response.bodyBytes);
                setState(() => _isDownloading = false);
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(content: Text('Downloaded successfully to ${file.path}')),
                  );
                }
              } catch (e) {
                setState(() => _isDownloading = false);
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(content: Text('Download failed. Check your connection.')),
                  );
                }
              }
            }

            void _toggleFavorite(Map<String, dynamic> item) {
              setState(() {
                if (_favorites.contains(item)) {
                  _favorites.remove(item);
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(content: Text('Removed from Favorites'), duration: Duration(milliseconds: 500)),
                  );
                } else {
                  _favorites.add(item);
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(content: Text('Added to Favorites!'), duration: Duration(milliseconds: 500)),
                  );
                }
              });
            }

            @override
            Widget build(BuildContext context) {
              final List<Widget> pages = [
                GlobalRadioTab(onPlay: _playAudio, favorites: _favorites, onToggleFavorite: _toggleFavorite),
                OnlineMusicTab(onPlay: _playAudio, onDownload: _downloadFile, favorites: _favorites, onToggleFavorite: _toggleFavorite),
                FavoritesTab(favorites: _favorites, onPlay: _playAudio),
                LocalFileTab(onPlay: _playAudio),
              ];

              return Scaffold(
                appBar: AppBar(
                  title: const Text('Music & Radio Hub', style: TextStyle(fontWeight: FontWeight.bold)),
                  backgroundColor: Colors.deepPurple.shade100,
                  elevation: 2,
                ),
                body: Column(
                  children: [
                    Expanded(child: pages[_currentIndex]),
                    Container(
                      padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 10),
                      color: Colors.deepPurple.shade50,
                      child: Row(
                        children: [
                          const CircleAvatar(
                            backgroundColor: Colors.deepPurple,
                            child: Icon(Icons.music_note, color: Colors.white),
                          ),
                          const SizedBox(width: 12),
                          Expanded(
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                const Text("NOW PLAYING", style: TextStyle(fontSize: 10, fontWeight: FontWeight.bold, color: Colors.deepPurple)),
                                Text(
                                  _isDownloading ? "Downloading track..." : _nowPlaying,
                                  style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 14),
                                  overflow: TextOverflow.ellipsis,
                                ),
                              ],
                            ),
                          ),
                          IconButton(
                            icon: const Icon(Icons.pause, color: Colors.deepPurple),
                            onPressed: () => _audioPlayer.pause(),
                          ),
                          IconButton(
                            icon: const Icon(Icons.play_arrow, color: Colors.deepPurple, size: 30),
                            onPressed: () => _audioPlayer.play(),
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: _currentIndex,
                  type: BottomNavigationBarType.fixed,
                  selectedItemColor: Colors.deepPurple,
                  unselectedItemColor: Colors.grey,
                  onTap: (index) => setState(() => _currentIndex = index),
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.radio), label: 'Radio'),
                    BottomNavigationBarItem(icon: Icon(Icons.library_music), label: 'Online'),
                    BottomNavigationBarItem(icon: Icon(Icons.favorite), label: 'Favorites'),
                    BottomNavigationBarItem(icon: Icon(Icons.folder), label: 'Local'),
                  ],
                ),
              );
            }
          }

          class GlobalRadioTab extends StatefulWidget {
            final Function(String, String) onPlay;
            final List<Map<String, dynamic>> favorites;
            final Function(Map<String, dynamic>) onToggleFavorite;

            const GlobalRadioTab({super.key, required this.onPlay, required this.favorites, required this.onToggleFavorite});

            @override
            State<GlobalRadioTab> createState() => _GlobalRadioTabState();
          }

          class _GlobalRadioTabState extends State<GlobalRadioTab> {
            List<dynamic> _countries = [];
            List<dynamic> _stations = [];
            String _selectedCountry = "Ghana";
            String _searchQuery = "";
            bool _isLoadingCountries = true;
            bool _isLoadingStations = false;

            @override
            void initState() {
              super.initState();
              _fetchCountries();
              _fetchStations("Ghana");
            }

            Future<void> _fetchCountries() async {
              try {
                final response = await http.get(Uri.parse('https://de1.api.radio-browser.info/json/countries'));
                if (response.statusCode == 200) {
                  final data = json.decode(response.body);
                  setState(() {
                    _countries = data;
                    _isLoadingCountries = false;
                  });
                }
              } catch (e) {
                setState(() => _isLoadingCountries = false);
              }
            }

            Future<void> _fetchStations(String countryName) async {
              setState(() {
                _isLoadingStations = true;
                _selectedCountry = countryName;
              });
              try {
                final encodedCountry = Uri.encodeComponent(countryName);
                final response = await http.get(Uri.parse('https://de1.api.radio-browser.info/json/stations/bycountry/$encodedCountry'));
                if (response.statusCode == 200) {
                  final data = json.decode(response.body);
                  setState(() {
                    _stations = data;
                    _isLoadingStations = false;
                  });
                }
              } catch (e) {
                setState(() => _isLoadingStations = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              final filteredStations = _stations.where((station) {
                final name = (station['name'] ?? '').toLowerCase();
                final tags = (station['tags'] ?? '').toLowerCase();
                return name.contains(_searchQuery.toLowerCase()) || tags.contains(_searchQuery.toLowerCase());
              }).toList();

              return Padding(
                padding: const EdgeInsets.all(12.0),
                child: Column(
                  children: [
                    Card(
                      elevation: 2,
                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                      child: Padding(
                        padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 8),
                        child: Row(
                          children: [
                            const Icon(Icons.public, color: Colors.deepPurple),
                            const SizedBox(width: 12),
                            const Text("Country:", style: TextStyle(fontWeight: FontWeight.bold)),
                            const SizedBox(width: 12),
                            Expanded(
                              child: _isLoadingCountries
                                  ? const LinearProgressIndicator()
                                  : DropdownButtonHideUnderline(
                                      child: DropdownButton<String>(
                                        value: _countries.any((c) => c['name'] == _selectedCountry) ? _selectedCountry : null,
                                        isExpanded: true,
                                        hint: const Text("Select Country"),
                                        items: _countries.map<DropdownMenuItem<String>>((c) {
                                          return DropdownMenuItem<String>(
                                            value: c['name'],
                                            child: Text(c['name'] ?? '', overflow: TextOverflow.ellipsis),
                                          );
                                        }).toList(),
                                        onChanged: (val) {
                                          if (val != null) {
                                            _fetchStations(val);
                                          }
                                        },
                                      ),
                                    ),
                            ),
                          ],
                        ),
                      ),
                    ),
                    const SizedBox(height: 10),
                    TextField(
                      decoration: InputDecoration(
                        labelText: "Search FM station or genre...",
                        prefixIcon: const Icon(Icons.search, color: Colors.deepPurple),
                        border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
                        filled: true,
                        fillColor: Colors.grey.shade50,
                      ),
                      onChanged: (val) => setState(() => _searchQuery = val),
                    ),
                    const SizedBox(height: 10),
                    Expanded(
                      child: _isLoadingStations
                          ? const Center(child: CircularProgressIndicator())
                          : filteredStations.isEmpty
                              ? const Center(child: Text("No FM stations found."))
                              : ListView.builder(
                                  itemCount: filteredStations.length,
                                  itemBuilder: (context, index) {
                                    final station = filteredStations[index];
                                    final name = station['name'] ?? 'Unknown Station';
                                    final url = station['url_resolved'] ?? station['url'] ?? '';
                                    final tags = station['tags'] ?? 'Live FM Broadcast';
                                    final favicon = station['favicon'] ?? '';
                                    
                                    final itemData = {
                                      "title": name,
                                      "subtitle": tags,
                                      "url": url,
                                      "type": "radio",
                                      "artwork": favicon
                                    };
                                    final isFav = widget.favorites.any((f) => f['title'] == name);

                                    return Card(
                                      elevation: 1,
                                      margin: const EdgeInsets.symmetric(vertical: 6),
                                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(10)),
                                      child: ListTile(
                                        leading: ClipRRect(
                                          borderRadius: BorderRadius.circular(8),
                                          child: favicon.isNotEmpty
                                              ? Image.network(
                                                  favicon,
                                                  width: 45,
                                                  height: 45,
                                                  fit: BoxFit.cover,
                                                  errorBuilder: (context, error, stackTrace) => Container(
                                                    width: 45,
                                                    height: 45,
                                                    color: Colors.deepPurple.shade100,
                                                    child: const Icon(Icons.radio, color: Colors.deepPurple),
                                                  ),
                                                )
                                              : Container(
                                                  width: 45,
                                                  height: 45,
                                                  color: Colors.deepPurple.shade100,
                                                  child: const Icon(Icons.radio, color: Colors.deepPurple),
                                                ),
                                        ),
                                        title: Text(name, style: const TextStyle(fontWeight: FontWeight.bold)),
                                        subtitle: Text(tags, maxLines: 1, overflow: TextOverflow.ellipsis),
                                        trailing: Row(
                                          mainAxisSize: MainAxisSize.min,
                                          children: [
                                            IconButton(
                                              icon: Icon(isFav ? Icons.favorite : Icons.favorite_border, color: isFav ? Colors.red : Colors.grey),
                                              onPressed: () => widget.onToggleFavorite(itemData),
                                            ),
                                            IconButton(
                                              icon: const Icon(Icons.play_circle_fill, color: Colors.deepPurple, size: 36),
                                              onPressed: () => widget.onPlay(url, name),
                                            ),
                                          ],
                                        ),
                                      ),
                                    );
                                  },
                                ),
                    ),
                  ],
                ),
              );
            }
          }

          class OnlineMusicTab extends StatefulWidget {
            final Function(String, String) onPlay;
            final Function(String, String) onDownload;
            final List<Map<String, dynamic>> favorites;
            final Function(Map<String, dynamic>) onToggleFavorite;

            const OnlineMusicTab({
              super.key,
              required this.onPlay,
              required this.onDownload,
              required this.favorites,
              required this.onToggleFavorite,
            });

            @override
            State<OnlineMusicTab> createState() => _OnlineMusicTabState();
          }

          class _OnlineMusicTabState extends State<OnlineMusicTab> {
            List<dynamic> _tracks = [];
            bool _isLoading = false;
            final TextEditingController _searchController = TextEditingController(text: "Top Hits");

            @override
            void initState() {
              super.initState();
              _searchMusic("Top Hits");
            }

            Future<void> _searchMusic(String query) async {
              if (query.trim().isEmpty) return;
              setState(() => _isLoading = true);
              try {
                final encoded = Uri.encodeComponent(query);
                final response = await http.get(Uri.parse('https://itunes.apple.com/search?term=$encoded&entity=song&limit=40'));
                if (response.statusCode == 200) {
                  final data = json.decode(response.body);
                  setState(() {
                    _tracks = data['results'] ?? [];
                    _isLoading = false;
                  });
                }
              } catch (e) {
                setState(() => _isLoading = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Padding(
                padding: const EdgeInsets.all(12.0),
                child: Column(
                  children: [
                    TextField(
                      controller: _searchController,
                      decoration: InputDecoration(
                        labelText: "Search any song, artist, or album worldwide...",
                        prefixIcon: const Icon(Icons.search, color: Colors.deepPurple),
                        suffixIcon: IconButton(
                          icon: const Icon(Icons.send, color: Colors.deepPurple),
                          onPressed: () => _searchMusic(_searchController.text),
                        ),
                        border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
                        filled: true,
                        fillColor: Colors.grey.shade50,
                      ),
                      onSubmitted: (val) => _searchMusic(val),
                    ),
                    const SizedBox(height: 10),
                    Expanded(
                      child: _isLoading
                          ? const Center(child: CircularProgressIndicator())
                          : _tracks.isEmpty
                              ? const Center(child: Text("No songs or albums found. Try another search."))
                              : ListView.builder(
                                  itemCount: _tracks.length,
                                  itemBuilder: (context, index) {
                                    final track = _tracks[index];
                                    final title = track['trackName'] ?? 'Unknown Track';
                                    final artist = track['artistName'] ?? 'Unknown Artist';
                                    final album = track['collectionName'] ?? 'Single';
                                    final previewUrl = track['previewUrl'] ?? '';
                                    final artwork = track['artworkUrl100'] ?? '';

                                    final itemData = {
                                      "title": title,
                                      "subtitle": "$artist • $album",
                                      "url": previewUrl,
                                      "type": "music",
                                      "artwork": artwork
                                    };
                                    final isFav = widget.favorites.any((f) => f['title'] == title);

                                    return Card(
                                      elevation: 1,
                                      margin: const EdgeInsets.symmetric(vertical: 6),
                                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(10)),
                                      child: ListTile(
                                        leading: ClipRRect(
                                          borderRadius: BorderRadius.circular(8),
                                          child: artwork.isNotEmpty
                                              ? Image.network(artwork, width: 45, height: 45, fit: BoxFit.cover)
                                              : Container(
                                                  width: 45,
                                                  height: 45,
                                                  color: Colors.deepPurple.shade100,
                                                  child: const Icon(Icons.music_note, color: Colors.deepPurple),
                                                ),
                                        ),
                                        title: Text(title, maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontWeight: FontWeight.bold)),
                                        subtitle: Text("$artist • $album", maxLines: 1, overflow: TextOverflow.ellipsis),
                                        trailing: Row(
                                          mainAxisSize: MainAxisSize.min,
                                          children: [
                                            IconButton(
                                              icon: Icon(isFav ? Icons.favorite : Icons.favorite_border, color: isFav ? Colors.red : Colors.grey),
                                              onPressed: () => widget.onToggleFavorite(itemData),
                                            ),
                                            IconButton(
                                              icon: const Icon(Icons.download, color: Colors.blue),
                                              onPressed: previewUrl.isNotEmpty
                                                  ? () => widget.onDownload(previewUrl, "$title - $artist.m4a")
                                                  : null,
                                            ),
                                            IconButton(
                                              icon: const Icon(Icons.play_circle_fill, color: Colors.deepPurple, size: 36),
                                              onPressed: previewUrl.isNotEmpty
                                                  ? () => widget.onPlay(previewUrl, title)
                                                  : null,
                                            ),
                                          ],
                                        ),
                                      ),
                                    );
                                  },
                                ),
                    ),
                  ],
                ),
              );
            }
          }

          class FavoritesTab extends StatelessWidget {
            final List<Map<String, dynamic>> favorites;
            final Function(String, String) onPlay;

            const FavoritesTab({super.key, required this.favorites, required this.onPlay});

            @override
            Widget build(BuildContext context) {
              if (favorites.isEmpty) {
                return const Center(
                  child: Text("Your bookmarked favorite stations and songs appear here.", style: TextStyle(color: Colors.grey)),
                );
              }
              return ListView.builder(
                padding: const EdgeInsets.all(12),
                itemCount: favorites.length,
                itemBuilder: (context, index) {
                  final item = favorites[index];
                  return Card(
                    child: ListTile(
                      leading: item['artwork'] != null && item['artwork'].toString().isNotEmpty
                          ? Image.network(item['artwork'], width: 45, height: 45, fit: BoxFit.cover, errorBuilder: (_,__,___) => const Icon(Icons.star))
                          : const CircleAvatar(child: Icon(Icons.star)),
                      title: Text(item['title'] ?? '', style: const TextStyle(fontWeight: FontWeight.bold)),
                      subtitle: Text(item['subtitle'] ?? '', maxLines: 1, overflow: TextOverflow.ellipsis),
                      trailing: IconButton(
                        icon: const Icon(Icons.play_circle_fill, color: Colors.deepPurple, size: 36),
                        onPressed: () => onPlay(item['url'], item['title']),
                      ),
                    ),
                  );
                },
              );
            }
          }

          class LocalFileTab extends StatelessWidget {
            final Function(String, String) onPlay;

            const LocalFileTab({super.key, required this.onPlay});

            @override
            Widget build(BuildContext context) {
              return Center(
                child: ElevatedButton.icon(
                  onPressed: () async {
                    FilePickerResult? result = await FilePicker.platform.pickFiles(type: FileType.audio);
                    if (result != null && result.files.single.path != null) {
                      onPlay(result.files.single.path!, result.files.single.name);
                    }
                  },
                  icon: const Icon(Icons.folder_open),
                  label: const Text("Browse Local Audio Files"),
                ),
              );
            }
          }
          EOF

          # Inject Internet Permission into AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' $MANIFEST
          fi

          # Update minSdk to 24 for audio and storage plugins
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' $BUILD_GRADLE
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' $BUILD_GRADLE
          fi

          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: 'app_project/build/app/outputs/flutter-apk/app-release.apk'
