name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Generate and Build App
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: |
          flutter create app_project --org com.musicradio --platforms=android
          MAIN=$(find mobile_app -name main.dart | head -n 1)
          PUB=$(find mobile_app -name pubspec.yaml | head -n 1)
          PATCH=$(find mobile_app -name patch.py | head -n 1)
          echo "Using: $MAIN | $PUB | $PATCH"
          cp "$PUB" app_project/pubspec.yaml
          cp "$MAIN" app_project/lib/main.dart
          cd app_project
          python3 "../$PATCH"
          flutter pub get
          flutter build apk --release \
            --dart-define=SPOTIFY_CLIENT_ID="$SPOTIFY_CLIENT_ID" \
            --dart-define=JAMENDO_CLIENT_ID="$JAMENDO_CLIENT_ID"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app_project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
