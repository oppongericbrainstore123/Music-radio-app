name: music_radio_app
description: Music streaming, offline player, DJ studio and global FM radio.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.36
  just_audio_background: ^0.0.1-beta.11
  audioplayers: 6.0.0
  cached_network_image: ^3.3.1
  http: ^1.2.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  flutter_appauth: ^6.0.2
  on_audio_query: ^2.9.0
  speech_to_text: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
